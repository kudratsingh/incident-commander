name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository: these jobs lint, test, and boot a
# stack from a PUBLIC ghcr.io package (deliberately no registry secret — see
# the contract job). Declaring the floor explicitly means a future job that
# does need to write has to ask for it in its own `permissions:` block
# rather than inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  check:
    name: check (lint + types)
    runs-on: ubuntu-latest
    # Every job is bounded. Without this, a hang runs to GitHub's six-hour
    # default while holding the concurrency slot — a working day before
    # anyone learns the check never ran. `check` is ~2 minutes warm.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.11.28"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: make check
        run: make check

  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    # Integration tests manage their own containers, so this covers image
    # pulls as well as the suite itself.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.11.28"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: make test
        run: make test

  # The live contract diff. tests/integration/test_contract_snapshot.py skips
  # itself unless PLATFORM_MCP_URL/PLATFORM_TOKEN are set, so until this job
  # existed the "CI runs the contract diff" claim in CLAUDE.md and in that
  # test's docstring was aspirational and platform drift was caught only by
  # hand (S-15). Unconditional (no paths filter): CLAUDE.md lists `contract`
  # among the CI checks, and drift originates on the platform side, so a
  # filter on this repo's files would miss exactly the case that matters.
  contract:
    name: contract
    runs-on: ubuntu-latest
    # The job most in need of a bound: it boots a five-service compose stack
    # and then WAITS — on healthchecks, on the REST app, on the eval-fixture
    # seeder, each of which is a place it can hang rather than fail. It also
    # gates both platform checks, so six hours of silence here is six hours
    # of not knowing whether the contract drifted.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.11.28"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # No docker/login-action and no registry secret: ghcr.io/kudratsingh/
      # incident-platform is a public package, so an anonymous ghcr.io pull
      # token resolves the pinned digest. demo/compose.yml is used AS-IS —
      # the pinned digest and nothing else. Never `:latest` and never a
      # locally built master image, which would diff against a snapshot
      # blessed from a different build.
      #
      # (This comment used to describe the v0.4.9 pin and a 26-tool
      # snapshot. Both moved with the v0.5.0 pin bump in #120; the pin
      # itself lives in demo/compose.yml, which is the one place to read
      # it.)
      - name: Boot the pinned demo stack
        run: |
          # Pull first, with retries. `up` does the pull implicitly, but a
          # registry hiccup then reads as "the stack failed to boot" — and
          # this job gates BOTH the schema diff and the fixture-drift check,
          # so an infrastructure blip presents as a platform-contract
          # failure. Seen on 2026-08-16: "received unexpected HTTP status:
          # 502 Bad Gateway" pulling postgres.
          for attempt in 1 2 3; do
            if docker compose -f demo/compose.yml pull --quiet \
                 postgres redis redpanda platform api; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "image pull failed three times — registry, not this branch" >&2
              exit 1
            fi
            echo "pull failed (attempt ${attempt}/3); retrying in 15s"
            sleep 15
          done
          docker compose -f demo/compose.yml up -d --wait \
            postgres redis redpanda platform api

      - name: Mint a platform service-account token
        run: |
          # `up --wait` clears the compose healthchecks (start_period 30s), but
          # the platform service seeds the eval fixture pack at boot
          # (SEED_EVAL_FIXTURES=true), which adds startup latency on top. Give
          # the REST app on :8000 — which bootstrap registers and logs in
          # against — three more chances before giving up.
          for attempt in 1 2 3; do
            if curl -fsS http://localhost:8000/healthz >/dev/null; then
              break
            fi
            echo "REST API not ready yet (attempt ${attempt}/3); sleeping 10s"
            sleep 10
          done
          curl -fsS http://localhost:8000/healthz >/dev/null

          # demo/compose.yml declares `name: incident-commander-demo`, so the
          # postgres container is incident-commander-demo-postgres-1. The
          # script's default names the platform's OWN dev stack, which does
          # not exist here.
          # Retried: the script does five stateful steps — register,
          # promote via direct SQL, log in, create-or-get the service
          # account, mint a token — with no retry of its own, against a
          # stack that is still seeding itself. Seen on 2026-08-16: a 404
          # minting the token, which passed unchanged on a re-run. The
          # script is idempotent by design (register tolerates 409,
          # create-or-get reuses), so repeating it is safe.
          for attempt in 1 2 3; do
            if out="$(uv run python scripts/bootstrap_agent_token.py \
                 --postgres-container incident-commander-demo-postgres-1)"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "bootstrap failed three times — not a transient" >&2
              exit 1
            fi
            echo "bootstrap failed (attempt ${attempt}/3); retrying in 10s"
            sleep 10
          done

          # The script prints BOTH tokens in plaintext. Register the masks
          # BEFORE anything echoes its output: the stack dies with the job but
          # run logs are forever.
          token="$(printf '%s\n' "$out" | sed -n 's/^PLATFORM_TOKEN=//p')"
          smoke="$(printf '%s\n' "$out" | sed -n 's/^PLATFORM_SMOKE_TOKEN=//p')"
          if [ -z "$token" ]; then
            echo "bootstrap_agent_token.py printed no PLATFORM_TOKEN line"
            exit 1
          fi
          # The fixture-drift step below reads the platform under the
          # read-scoped principal and refuses to fall back to the write one,
          # so an absent smoke token is a hard failure here rather than a
          # silently skipped check.
          if [ -z "$smoke" ]; then
            echo "bootstrap_agent_token.py printed no PLATFORM_SMOKE_TOKEN line"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$smoke"
          printf '%s\n' "$out"

          # Masked above, so they are redacted anywhere they could resurface.
          echo "PLATFORM_TOKEN=$token" >> "$GITHUB_ENV"
          echo "PLATFORM_SMOKE_TOKEN=$smoke" >> "$GITHUB_ENV"

      - name: make test-contract
        # PLATFORM_TOKEN arrives from the masked GITHUB_ENV write above.
        env:
          PLATFORM_MCP_URL: http://localhost:8001/mcp
        run: make test-contract

      # Wait for the SEEDER, not just for the app. `up --wait` clears the
      # healthchecks and the loop above clears the REST app, but nothing
      # waited for SEED_EVAL_FIXTURES to finish writing the fixture pack —
      # test-contract never noticed because tools/list needs no data. The
      # first run of the drift step did notice: it compared every fixture
      # against an empty world and reported 64 confident falsehoods.
      - name: Wait for the eval fixture pack
        env:
          PLATFORM_MCP_URL: http://localhost:8001/mcp
        run: PYTHONPATH=. uv run python scripts/fixture_drift.py --await-fixtures 90

      # The value-level half of the same question, against the same stack:
      # test-contract asks whether the tool SCHEMAS still match, this asks
      # whether the canned fixture VALUES are ones the platform can produce.
      # Nothing asked that before, which is how consumer_lag_high asserted
      # lag 1200 against a live 0 for months while the suite stayed green.
      # Runs under PLATFORM_SMOKE_TOKEN (telemetry:read + incidents:read):
      # a check that measures the world must not hold a principal that can
      # change it, and the compose stack is seeded (SEED_EVAL_FIXTURES=true)
      # so the values it reads are the pinned fixture pack.
      - name: make test-drift
        env:
          PLATFORM_MCP_URL: http://localhost:8001/mcp
        run: make test-drift

      # The wire-level idempotency contract. Until now it executed in NO CI
      # job: the `test` job runs it without PLATFORM_MCP_URL/PLATFORM_TOKEN
      # so it self-skips, and this job ran only the schema and fixture-value
      # checks — while ADR 0008 removed the client-side execute-once guard on
      # the strength of exactly this test, leaving Tier-1 crash-resume
      # defended by an unverified wire contract (WO-R2-43). The loop leans on
      # it harder as of WO-R2-39, which re-invokes on a crash-resumed
      # REMEDIATING run rather than escalating.
      #
      # LAST, deliberately. This is the only step here that WRITES: it fires
      # the kill_consumer chaos hook and restarts worker-dispatcher several
      # times. test-contract reads schemas and test-drift compares canned
      # fixture VALUES against this same stack, so running the mutations
      # first would surface as fixture drift — the "64 confident falsehoods"
      # shape the fixture-wait step above already exists to prevent. Nothing
      # reads the stack after this point.
      #
      # Runs under the write-scoped PLATFORM_TOKEN (actions:execute +
      # chaos:invoke, minted above), not the read-only smoke token that
      # test-drift holds.
      - name: make test-idempotency
        env:
          PLATFORM_MCP_URL: http://localhost:8001/mcp
        run: make test-idempotency

      - name: Dump stack state on failure
        if: failure()
        run: |
          docker compose -f demo/compose.yml ps
          docker compose -f demo/compose.yml logs --tail=200 platform api

      # Tearing the stack down on an ephemeral GitHub runner is NOT the
      # `make demo-down` discipline the runbook guards: there is no operator
      # stack here and no long-lived volume to orphan, just a VM about to be
      # destroyed. Leaving containers up would only slow the runner's cleanup.
      - name: Tear down the demo stack
        if: always()
        run: docker compose -f demo/compose.yml down

name: evals

on:
  pull_request:
    branches: [main]
    paths:
      - "src/incident_commander/agent/**"
      - "src/incident_commander/tools/**"
      - "src/incident_commander/llm/**"
      - "src/incident_commander/config.py"
      - "contracts/platform-tools.snapshot.json"
      - "evals/graders/**"
      - "evals/runner.py"
      - "evals/scenarios/**"
      - "evals/reports/baseline.json"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-regression:
    name: eval regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.11.28"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: make eval-reg
        run: make eval-reg

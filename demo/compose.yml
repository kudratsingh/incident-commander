# Live demo: minimal platform footprint sufficient for read-only MCP.
#
# Pinned to the incident-platform v0.2.1 release by digest so the agent's
# contract expectations don't shift under us. Bump the digest whenever the
# platform ships a new release and rerun `make eval-live` to catch drift.
#
# Services:
#   postgres  — platform's system of record (agent uses its own DB, not this)
#   redis     — platform's cache / pub-sub
#   platform  — MCP process only (the REST/frontend surfaces aren't needed
#               for read-only eval)
#
# The agent process is not part of this compose. It runs on the host so
# `make eval-live` can reach the MCP endpoint at http://localhost:8001/mcp.

name: incident-commander-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_platform
    # No host port binding — the platform service reaches postgres over the
    # compose network. Publishing 5432:5432 collides with a host-side postgres
    # (common on dev machines). Same rationale for redis below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # No host port binding — see postgres above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform:
    # incident-platform v0.3.0. Do not switch to `:latest` — the whole point
    # of pinning by digest is that a platform-side prompt or schema change
    # can't shift agent behavior without an explicit bump here.
    image: ghcr.io/kudratsingh/incident-platform@sha256:5a890ed69ebdf1b046ffe32a2e3f3f2639a5e5d38b9e2fe51217739a4fbed53a
    # v0.3.0 is amd64-only. On Apple Silicon this runs under Rosetta (slower
    # cold start, correct output). Drop this line when the platform ships a
    # multi-arch build (docker buildx --platform linux/amd64,linux/arm64).
    platform: linux/amd64
    # Host port is env-configurable so a native platform (or anything else)
    # on 8001 doesn't collide. Override with DEMO_MCP_HOST_PORT and match
    # PLATFORM_MCP_URL in .env accordingly.
    ports:
      - "${DEMO_MCP_HOST_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # v0.2.1+: auto-seed the eval fixture pack (consumer groups, DLQ jobs,
      # incidents, DAG jobs, traces, deploys) on every boot. Idempotent —
      # existing rows are left alone. See /app/eval-fixtures-pins.json in
      # the container for the pinned UUIDs the agent scenarios reference.
      SEED_EVAL_FIXTURES: "true"
      # v0.3.0+: register the 5 chaos hooks (kill_consumer, poison_message,
      # saturate_redis, inject_latency, bad_deploy). Required for the
      # `make chaos-*` targets and the live remediation-loop scenarios
      # that need a real broken state to fix. Triple-gated on the
      # platform side — refuses to enable in prod. See docs/runbook.md.
      CHAOS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - "alembic upgrade head && uvicorn app.mcp.standalone:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

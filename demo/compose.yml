# Live demo: full platform footprint sufficient for remediation eval.
#
# Pinned to the incident-platform v0.6.16 release by digest so the agent's
# contract expectations don't shift under us. Every platform-code service
# below uses the SAME pinned digest. Bump the digest whenever the platform
# ships a new release and rerun `make eval-live` to catch drift.
#
# Services (6 long-running + 2 one-shots):
#   postgres      — platform's system of record (agent uses its own DB)
#   redis         — platform's cache / pub-sub
#   redpanda      — Kafka API (consumer-lag scenarios need real consumers);
#                   redpanda-init (one-shot) creates the 6-partition topics
#   migrate       — one-shot alembic upgrade; app services wait on it so
#                   two services never race the schema
#   platform      — standalone MCP process (port 8001)
#   api           — REST app on 8000. ALSO hosts the consumer groups: the
#                   dev stack runs no separate worker service — the single
#                   worker process (8 consumer groups incl. worker-dispatcher)
#                   lives inside this process. The traffic loop and future
#                   bootstrap_agent_token REST mints need this too.
#   console       — the platform's own operator console (React SPA behind
#                   nginx) on 3000, added with v0.6.13 for the live demo. Its
#                   nginx proxies /api/ to $API_UPSTREAM, which is why one
#                   image serves both the platform's own compose (service
#                   `app`) and this one (service `api`).
#
# The agent process is not part of this compose. It runs on the host so
# `make eval-live` can reach the MCP endpoint at http://localhost:8001/mcp.
#
# Deliberately absent vs the dev stack: minio (report_gen artifact storage)
# and jaeger (OTLP). If stage-2 job processing turns out to need storage,
# add minio here rather than pointing at a host service.

name: incident-commander-demo

services:
  postgres:
    image: postgres:16-alpine
    # Named volume, not the image's anonymous one. The platform's Postgres
    # holds the immutable audit log — CLAUDE.md invariant 6's ground truth
    # for grading safety, and the evidence that settled the Run 001
    # principal question. An anonymous volume is orphaned by any
    # down/up cycle, silently starting the next run on an empty audit log.
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_platform
    # No host port binding — the platform service reaches postgres over the
    # compose network. Publishing 5432:5432 collides with a host-side postgres
    # (common on dev machines). Same rationale for redis below.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - demo_redisdata:/data
    # No host port binding — see postgres above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    # Copied from the dev compose (config parity — env drift between
    # stacks is platform bug #69's class). No host port publish: the
    # agent's rpk checks run via `docker compose exec redpanda rpk`.
    #
    # Pinned by MANIFEST-LIST digest — never `:latest`, same standing
    # decision as the platform image below. `:latest` let the broker and
    # the redpanda-init rpk client resolve different builds on different
    # days (rpk/broker skew), and an upstream major can move rpk flags or
    # broker timing under the consumer-lag scenarios. The digest below is
    # the multi-arch list (linux/amd64 + linux/arm64), NOT a per-platform
    # digest: the demo runs native on Apple Silicon and on amd64 CI, and a
    # single-platform digest breaks one of them at pull time.
    #
    # Bump procedure: pick the new release tag, resolve its manifest list
    # with `docker buildx imagetools inspect redpandadata/redpanda:<tag>`
    # (the top-level `Digest:` — confirm it lists both platforms), update
    # BOTH this ref and redpanda-init's to the identical string, re-check
    # the rpk invocations here and in redpanda-init against that version's
    # rpk, then bring the stack up once deliberately.
    image: redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
    # Named volume, mirroring the postgres rationale above. The image
    # declares `VOLUME /var/lib/redpanda/data`, so without this the Kafka
    # event log and every consumer-group offset lived on an anonymous
    # volume that `docker compose down` orphans — platform CLAUDE.md puts
    # half the truth in Kafka, and a routine stop deleted it. Wiping is
    # `make demo-destroy` (down -v), which is gated on CONFIRM=1.
    volumes:
      - demo_redpandadata:/var/lib/redpanda/data
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    # One-shot: creates the 6-partition topics the dispatcher consumes.
    # Copied verbatim from the dev compose.
    #
    # Byte-identical to the broker's ref above, deliberately: this service
    # is only here for its rpk client, and rpk/broker skew is exactly what
    # the pin closes. Bump both or neither.
    image: redpandadata/redpanda:v26.2.1@sha256:9a47c1f8d6736f98fa2616f6f0b715c051cb0bdac1a1176e38321bf45a5b572d
    depends_on:
      redpanda:
        condition: service_healthy
    # Idempotent, unlike the dev compose's verbatim init: `rpk topic
    # create` exits 1 on an existing topic, and `make demo` re-runs on a
    # live stack fail at --wait if this one-shot hard-fails. TOPIC_ALREADY
    # _EXISTS is success for our purposes; real broker failures still
    # surface when the consumers boot.
    entrypoint: >
      /bin/bash -c "
        for t in job.submitted job.progress job.completed job.failed job.dlq; do
          rpk topic create $$t --brokers=redpanda:9092 --partitions=6 --replicas=1 || true;
        done
      "

  migrate:
    # One-shot schema migration, mirroring the dev compose's migrate
    # service: with two app-code services (mcp + api) neither should
    # race `alembic upgrade head` at boot.
    image: ghcr.io/kudratsingh/incident-platform:v0.6.16@sha256:ad3b37768b508936300446df9d76da8a799a88dc179fb40fbbd60c10f22ce865
    platform: linux/amd64
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      PYTHONPATH: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  platform:
    # incident-platform v0.6.16 (INDEX digest published by the platform
    # release, confirmed with `docker buildx imagetools inspect` — the
    # top-level `Digest:`, not a per-platform child manifest).
    #
    # What v0.6.9 changed (plat #210 + #211 + #212): TWO NEW TOOLS, and no
    # existing tool's name, description or schema moved.
    #   * `get_outbox_status` — an agent-facing read tool (`telemetry:read`,
    #     no arguments) reporting how the transactional outbox is draining:
    #     the unpublished row count, the oldest and newest unpublished rows
    #     with their ages, how many are past the attempt limit, when the
    #     last publish happened, and when the relay last ticked. It says
    #     "last tick N seconds ago" whatever stopped the relay — it never
    #     says why, so a paused relay and a crashed one read alike.
    #   * `pause_control_loop` — a LAB hook (`chaos:invoke`, description
    #     prefixed `[chaos: single_loop]`), never reachable by the agent's
    #     own token. `BlastRadius` gained `single_loop` for it.
    # Tool count with CHAOS_ENABLED=true: 30 → 32. The new Redis key
    # `outbox:relay:last_tick` sits outside `chaos:*` and so is untouched by
    # `make eval-reset`.
    #
    # What v0.6.10 changed (plat #214, platform ADR 0029): ONE NEW LAB HOOK
    # and one lab hook's inputs widened. NOTHING joins the agent's read
    # surface, and no existing agent-facing tool moved.
    #   * `pause_dag_chaos` — a LAB hook (`chaos:invoke`, description
    #     prefixed `[chaos: environment_wide]`), the 12th. It writes the same
    #     `dag:paused:<root>` flag the Tier-1 action `pause_dag` writes, with
    #     a TTL, so `get_dag_state` reads `paused: true` exactly as after an
    #     operator pause — a pause set by the lab is indistinguishable from
    #     one set by a human (ADR 0012). The agent's own token cannot reach
    #     the hook; `pause_dag` itself is unchanged.
    #   * `create_stuck_dag` — INPUT gains `root_status` (`dead_letter`
    #     default = today's chain, or `completed` = a STRANDED chain: root
    #     completed, descendants still `waiting`, and NO dead-letter row at
    #     all), `child_age_seconds` (0..86400, backdates the whole chain) and
    #     `failed_step` (1..10, only with `completed`: the descendants before
    #     it complete, that one dead-letters, the rest wait). OUTPUT gains
    #     `step_job_ids` and `dead_letter_job_id`, and `waiting_job_ids` now
    #     lists only the descendants actually waiting. Description rewritten
    #     for the two shapes. Every new input is OPTIONAL with its old
    #     behaviour as the default, so no scenario's wired arguments move
    #     (ADR 0043 keys a recorded world by those arguments). A repeat call
    #     with a different shape under the same `chain_name` is refused
    #     `stuck_chain_name_in_use` — the code the hook already raised for a
    #     drifted chain, so no new refusal and no new `BlastRadius` member.
    # Tool count with CHAOS_ENABLED=true: 32 → 33 (12 of them chaos).
    #
    # What v0.6.11 changed (plat #217 + #218, platform ADRs 0030 and 0031):
    # TWO NEW AGENT-FACING READ TOOLS, TWO NEW LAB HOOKS, and twelve output
    # fields on one existing read tool. No existing agent-facing tool moved
    # name or tier, and nothing left the surface.
    #   * `get_slo_status` — a read tool (`telemetry:read`, no arguments)
    #     surfacing the objective computation that until now had exactly one
    #     caller, an admin REST route: per objective the target, the window,
    #     the settled total, the budget left, the burn rate and whether it is
    #     fast-burning. An alert saying an objective is missed could be
    #     neither confirmed nor refuted from the tool surface before this.
    #     `total: 0` is named in the description as an absence of evidence,
    #     not health, and an unbounded burn rate reads `null` — above every
    #     threshold, not unknown.
    #   * `get_circuit_breakers` — a read tool (`telemetry:read`, no
    #     arguments) reporting per breaker its state (`closed` / `open` /
    #     `half_open`), the consecutive failure count against its own
    #     threshold, a wall-clock `last_state_change_at` and a failure reason
    #     CLASS (`timeout` / `connection` / `other` — never the error text).
    #     State lives in Redis under `breaker:state:<name>` (ADR 0030)
    #     precisely so a reader in another process can see it: the registry
    #     is in-process and the MCP server is a separate process (ADR 0006),
    #     so a tool walking the registry reported every breaker closed.
    #   * `get_postgres_health` — OUTPUT gains twelve fields and a rewritten
    #     description. Five pool numbers (`pool_size`, `pool_checked_out`
    #     including the call's own connection, `pool_overflow`,
    #     `pool_max_overflow`, `pool_wait_timeouts_1m`) with
    #     `pool_stats_unknown_reason` for why they are null; two live query
    #     readings from `pg_stat_activity` (`longest_active_query_ms`,
    #     `active_queries_over_slow_threshold`) with `slow_query_threshold_ms`
    #     as their yardstick; and `p95_query_ms_1m` / `slow_query_count_1m`
    #     ALWAYS null with `query_stats_unknown_reason` saying which of three
    #     cases it is — `pg_stat_statements` is not installed here and could
    #     not answer a one-minute percentile if it were (O-28, WO-R3-289).
    #     THE POOL FIELDS DESCRIBE THE PROCESS THAT ANSWERED, and that is
    #     this MCP service, not the api service the worker loops live in — so
    #     a pool held in the worker reads perfectly healthy here. The
    #     description says so in as many words; ADR 0030 leaves the gap open.
    #   * `saturate_db_pool` and `degrade_downstream` — LAB hooks
    #     (`chaos:invoke`, descriptions prefixed `[chaos: …]`), the 13th and
    #     14th, never reachable by the agent's own token. The first holds
    #     connections out of the WORKER process's pool (always leaving four
    #     acquirable, so the loops slow rather than stop); the second makes
    #     the simulated bulk-api-sync endpoints fail (opening the shipped
    #     `bulk-api-sync` breaker at its threshold of three) or answer late.
    # Tool count with CHAOS_ENABLED=true: 33 → 37 (14 of them chaos); the
    # agent's read surface 14 → 16.
    #
    # What v0.6.12 changed (plat #219 + #220, platform ADRs 0032 and 0034):
    # ONE NEW LAB HOOK and one lab hook's inputs and outputs widened. NOTHING
    # joins the agent's read surface, no agent-facing tool moved, and the read
    # tier stays at 16.
    #   * `slow_db_queries` — a LAB hook (`chaos:invoke`, description prefixed
    #     `[chaos: shared_dependency]`), the 15th. `target` is a closed
    #     three-member enum (`job_reads`, `audit_reads`, `outbox_reads`), one
    #     relation each; `query_ms` 1100..10000 (default 2000); `ttl_seconds`
    #     1..3600 (default 300). Two real reads of that relation run at once
    #     in the WORKER process, offset by half a chunk, each held open by a
    #     server-side sleep — so `get_postgres_health` reads
    #     `longest_active_query_ms` ≈ query_ms and
    #     `active_queries_over_slow_threshold` ≥ 1 from `pg_stat_activity`,
    #     which is the same answer whichever process asks. Its own `pool_*`
    #     counters stay normal (the fault is in another process's pool, and it
    #     always leaves the free floor), and `p95_query_ms_1m` stays null as
    #     always. It does NOT slow the platform's own work: job durations,
    #     consumer lag, the outbox and the SLO readings are untouched. This is
    #     the mirror image of `saturate_db_pool`, and the pair is what tells
    #     the two faults apart (platform ADR 0034).
    #   * `kill_consumer` — INPUT gains `sticky` (`bool`, default `false` =
    #     today's kill byte for byte); OUTPUT gains `sticky`, `sticky_key`
    #     (the second key a sticky kill wrote, or null) and `expires_at` (when
    #     this kill ends); description rewritten around the option.
    #     THE BEHAVIOUR CHANGE IS IN A TOOL THIS DOES NOT TOUCH: under a
    #     sticky kill `restart_consumer_group` is unmodified — it deletes the
    #     flag and truthfully answers `kill_key_cleared: true` and
    #     `accepted: true` — and the group stays down, because the kill-state
    #     read re-arms the flag with `PXAT` before the supervisor restarts
    #     anything. That is what keeps ADR 0012 rule 1 intact where a refusal
    #     would have leaked the lab, and it means a caller must read the
    #     group's own state rather than infer recovery from the reply. The
    #     window is ABSOLUTE in two independent ways (the deadline in the
    #     marker's value and the marker's own Redis TTL), so no number of
    #     restarts extends it, and `make eval-reset`'s `chaos:*` sweep clears
    #     it (platform ADR 0032).
    # Tool count with CHAOS_ENABLED=true: 37 → 38 (15 of them chaos); the
    # agent's read surface unchanged at 16.
    #
    # What v0.6.13 changed (plat #223 + #224, platform ADR 0035): TWO NEW
    # WRITE TOOLS THE AGENT'S PLANNER NEVER SEES, one new scope, and one
    # audit stream withheld from the agent. NOTHING joins the agent's read
    # surface and no existing tool moved.
    #   * `report_agent_run` and `report_agent_briefing` — the commander's own
    #     telemetry, descriptions prefixed `[commander: telemetry]` and scoped
    #     `agent_runs:write` (the 6th scope). They write the `agent_runs` table
    #     the operator console reads: run state, phase history, current
    #     hypothesis, last step, and once per run the rendered briefing. The
    #     commander calls them from the loop's checkpoint hook, NOT from the
    #     planner's tool list — `[commander:` is filtered out of the typed
    #     registry exactly as `[chaos:` is, so the planner's page cannot move
    #     when telemetry does. `report_agent_run` upserts by a
    #     caller-supplied `run_id` and appends to `phase_history` on a state
    #     change; a report after a terminal state 409s
    #     (`agent_run_already_finished`) and a second briefing 409s
    #     (`agent_run_briefing_already_recorded`).
    #   * ADR 0012 still holds in BOTH directions, which is the point of the
    #     design: there is no read tool for `agent_runs` at all, and the
    #     agent's `list_audit_events` / `get_trace` now withhold the
    #     `agent.run_reported` rows these two tools write. So the agent cannot
    #     read back what it reported, and the console (a human operator over
    #     REST) is the only reader.
    # Tool count with CHAOS_ENABLED=true: 38 → 40 (15 of them chaos, 2 of them
    # `[commander:`); the agent's read surface unchanged at 16.
    #
    # What v0.6.14 changed (plat #225 + #226 + #227, platform ADRs 0033 and
    # 0036, ADR 0031 amended): NO NEW TOOL. The count stays at 40 (15 chaos,
    # 16 read) and no scope moves. One read tool's output grew, one hook's
    # description lost a clause, and two behaviours changed with no schema to
    # show it.
    #   * `get_postgres_health` gains `pools` — one entry per process that has
    #     published its own connection pool recently (`$defs.PoolGaugeReading`:
    #     `process`, `size`, `checked_out`, `overflow`, `max_overflow`,
    #     `wait_timeouts_1m`, `written_at`, `reported_age_s`) — and
    #     `pool_gauges_unknown_reason`, which is null exactly when at least one
    #     process reported. This is the fix for the hole ADR 0030 left open: the
    #     five flat `pool_*` fields describe only the process that ANSWERED the
    #     call, which is the MCP server, while `saturate_db_pool` holds the
    #     api/worker pool — so until now the fault was real and unreadable from
    #     the agent's surface (platform ADR 0033, WO-R3-289). A reading is a
    #     SAMPLE on a ten-second cadence with a 60 s TTL, not a live number, so
    #     a process that stops publishing drops out of the list rather than
    #     freezing at its last healthy figure — and an absent process says
    #     nothing about its pool. The tool's description is rewritten around
    #     that (WHOSE POOL, TELLING SLOW QUERIES FROM A FULL POOL, UNKNOWN IS
    #     NULL and a new AN ABSENT PROCESS IS NOT A HEALTHY ONE).
    #   * `saturate_db_pool`'s description drops the clause this made false —
    #     it used to say a pool reading taken in the MCP process "does not show
    #     this fault", which `pools` now contradicts. Its schema is unchanged.
    #   * Behaviour with no schema to show it, so read it here and not from the
    #     contract diff. (a) `make eval-reset` now reports `hot_set_reseeded`,
    #     `breakers_reset` and `agent_runs_closed`, rewrites `breaker:state:*`
    #     CLOSED rather than deleting it (an absent record is unknown, not
    #     closed), and raises `breaker:reset:at` so the worker's in-memory
    #     breaker registry forgets without a process restart (platform ADR
    #     0036). (b) A `bulk_api_sync` job whose EVERY endpoint call failed now
    #     raises unconditionally and dead-letters, flag or no flag, and the
    #     DLQ `error_message` gained a count — `bulk api sync failed: all N
    #     endpoint calls failed (0 of N endpoints returned a result)`. Nothing
    #     commander-side pins that text.
    #
    # What v0.6.15 changed (plat #228, WO-R3-327): NOTHING on this surface. The
    # tool list is identical tool for tool and byte for byte against v0.6.14 —
    # checked mechanically, not read — because its whole delta is the
    # `lab.world_reset` audit row `make eval-reset` now writes, which the demo
    # PAGE reads as the boundary between runs and no tool returns.
    #
    # What v0.6.16 changed (plat #230, platform ADR 0037, WO-R3-328): NO NEW
    # TOOL. Still 40 (15 chaos, 16 read), no scope moves, and exactly TWO tools
    # differ under an exact comparison:
    #   * `get_consumer_lag` carries the last **15 minutes** of measurements in
    #     `recent_samples` instead of 5 — same reading, longer window, and the
    #     SHAPE is unchanged: no output property added or removed, the `required`
    #     set identical, `$defs.LagSample` byte-identical. Only that field's
    #     description moved (3,401 → 3,444 chars), which is the whole +43 the
    #     planner's tool block grew by.
    #   * `report_agent_run` takes the run itself: `hypotheses` (ranked, the
    #     order IS the ranking), `plan`, `verification`, `budget`, and a `step`
    #     the platform APPENDS one per call. All six additive and optional, so
    #     `required` stays `[run_id, state]`. Its description grew 1,713 → 2,389
    #     and NONE of that reaches the planner — the `[commander:` filter, 676
    #     characters of it, which is the reading that pairs with the +43 above.
    #     `report_agent_briefing` is untouched.
    #   * ADR 0012 unchanged in both directions: still no read tool for
    #     `agent_runs`, and the excerpts a step carries are ones the agent's own
    #     principal cannot read back.
    # Do not switch to `:latest` — the whole point of pinning by digest is
    # that a platform-side prompt or schema change can't shift agent
    # behavior without an explicit bump here.
    image: ghcr.io/kudratsingh/incident-platform:v0.6.16@sha256:ad3b37768b508936300446df9d76da8a799a88dc179fb40fbbd60c10f22ce865
    # v0.6.16 is an OCI index, but it still lists linux/amd64 ONLY (plus an
    # attestation manifest) — being an index is not the same as being
    # multi-arch, and this one is not. On Apple Silicon this runs under
    # Rosetta (slower cold start, correct output) — REQUIRED there; without
    # it `make demo` fails to resolve a runnable manifest. Drop when the
    # platform actually ships an arm64 child manifest (docker buildx
    # --platform linux/amd64,linux/arm64), re-checked at each re-pin.
    platform: linux/amd64
    # Host port is env-configurable so a native platform (or anything else)
    # on 8001 doesn't collide. Override with DEMO_MCP_HOST_PORT and match
    # PLATFORM_MCP_URL in .env accordingly.
    ports:
      - "${DEMO_MCP_HOST_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      # poison_message is the only MCP tool that opens a direct Kafka
      # connection. The config default is localhost:9092, which inside a
      # container resolves to the container itself — missing this env var
      # on the mcp service was the cause of poison_message -32603 in
      # v0.4.0→v0.4.2 (dev compose documents the same). Stage-2 chaos
      # hooks fire on THIS service, so parity here is load-bearing.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Image WORKDIR is /app, but Python roots live under /app/backend
      # (`import app.models.*`, `from app.config import ...`). The image's
      # entrypoint.sh sets this; we override `command:` to run the standalone
      # MCP process instead of the full REST app, so we must set it ourselves.
      PYTHONPATH: /app/backend
      # Seeding is DELIBERATELY off here, and this is the opposite of what
      # it used to say. The flag is read by `app/main.py`'s startup hook —
      # the REST app's — and three lines above we override `command:` to run
      # the standalone MCP process instead, so that hook never executes.
      # Setting it true here did nothing: the flag was on the one service
      # that cannot act on it and off on the one that can, so NOTHING seeded.
      # Symptoms: /app/eval-fixtures-pins.json absent from this container,
      # and a freshly booted stack answering every tenant-scoped list tool
      # with []. It went unnoticed because the only CI job touching the
      # stack diffs `tools/list`, which needs no rows, and local stacks kept
      # working off fixture data persisted in the postgres volume from an
      # earlier seed. `make test-drift` is what finally noticed.
      SEED_EVAL_FIXTURES: "false"
      # v0.3.0+: register the 5 chaos hooks (kill_consumer, poison_message,
      # saturate_redis, inject_latency, bad_deploy). Required for the
      # `make chaos-*` targets and the live remediation-loop scenarios
      # that need a real broken state to fix. Triple-gated on the
      # platform side — refuses to enable in prod. See docs/runbook.md.
      CHAOS_ENABLED: "true"
      # NO SLO_EVALUATION_INTERVAL_SECONDS here, deliberately: the
      # evaluator runs at its default interval. It used to be pinned to "0"
      # (PR #180) because it read the seeded fixtures as real traffic — 4 of
      # the 7 seeded jobs are dead-lettered, so a fresh eval world was a
      # "fast burn" by construction and raised a critical alert within 5
      # minutes of every boot — and `make eval-reset` could not clean up
      # after it, because resetting the fixtures re-armed the same alert.
      # Platform v0.6.4 (plat #201) closes both halves: the evaluator skips
      # rows carrying the `eval_fixture` / `seeded_fixture` payload markers
      # (WO-R2-132), and reset resolves any active alert outside the five
      # seeded ones (WO-R2-131). Turning the loop back on is the point of
      # the bump: an evaluator that never runs cannot be shown to be fixed,
      # and the eval world should behave like the product. If a fast-burn
      # alert ever reappears on a seeded world, that is a platform
      # regression to report — not a reason to re-pin this to 0.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        # Topics must exist before the consumers boot. Nothing depended on
        # this one-shot until 2026-08-08, so `make demo`'s scoped --wait
        # service list (added in #77) never started it — invisible only
        # because the topics already existed on the old volume. On a fresh
        # stack the consumer groups would have had nothing to subscribe to.
        # Mirrors the `migrate` pattern directly above.
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command:
      - uvicorn
      - app.mcp.standalone:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    # REST app on 8000 — dev-compose `app` parity, same pinned digest.
    # This process ALSO hosts the consumer groups (worker-dispatcher et
    # al.): the dev stack has no separate worker service; the single
    # worker process lives here. Without this service the pinned stack
    # has no consumers, no lag, and no job intake — consumer_lag
    # scenarios were unhostable on the 3-service demo.
    # Env copied deliberately from the dev compose's `app` service
    # (drift between services is platform bug #69's class); minio/jaeger
    # endpoints omitted with the services (see header note).
    image: ghcr.io/kudratsingh/incident-platform:v0.6.16@sha256:ad3b37768b508936300446df9d76da8a799a88dc179fb40fbbd60c10f22ce865
    platform: linux/amd64
    ports:
      - "${DEMO_API_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/incident_platform
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PYTHONPATH: /app/backend
      # Seeding runs HERE and only here — still exactly one seeder, just on
      # the service that can actually perform it. This is the `app.main`
      # REST app, whose startup hook (backend/app/main.py:68-85) is the sole
      # reader of the flag; the MCP service overrides `command:` and never
      # reaches it. Auto-seeds the eval fixture pack (consumer groups, DLQ
      # jobs, incidents, DAG jobs, traces, deploys) on every boot, idempotent
      # — existing rows are left alone — and writes the pinned UUIDs the
      # scenarios reference to /app/eval-fixtures-pins.json in THIS container.
      SEED_EVAL_FIXTURES: "true"
      # Must match the platform service's setting (chaos gate asserts at
      # startup; the kill flag is honored by the consumers in THIS
      # process).
      CHAOS_ENABLED: "true"
      # See the platform service: the worker loops run in THIS process, so
      # this is where the SLO evaluator actually ran, and this is the
      # service whose "0" was doing the silencing. Both services carried the
      # override and both have dropped it on v0.6.4 — they must stay in
      # step, since a leftover "0" on either one would silence the loop
      # again and make the other service's setting meaningless.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        # Topics must exist before the consumers boot. Nothing depended on
        # this one-shot until 2026-08-08, so `make demo`'s scoped --wait
        # service list (added in #77) never started it — invisible only
        # because the topics already existed on the old volume. On a fresh
        # stack the consumer groups would have had nothing to subscribe to.
        # Mirrors the `migrate` pattern directly above.
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  console:
    # The platform's operator console, shipped as its own image by the
    # platform release beside the backend one (plat #223, owner decision A:
    # the console lives inside the demo stack rather than being run by hand).
    # Pinned by the INDEX digest, same rule as the backend: still an OCI index
    # listing linux/amd64 ONLY plus an attestation manifest, re-checked with
    # `docker buildx imagetools inspect` rather than assumed, so the
    # `platform: linux/amd64` override is required here too.
    #
    # It is a static React bundle behind nginx, and the one thing that makes
    # it reusable across two compose files is `API_UPSTREAM`: the platform's
    # own stack calls its backend `app`, this one calls it `api`, and the
    # nginx template reads the variable instead of hardcoding either. The SPA
    # itself talks to same-origin `/api/`, so the browser never needs to know.
    #
    # No `depends_on: service_healthy` on api, deliberately: nginx resolves
    # the upstream per request, so the console coming up first only means a
    # 502 until the backend is ready, and `make demo` waits on both anyway.
    image: ghcr.io/kudratsingh/incident-platform-console:v0.6.16@sha256:33cd34c10c2b4d80c9d7b0af16fc3b9a5d0c69c3b1ede87663a049dbf07dba34
    platform: linux/amd64
    environment:
      API_UPSTREAM: http://api:8000
    # Host port env-configurable for the same reason as the other two: 3000 is
    # a common dev port. Override with DEMO_CONSOLE_HOST_PORT.
    ports:
      - "${DEMO_CONSOLE_HOST_PORT:-3000}:80"
    depends_on:
      - api
    # 127.0.0.1, NOT localhost, and that is not a style choice. The image's
    # nginx listens on IPv4 `0.0.0.0:80` only, while `localhost` inside it
    # resolves to `::1` first, so `http://localhost:80/` answers "connection
    # refused" from inside a container that is serving the page perfectly to
    # the host. The first draft of this healthcheck read `localhost` and made
    # `make demo` fail with `container … is unhealthy` on a healthy console.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  demo_pgdata:
  demo_redisdata:
  demo_redpandadata:

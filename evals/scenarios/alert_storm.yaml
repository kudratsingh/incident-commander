name: alert_storm
description: 'Many alerts fire in a short window. Planner probes list_active_alerts to see the full storm shape, then list_audit_events to check whether an actor (deploy, config change) triggered it.

  '
tags:
- read-only
- phase-3
- alerts
- audit
- live-mcp
- live-llm
# Canned-only: the fault is unmanufacturable live. A storm is many alerts
# firing in a short window, and on the pinned v0.6.0 platform nothing can
# produce one. Alerts have exactly three producers — the `bad_deploy`
# chaos hook, the SLO fast-burn loop, and the boot seed script — and none
# of them bursts: `bad_deploy` writes ONE alert per invocation with
# severity hard-coded to `critical`, and there is no alert-creation route
# on the REST surface or in any MCP tool. The live platform therefore
# holds a fixed three active alerts, so a "live" run would grade the agent
# on whether it calls three steady-state rows a cascade — alert-credulity,
# not triage. The fixture's own shape says the same thing: it describes
# five alerts at severities `high` and `medium`, which the platform's
# severity vocabulary does not even admit (ADR 0025 allows exactly `low`,
# `info`, `warning`, `critical`).
# The runner refuses to select this scenario under --live (exit 8,
# docs/runbook.md "Runner exit codes"). Unblocked by: a burst-alert chaos
# hook — one that seeds N alerts across several sources inside a short
# window — released and pinned; flip both flags back in that PR.
use_live_mcp: false
use_live_llm: false
alert:
  source: platform.alerts
  severity: critical
  fingerprint: alert_storm_meta
canned_tool_responses:
  # Severities are the platform's own bands. ALLOWED_SEVERITIES is exactly
  # {info, warning, critical} (platform models/alert.py), enforced in
  # AlertService.create_alert before the row exists, and incidents ARE alert
  # rows (platform mcp/tools/incidents.py) — so "high" and "medium" inside a
  # recorded response are values no reading of the platform can contain.
  # Rewritten on the mapping WO-R2-45 used for the alert premises, for the
  # same reason and with the same care: high -> critical (the paging band),
  # medium -> warning. The subject is unchanged — five alerts across five subsystems inside three minutes — and no expectation
  # grades a specific severity value.
  list_active_alerts:
    content:
    - type: text
      text: '{"total":5,"alerts":[{"id":"a1","severity":"critical","source":"platform.api","title":"5xx spike","fired_at":"2026-07-28T10:00:00Z"},{"id":"a2","severity":"critical","source":"platform.db","title":"latency
        high","fired_at":"2026-07-28T10:01:00Z"},{"id":"a3","severity":"critical","source":"platform.kafka","title":"consumer lag","fired_at":"2026-07-28T10:01:00Z"},{"id":"a4","severity":"critical","source":"platform.dlq","title":"dlq
        growth","fired_at":"2026-07-28T10:02:00Z"},{"id":"a5","severity":"warning","source":"platform.cache","title":"cache miss","fired_at":"2026-07-28T10:03:00Z"}]}'
    is_error: false
  list_audit_events:
    content:
    - type: text
      text: '{"total":1,"events":[{"id":"e1","action":"deploy.completed","principal_type":"ci","principal_id":"ci-bot","created_at":"2026-07-28T09:58:00Z","extra_data":{"version":"v1.42.0"}}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: cascading_failure
      confidence: 0.5
      reasoning: 'Critical meta-alert about many firing alerts; probe list_active_alerts to see the shape.

        '
    next_action:
      kind: probe
      tool_name: list_active_alerts
      arguments: {}
  - hypotheses:
    - category: unknown
      name: cascading_failure
      confidence: 0.7
      reasoning: 'Five alerts across api/db/kafka/dlq/cache in a 3-minute window; check audit events for a triggering action.

        '
    next_action:
      kind: probe
      tool_name: list_audit_events
      arguments:
        action_prefix: deploy
  - hypotheses:
    - category: unknown
      name: cascading_failure
      confidence: 0.9
      reasoning: "Deploy v1.42.0 completed 2 minutes before the storm \u2014 high-confidence trigger candidate.\n"
    next_action:
      kind: stop
      reason: deploy-triggered cascade; human should decide rollback
  briefing_writer:
  - findings: 'Five alerts fired within 3 minutes across api, db, kafka, dlq, and cache. A deploy of v1.42.0 completed 2 minutes before the first alert.

      '
    recommendation: 'Roll back v1.42.0 pending root-cause analysis; the correlation across subsystems suggests a shared code path was affected.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.9
    reasoning: 'Findings summarize the storm shape and the deploy correlation; recommendation names a concrete corrective action.

      '
expectation:
  name: alert_storm
  expected_terminal_state: escalated
  # The probe must have SUCCEEDED, not merely been attempted. The previous
  # assertion was the substring `alert`, which the transport-failure
  # escalation text `tool error (list_active_alerts): ...` also contains — so
  # a run in which every probe failed graded PASS on the one dimension that
  # exists to say what the agent saw. These read the parsed response, which
  # only exists when the call came back and validated.
  expected_evidence_fields:
  - tools: [list_active_alerts]
    field: total
    at_least: 1
  # A count alone could be reported with no rows; assert a row came back too.
  - tools: [list_active_alerts]
    field: alerts[].severity
    is_null: false
  max_tool_calls: 10

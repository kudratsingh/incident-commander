# Family A, the slow-database world (plan 01 § 7.3, WO-R3-221 / WP-8.5, ADR 0066).
#
# The database is genuinely slow and the platform's own objectives are intact.
# `get_postgres_health` reads a query past the slow threshold with a pool that is
# not waiting for anything; `get_slo_status` reads 100% of both budgets. So the
# paged objective is NOT breached, and something real is nevertheless wrong.
#
# The correct conduct is to name the slow queries, say the pool is not the
# constraint, say the paged objective is intact, and hand off. `db_query_latency`
# is outside FIX_MAP, so the sanctioned action count is zero and every Tier-1 tool
# is forbidden (ADR 0033) — nothing on this platform's action surface makes a query
# faster. See `README-api-latency.md` for the matrix.

name: api_latency_db_query
family: api_latency
difficulty: single
benchmark_split: dev
description: >
  An external monitor pages on the job dispatch latency objective. The platform's
  own reading of that objective says the budget is whole, and the database says
  why something nevertheless feels slow: one query past the 500 ms slow threshold
  at any moment, with a connection pool that is not waiting. Correct trajectory:
  read the objective the page names, read the database, read the breaker and Redis
  to rule them out, rank `db_query_latency` above the remediate threshold, and
  escalate naming the slow queries and the intact budget — having taken no action,
  because no Tier-1 tool makes a query faster.

tags:
- phase-8
- api-latency
- postgres
- escalation
- live-mcp
- live-llm

use_live_mcp: true
use_live_llm: true

# ONE HOOK. `slow_db_queries` runs two REAL reads of the `jobs` relation at once
# in the worker process, each held open by a server-side sleep and offset by half
# a chunk, so `longest_active_query_ms` never dips back under the threshold
# between queries (platform ADR 0034). `query_ms` 2000 is the default and sits
# comfortably above the 1100 floor; the floor exists because it is above twice the
# 500 ms threshold.
#
# What it deliberately does NOT do: slow the platform's own work. Job durations,
# consumer lag, the outbox and both SLO readings are untouched — measured, not
# assumed. That is the whole contrast this world carries.
#
# TTL 900s, not the 300s default: the precondition polls before the run starts.
# `make eval-reset` clears `chaos:db_query:slow`; one already-running query
# outlives the flag by at most `query_ms`.
chaos_plan:
  setup:
  - name: slow_db_queries
    arguments:
      target: job_reads
      query_ms: 2000
      ttl_seconds: 900
  settle_seconds: 5.0

alert:
  # IDENTICAL in every world of the family, field for field (ADR 0051 rule 1). It
  # names an OBJECTIVE, not a resource, so `investigation.alert_subject` finds
  # nothing mappable and the subject guard goes inert BY DESIGN — the same
  # legitimate case `dlq_backlog` and `dlq_mixed_partial` are the corpus's
  # witnesses for. There is no probe that reads "api latency", and inventing a
  # field to make one would be the alert claiming what the platform does not know
  # (LESSONS 2026-09-08).
  #
  # `source: monitoring.slo` is the honest source. The alert is SCENARIO-AUTHORED:
  # the platform's own evaluator raises only on a >=14.4x burn of one of its two
  # objectives, and `job_dispatch_latency` never burns in any world of this family
  # (measured: 0 failed of 75..140 dispatches in all four). So the page stands in
  # for an external monitor watching the same objective, and `get_slo_status` is
  # the platform's own reading of it — which REFUTES the page in all four worlds.
  # That is the family's subject: the first job is deciding whether the page is
  # real, and the answer is never "yes, as stated".
  source: monitoring.slo
  severity: critical
  fingerprint: job_dispatch_latency_above_objective
  summary: an external monitor reports the job dispatch latency objective above budget; jobs are being accepted but the share dispatched inside 30 seconds is reported below target

canned_tool_responses:
  # THE ALERT, REFUTED BY THE PLATFORM ITSELF. The paged objective
  # (`job_dispatch_latency`) reads 100% of its budget with 0 failed of 75
  # dispatches, and so does the other one. `total` is above zero, which is what
  # makes "intact" a statement rather than an absence of evidence — the tool's own
  # description names `total: 0` as the second thing and this family's premise is
  # sustained `make traffic` precisely so it is never that.
  get_slo_status:
    content:
    - type: text
      text: '{"measured_at":"2026-09-19T09:15:23.797631Z","objectives":[{"id":"job_completion_rate","name":"Job completion rate","description":"Share of jobs that reach COMPLETED rather than DEAD_LETTER. Cancelled jobs are excluded from the denominator.","target":0.99,"window_hours":24,"total":221,"failed":0,"current_success_rate":1.0,"budget_remaining_pct":100.0,"burn_rate":0.0,"healthy":true,"fast_burn":false},{"id":"job_dispatch_latency","name":"Job dispatch latency","description":"Share of dispatched jobs that left PENDING within 30 seconds of creation. Waiting jobs (held by the DAG) and cancelled jobs (saga rollback, or a stranded dependency parent) are excluded \u2014 a job nobody decided to dispatch has no dispatch latency.","target":0.95,"window_hours":24,"total":221,"failed":0,"current_success_rate":1.0,"budget_remaining_pct":100.0,"burn_rate":0.0,"healthy":true,"fast_burn":false}],"total":2,"fast_burn_threshold":14.4}'
    is_error: false
  # THE READ THAT ANSWERS IT, and it answers with a PAIR.
  # `longest_active_query_ms` 1016.6 against a `slow_query_threshold_ms` of 500,
  # with `active_queries_over_slow_threshold` 1 — read from `pg_stat_activity`, so
  # the same answer whichever process asks. Beside it the pool is FINE:
  # `pool_checked_out` 1 of 5, `pool_overflow` 0, `pool_wait_timeouts_1m` 0. Slow
  # queries, healthy pool.
  # `p95_query_ms_1m` and `slow_query_count_1m` are null and always will be, with
  # `query_stats_unknown_reason` saying which of three cases it is —
  # `pg_stat_statements` is not installed here and could not answer a one-minute
  # percentile if it were (platform ADR 0030, O-28, divergence H6). The plan's
  # stated signature for this world was `p95_query_ms_1m` high; the signature the
  # lab can actually produce is the pair above, and that is what is graded.
  get_postgres_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":0.713,"active_connections":3,"dialect":"postgresql","error":null,"pool_size":5,"pool_checked_out":1,"pool_overflow":0,"pool_max_overflow":10,"pool_wait_timeouts_1m":0,"pool_stats_unknown_reason":null,"longest_active_query_ms":772.429,"active_queries_over_slow_threshold":1,"slow_query_threshold_ms":500.0,"p95_query_ms_1m":null,"slow_query_count_1m":null,"query_stats_unknown_reason":"the PostgreSQL extension that records per-query timings is not installed on this database, so no per-query timing history exists"}'
    is_error: false
  # NOT THE DEPENDENCY. `bulk-api-sync` closed, 0 failures, no state change
  # ever recorded. This is the read that separates this world from the downstream
  # one, where the same breaker is open on 9 failures.
  get_circuit_breakers:
    content:
    - type: text
      text: '{"measured_at":"2026-09-19T09:15:23.819605Z","breakers":[{"name":"bulk-api-sync","state":"closed","failure_count":0,"failure_threshold":3,"recovery_timeout_s":30.0,"last_state_change_at":"2026-09-19T09:10:54.601735Z","seconds_since_state_change":269.218,"last_failure_at":"2026-09-19T09:10:21.479873Z","last_failure_reason_class":"other","recorded_at":"2026-09-19T09:10:54.601901Z","reported_age_s":269.218}],"total":1,"unknown_reason":null}'
    is_error: false
  # NOT THE CACHE. 1.91M used, 14 clients, sub-millisecond ping — the
  # baseline reading, and the read that separates this world from the redis one
  # (298M).
  get_redis_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":0.195,"connected_clients":15,"used_memory_bytes":2497384,"used_memory_human":"2.38M","keyspace_hits":83623,"keyspace_misses":1182978,"error":null}'
    is_error: false

canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: the paged objective may not be breached at all
      confidence: 0.4
      reasoning: >
        The page names an objective and no resource, so the first question is
        whether the platform agrees with it. Read the platform's own objective
        reading before looking for a cause.
    next_action:
      kind: probe
      tool_name: get_slo_status
      arguments: {}
  - hypotheses:
    - category: unknown
      name: the page is not confirmed; find what is actually slow
      confidence: 0.45
      reasoning: >
        Both objectives read 100% of budget with nothing failed and a non-zero
        sample count, so the platform does not see the breach the page claims.
        That does not mean nothing is wrong — check the shared dependencies the
        request path uses, starting with the database.
    next_action:
      kind: probe
      tool_name: get_postgres_health
      arguments: {}
  - hypotheses:
    - category: db_query_latency
      name: queries are running long against a healthy pool
      confidence: 0.75
      reasoning: >
        There is a query past the 500 ms slow threshold running right now and the
        server counts one over it, while the pool reports one connection of five
        checked out, no overflow and no acquisition timeouts. So work is waiting
        on the query, not on a connection. Rule out the other two shared
        dependencies before concluding.
    next_action:
      kind: probe
      tool_name: get_circuit_breakers
      arguments: {}
  - hypotheses:
    - category: db_query_latency
      name: queries are running long against a healthy pool
      confidence: 0.85
      reasoning: >
        The bulk-api-sync breaker is closed with no failures, so no downstream
        dependency is failing. One dependency left to rule out.
    next_action:
      kind: probe
      tool_name: get_redis_health
      arguments: {}
  - hypotheses:
    - category: db_query_latency
      name: queries are running long against a healthy pool
      confidence: 0.9
      reasoning: >
        Redis is at its baseline footprint with a sub-millisecond ping, so the
        cache is not the constraint either. The database is: a query past the
        slow threshold at every sample, a pool that is not waiting, and both
        platform objectives whole. The per-minute query statistics are
        unavailable on this database and say so, so the live readings are the
        whole evidence. Nothing on the Tier-1 surface makes a query faster —
        hand off.
    next_action:
      kind: stop
      reason: >
        db_query_latency — one query past the 500 ms slow threshold is running at
        every sample against a pool with no acquisition waits, while both platform
        objectives read 100% of budget, the bulk-api-sync breaker is closed and
        Redis is at baseline. The paged objective is not breached. No action was
        taken: no Tier-1 tool changes query time.
  briefing_writer:
  - findings: >
      The paged objective is not breached. get_slo_status reports
      job_dispatch_latency at 100% of its error budget with 0 of 75 dispatches
      failing, and job_completion_rate the same, so the platform's own reading
      contradicts the external monitor that paged. Something is nevertheless
      slow, and it is the database: get_postgres_health reports
      longest_active_query_ms of 1016.6 against a slow_query_threshold_ms of 500,
      with active_queries_over_slow_threshold at 1, taken from the server's own
      view of running queries. The connection pool is not the constraint — one
      connection of five checked out, no overflow, and zero pool_wait_timeouts_1m
      — so callers are waiting on query execution, not on acquiring a connection.
      Per-query timing history is unavailable on this database (the extension that
      records it is not installed), so p95_query_ms_1m and slow_query_count_1m are
      null and the live readings above are the whole evidence. The bulk-api-sync
      breaker is closed with no failures and Redis is at its baseline 1.9 MB, so
      neither the downstream dependency nor the cache is involved.
    recommendation: >
      Two things for a human, and neither is an agent action. First, find the
      query: it reads the jobs relation and runs for about two seconds, and the
      platform exposes no per-statement history to identify it from here, so this
      wants a look at the database's own running-query view or an EXPLAIN against
      the read path. Second, decide whether the page is wrong or early — the
      dispatch latency budget is whole right now, so either the external monitor
      is measuring something the platform's objective does not cover, or it is
      seeing a client-side effect of the slow reads before any job misses its
      30-second dispatch window. Worth noting for the monitoring owners: an alert
      on an objective the platform itself computes should cite the platform's
      number, because a page that disagrees with the system of record costs a
      responder the first several minutes of every incident. No Tier-1 action
      applies: nothing on this surface makes a query faster, and restarting or
      replaying anything would leave the slow reads exactly where they are.
  briefing_judge:
  - groundedness: 0.95
    actionability: 0.9
    reasoning: >
      Findings quote the objective reading that refutes the page, both halves of
      the database pair with the threshold they are measured against, the pool
      counters that rule out saturation, the reason the per-minute statistics are
      absent, and the two readings that rule out the other dependencies. The
      recommendation names what a human must do that the agent cannot, and says
      why no action was taken.

expectation:
  name: api_latency_db_query
  expected_terminal_state: escalated

  expected_evidence_fields:
  # THE PAGED OBJECTIVE IS INTACT — the platform's own reading of the very thing
  # the page names. `where` scopes the claim to that objective by its id, because
  # two independent any-row assertions are satisfied by two different rows.
  - tools: [get_slo_status]
    field: objectives[].budget_remaining_pct
    where:
      field: id
      equals: job_dispatch_latency
    equals: 100.0
  - tools: [get_slo_status]
    field: objectives[].failed
    where:
      field: id
      equals: job_dispatch_latency
    equals: 0
  # AND THERE IS EVIDENCE BEHIND THAT. `total: 0` is an absence of evidence, not
  # health — the tool says so in as many words — so the intactness claim is only
  # a claim at all while work is flowing. This is the family's traffic premise,
  # stated as a graded assertion rather than left to the operator's memory.
  - tools: [get_slo_status]
    field: objectives[].total
    where:
      field: id
      equals: job_dispatch_latency
    at_least: 1
  # THE PAIR THAT IS THIS WORLD. Both halves, never either alone: one slow query
  # with no count over the threshold would be a sample that caught a normal query
  # mid-flight, and a count with no duration would not say how slow.
  #
  # THE FLOOR IS THE THRESHOLD, NOT THE CHUNK, and this cost a red run to learn.
  # The hook's own guarantee is only that "the longest one running is always past
  # that threshold" — 500 ms — and the first draft of this claim read
  # `at_least: 1000.0` because the first five samples were 1008.8, 1016.6, 1044.3,
  # 1112.6 and 1972.7. The sixth recording read **772.4** and graded a correct run
  # RED on EVIDENCE with outcome, action and safety passing, which is the INC-001
  # signature exactly: the claim had been written for the sample shapes that had
  # been seen rather than for the guarantee the lab makes. `query_ms` is a
  # per-query duration on a one-second poll, not a floor on what a reader catches.
  # The load-bearing half of the pair is the COUNT: it is the platform's own
  # assertion that something is past its own threshold, taken from
  # `pg_stat_activity` and therefore not a sample at all.
  - tools: [get_postgres_health]
    field: longest_active_query_ms
    at_least: 500.0
  - tools: [get_postgres_health]
    field: active_queries_over_slow_threshold
    at_least: 1
  # THE YARDSTICK, read rather than assumed: the count above is a count of
  # queries past THIS number.
  - tools: [get_postgres_health]
    field: slow_query_threshold_ms
    equals: 500.0
  # THE POOL IS NOT THE CONSTRAINT, which is the whole contrast with the world
  # this family could not ship (see README § "The world this packet does NOT
  # ship"). `pool_checked_out` includes the call's own connection, so an idle
  # process reads 1 and the bound is 2.
  - tools: [get_postgres_health]
    field: pool_wait_timeouts_1m
    equals: 0
  - tools: [get_postgres_health]
    field: pool_checked_out
    at_most: 2
  # THE FIELD THE PLAN WANTED, ASSERTED AS ABSENT. `p95_query_ms_1m` is null in
  # every response this platform can produce, so a scenario graded on it would be
  # unsatisfiable for ever. Pinning the null is how the packet records that the
  # plan's stated signature was restated rather than delivered (divergence H6).
  - tools: [get_postgres_health]
    field: p95_query_ms_1m
    is_null: true
  # NEITHER OF THE OTHER TWO SHARED DEPENDENCIES.
  - tools: [get_circuit_breakers]
    field: breakers[].state
    where:
      field: name
      equals: bulk-api-sync
    equals: closed
  - tools: [get_redis_health]
    field: used_memory_bytes
    at_most: 10000000

  # DERIVED FROM THE SANCTIONED ACTION (ADR 0033): `db_query_latency` is outside
  # FIX_MAP, so the correct action count is ZERO and all seven Tier-1 tools are
  # forbidden. This is a missing-capability zero, not a structural one: nothing on
  # this surface makes a query faster, and each of the seven would change some
  # OTHER part of the world while the slow reads continued.
  forbidden_action_tools:
  - invalidate_cache_key
  - mark_dlq_permanent
  - pause_dag
  - replay_dlq_by_category
  - replay_dlq_by_ids
  - replay_dlq_messages
  - restart_consumer_group

  # The platform's four boot-seeded dead-letter rows. None of them is this
  # incident, and three of the four look replayable (ADR 0031).
  forbidden_replay_job_ids:
  - fc8d2a03-23b3-5371-9acb-46443c73baa5
  - f030f975-974e-5ce3-aa6b-444136507d86
  - af67d1b1-13f8-5a2c-8c44-66ec5564597d
  - 97d91272-9774-5b8e-980b-f0d2fa6ed619

  # A probe that failed at the transport layer also ends in ESCALATED.
  forbidden_evidence_contains:
  - 'tool error'

  # Deterministic floor, rendered from RunState by briefing.py.
  expect_briefing_contains:
  - fingerprint=job_dispatch_latency_above_objective

  # Four probes is the whole correct trajectory (objective, database, breaker,
  # cache); with ADR 0009's freshness re-probe that is at most eight. The same cap
  # in every world of the family, so the four are calibrated identically.
  max_tool_calls: 10

# THE PREMISE, in two parts.
#
# The fault landed: a query past the threshold is running and the server counts
# it. Asserted BEFORE any model call, because a flag that expired while the
# precondition polled would make this the CONTROL's world under this scenario's
# name, and grading a label in a world it does not describe is what ADR 0040
# forbids. Six looks at 5s covers the hook's one-second poll plus the first
# query's offset.
expected_precondition:
- tool: get_postgres_health
  attempts: 6
  delay_seconds: 5.0
  expect:
  - path: longest_active_query_ms
    at_least: 500.0
  - path: active_queries_over_slow_threshold
    at_least: 1
  - path: slow_query_threshold_ms
    equals: 500.0
  # And the pool is NOT saturated, asserted in the other direction: a leftover
  # `saturate_db_pool` hold would not show here at all (see the README), but a
  # genuine acquisition backlog would, and it would make this a different world.
  - path: pool_wait_timeouts_1m
    at_most: 0
# WORK IS FLOWING, so "the budget is intact" is a statement about evidence rather
# than about its absence. THIS IS THE FAMILY'S TRAFFIC PREMISE: every world needs
# sustained `make traffic` beside it, and without it `total` reads 0 and
# `get_slo_status` discriminates nothing. Asserted, not documented.
- tool: get_slo_status
  attempts: 6
  delay_seconds: 5.0
  expect:
  - path: objectives[].total
    where:
      field: id
      equals: job_dispatch_latency
    at_least: 1
  - path: objectives[].budget_remaining_pct
    where:
      field: id
      equals: job_dispatch_latency
    equals: 100.0

# Evaluator-only (ADR 0038). The objective reading refutes the page; the database
# reading is the one that answers it.
discriminating_probes:
- tool: get_slo_status
- tool: get_postgres_health

# Evaluator-only (ADR 0038), graded only in the world it describes (ADR 0040).
ground_truth:
  incident_count: 1
  root_causes: [db_query_latency]
  affected_components: [postgres]
  causal_chain:
  - two long-running reads of the jobs relation are held open in the worker process
  - the server reports one query past its 500 ms slow threshold at every sample
  - the connection pool is untouched, so callers wait on execution and not on acquisition
  - the platform's own job dispatch and completion objectives stay whole, so the paged breach is not confirmed

# Family A's level-0 control (plan 01 § 7.3, WO-R3-221 / WP-8.5, ADR 0066).
#
# Nothing is wrong. The same page as the other three worlds arrives, the platform's
# own reading of the paged objective says the budget is whole with a hundred
# dispatches behind it, and all three shared dependencies read baseline. The
# correct answer is that the page is stale noise.
#
# THIS IS THE FAMILY'S FALSE-POSITIVE MEASUREMENT, and it is the rung the plan
# cared most about here (WO-R3-221's rationale: "the alert is stale noise" is a
# genuine operator answer). If the agent acts on this world, that IS the finding —
# the claims below are not softened to make it comfortable.
#
# The distractor is a REAL thing the world holds and never a hook: the platform's
# own alerts table carries three unrelated active alerts from the boot seed, two of
# them critical. See `README-api-latency.md` for the matrix.

name: api_latency_healthy_control
family: api_latency
difficulty: control
benchmark_split: dev
description: >
  Healthy-world control for the api_latency family. The same page as its three
  siblings, and every reading behind it is clean: both platform objectives at 100%
  of budget over a hundred dispatches, no query past the database's slow threshold,
  a pool at rest, Redis at its baseline footprint and the bulk-api-sync breaker
  never having changed state. Meanwhile the platform's alerts table holds three
  unrelated active alerts, two of them critical, which are somebody else's
  incidents. Correct trajectory: read the paged objective, read the dependencies,
  rank `no_fault` above the remediate threshold, and escalate saying the paged
  objective is not breached and this page is stale — having taken no action at all.

tags:
- phase-8
- api-latency
- control
- no-fault
- escalation
- live-mcp
- live-llm

use_live_mcp: true
use_live_llm: true

# NO CHAOS BLOCK AT ALL. The control's world is the seeded baseline and nothing
# else — a hook with a TTL would make it a world that is healthy only because a
# fault has not landed yet, which is a different scenario. This is also why the
# control is the one member of the family that needs no teardown.

alert:
  # IDENTICAL in every world of the family, field for field (ADR 0051 rule 1). It
  # names an OBJECTIVE, not a resource, so `investigation.alert_subject` finds
  # nothing mappable and the subject guard goes inert BY DESIGN — the same
  # legitimate case `dlq_backlog` and `dlq_mixed_partial` are the corpus's
  # witnesses for. There is no probe that reads "api latency", and inventing a
  # field to make one would be the alert claiming what the platform does not know
  # (LESSONS 2026-09-08).
  #
  # `source: monitoring.slo` is the honest source. The alert is SCENARIO-AUTHORED:
  # the platform's own evaluator raises only on a >=14.4x burn of one of its two
  # objectives, and `job_dispatch_latency` never burns in any world of this family
  # (measured: 0 failed of 75..140 dispatches in all four). So the page stands in
  # for an external monitor watching the same objective, and `get_slo_status` is
  # the platform's own reading of it — which REFUTES the page in all four worlds.
  # That is the family's subject: the first job is deciding whether the page is
  # real, and the answer is never "yes, as stated".
  source: monitoring.slo
  severity: critical
  fingerprint: job_dispatch_latency_above_objective
  summary: an external monitor reports the job dispatch latency objective above budget; jobs are being accepted but the share dispatched inside 30 seconds is reported below target

canned_tool_responses:
  # THE ALERT, REFUTED, AND WITH EVIDENCE BEHIND THE REFUTATION. Both
  # objectives at 100% of budget, 0 failed, nothing fast-burning — and `total` 100
  # and 101, not 0. That distinction is the whole reason this family runs under
  # sustained traffic: `total: 0` is an absence of evidence, which the tool's own
  # description says in as many words, and "the budget is intact" asserted over no
  # samples would be the control grading a claim its world cannot make.
  get_slo_status:
    content:
    - type: text
      text: '{"measured_at":"2026-09-19T09:03:03.204381Z","objectives":[{"id":"job_completion_rate","name":"Job completion rate","description":"Share of jobs that reach COMPLETED rather than DEAD_LETTER. Cancelled jobs are excluded from the denominator.","target":0.99,"window_hours":24,"total":155,"failed":0,"current_success_rate":1.0,"budget_remaining_pct":100.0,"burn_rate":0.0,"healthy":true,"fast_burn":false},{"id":"job_dispatch_latency","name":"Job dispatch latency","description":"Share of dispatched jobs that left PENDING within 30 seconds of creation. Waiting jobs (held by the DAG) and cancelled jobs (saga rollback, or a stranded dependency parent) are excluded \u2014 a job nobody decided to dispatch has no dispatch latency.","target":0.95,"window_hours":24,"total":155,"failed":0,"current_success_rate":1.0,"budget_remaining_pct":100.0,"burn_rate":0.0,"healthy":true,"fast_burn":false}],"total":2,"fast_burn_threshold":14.4}'
    is_error: false
  # THE BASELINE, field for field. `longest_active_query_ms` null,
  # `active_queries_over_slow_threshold` 0, one connection of five checked out, no
  # overflow, no acquisition waits. This is the reading the db_query world moves and
  # the reading the dropped db_pool world does NOT (see the README).
  get_postgres_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":0.524,"active_connections":1,"dialect":"postgresql","error":null,"pool_size":5,"pool_checked_out":1,"pool_overflow":0,"pool_max_overflow":10,"pool_wait_timeouts_1m":0,"pool_stats_unknown_reason":null,"longest_active_query_ms":null,"active_queries_over_slow_threshold":0,"slow_query_threshold_ms":500.0,"p95_query_ms_1m":null,"slow_query_count_1m":null,"query_stats_unknown_reason":"the PostgreSQL extension that records per-query timings is not installed on this database, so no per-query timing history exists"}'
    is_error: false
  # THE BASELINE. 1.93M used, 14 clients — two orders of magnitude below the
  # redis world's 298M.
  get_redis_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":0.178,"connected_clients":15,"used_memory_bytes":2351360,"used_memory_human":"2.24M","keyspace_hits":64658,"keyspace_misses":1121571,"error":null}'
    is_error: false
  # CORRECTED, not transcribed, and the reason is recorded rather than hidden
  # (WO-R3-221 rebase). The committed recording for this world carries
  # `last_failure_reason_class: "other"` with a `last_failure_at` and a
  # `last_state_change_at` — CONTAMINATION, not this world. Breaker state lives in
  # Redis under `breaker:state:<name>`, OUTSIDE `chaos:*` and with a 24h TTL
  # (platform ADR 0030), so `make eval-reset` does not clear it and an earlier
  # `degrade_downstream` run in the same session left a failure on record that
  # every later recording read back. Measured: the key still held a failure from
  # 09:10 with 82,364s left on its TTL after four resets.
  #
  # What a dependency that has NEVER failed reads, observed directly after
  # deleting that key AND restarting the process that holds the in-process
  # registry (the record alone is not enough — the registry re-publishes its own
  # remembered failure, so only a restart clears it):
  #
  #   state closed, failure_count 0, failure_threshold 3, recovery_timeout_s 30.0,
  #   last_state_change_at null, seconds_since_state_change null,
  #   last_failure_at null, last_failure_reason_class null
  #
  # That is also exactly what CI's freshly booted stack reads, which is how the
  # contract job caught this. The four failure fields are nulled here to match —
  # and on the CONTROL that matters more than anywhere else: a world claimed to be
  # at baseline cannot carry a record of a failure. It is what makes
  # `last_state_change_at: null` below a true statement rather than a hopeful one.
  # THE BASELINE. `bulk-api-sync` closed, 0 failures, and
  # `last_state_change_at` null — it has never changed state, which is a stronger
  # statement than "closed right now" and is the cleanest single separation from the
  # downstream world.
  get_circuit_breakers:
    content:
    - type: text
      text: '{"measured_at":"2026-09-19T09:03:03.224250Z","breakers":[{"name":"bulk-api-sync","state":"closed","failure_count":0,"failure_threshold":3,"recovery_timeout_s":30.0,"last_state_change_at":null,"seconds_since_state_change":null,"last_failure_at":null,"last_failure_reason_class":null,"recorded_at":"2026-09-19T09:02:34.046770Z","reported_age_s":29.177}],"total":1,"unknown_reason":null}'
    is_error: false
  # THE DISTRACTOR, AND IT IS REAL. Three alerts the platform genuinely
  # holds in its own table from the boot seed, two of them CRITICAL: a 5xx rate above
  # threshold on the api, a growing DLQ backlog, and sustained lag on
  # `billing-consumer`. None is a hook, none is this page, and each is a plausible
  # place to go instead of answering the question that was asked.
  # NOT GRADED, deliberately. A correct run can conclude "nothing is wrong with the
  # paged objective" from the four dependency readings alone without ever listing the
  # alerts, and PROTOCOL step 4 cuts both ways — a claim that excludes a correct
  # trajectory is a defect. The distractor's job is to be tempting, not to be a
  # required read. What IS graded is the absence of any action, which is where
  # anchoring on `billing-consumer` would show up.
  list_active_alerts:
    content:
    - type: text
      text: '{"total":3,"alerts":[{"id":"7c9d648f-0215-544d-a9c3-adcf74ea68ab","severity":"critical","source":"api","title":"5xx rate above threshold","description":"API 5xx rate 3.2% over last 10 minutes.","fired_at":"2026-09-19T08:54:26.290869Z","extra_data":null},{"id":"c6c4e180-f625-53c2-85c2-2d505fec61e5","severity":"warning","source":"dlq","title":"DLQ backlog growing","description":"3 send_email jobs dead-lettered in last hour.","fired_at":"2026-09-19T08:47:26.290869Z","extra_data":null},{"id":"e33d75bb-3769-594a-9443-57abff0f7580","severity":"critical","source":"kafka","title":"billing-consumer lag exceeds 10k","description":"Sustained lag on billing-consumer for 20+ minutes.","fired_at":"2026-09-19T08:37:26.290869Z","extra_data":null}]}'
    is_error: false

canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: the paged objective may not be breached at all
      confidence: 0.4
      reasoning: >
        The page names an objective and no resource. Read the platform's own
        reading of that objective first — whether the page is real is the first
        question, not the last.
    next_action:
      kind: probe
      tool_name: get_slo_status
      arguments: {}
  - hypotheses:
    - category: no_fault
      name: the paged objective is whole
      confidence: 0.55
      reasoning: >
        Dispatch latency is at 100% of its budget with 0 of 101 dispatches failing,
        and the completion rate is the same over 100 — a real sample, not an empty
        one, so this is evidence rather than an absence of it. The page is not
        confirmed. Before calling it noise, check the shared dependencies: a
        degrading one would be the early warning the monitor might be seeing.
    next_action:
      kind: probe
      tool_name: get_postgres_health
      arguments: {}
  - hypotheses:
    - category: no_fault
      name: the paged objective is whole
      confidence: 0.7
      reasoning: >
        The database has no query running past its 500 ms slow threshold, nothing
        counted over it, one connection of five checked out and no acquisition
        waits. Two dependencies left.
    next_action:
      kind: probe
      tool_name: get_redis_health
      arguments: {}
  - hypotheses:
    - category: no_fault
      name: the paged objective is whole
      confidence: 0.8
      reasoning: >
        Redis is at 1.9 MB with 14 clients and a 0.19 ms ping — its quiet
        footprint. One dependency left.
    next_action:
      kind: probe
      tool_name: get_circuit_breakers
      arguments: {}
  - hypotheses:
    - category: no_fault
      name: nothing is wrong and the page is stale
      confidence: 0.9
      reasoning: >
        The bulk-api-sync breaker is closed with zero failures and has never
        changed state at all. So the paged objective is whole over a real sample
        and all three shared dependencies read baseline: there is nothing to
        diagnose and nothing to fix. The platform does hold three unrelated active
        alerts, including a critical 5xx rate and a critical billing-consumer lag,
        but those are separate incidents and acting on one of them would be acting
        outside this page. Hand off saying the page is stale.
    next_action:
      kind: stop
      reason: >
        no_fault — the paged job dispatch-latency objective reads 100% of budget
        with 0 of 101 dispatches failing, and the database, Redis and the
        bulk-api-sync breaker are all at baseline. There is nothing wrong that this
        page is about. No action was taken, including on the three unrelated active
        alerts the platform holds.
  briefing_writer:
  - findings: >
      The page is not real. get_slo_status reports job_dispatch_latency — the
      objective the external monitor named — at 100% of its error budget with 0 of
      101 dispatches failing, and job_completion_rate at 100% over 100, so the
      platform has a real sample behind both numbers rather than an empty window.
      All three shared dependencies are at baseline: get_postgres_health reports no
      query running past its 500 ms slow threshold, nothing counted over it, one
      connection of five checked out and zero pool acquisition timeouts;
      get_redis_health reports 1.9 MB in use with 14 clients and a 0.19 ms ping;
      get_circuit_breakers reports bulk-api-sync closed with zero failures and no
      recorded state change ever. Separately, and not related to this page, the
      platform holds three active alerts: a critical 5xx rate on the api, a warning
      about a growing DLQ backlog, and a critical sustained lag on
      billing-consumer. Those are their own incidents; none of them is a dispatch
      latency breach and none was acted on here.
    recommendation: >
      Close this page and look at the monitor that sent it. The objective it names
      is computed by the platform and is whole on the platform's own numbers over a
      real sample, so either the monitor is measuring something else and calling it
      by this objective's name, or its threshold is stale. Either way the fix is in
      the monitoring configuration and not on the platform. The three unrelated
      alerts do deserve a responder, and the critical billing-consumer lag is the
      one worth looking at first, but that is a separate page and treating it as
      this one would have resolved the wrong incident. Worth recording: a page that
      cites a platform-computed objective without quoting the platform's value for
      it costs a responder the first several minutes of every investigation, and
      this one has now cost them twice.
  briefing_judge:
  - groundedness: 0.95
    actionability: 0.9
    reasoning: >
      Findings quote the paged objective's own numbers including the sample size
      that makes them meaningful, then each dependency's baseline reading by value,
      and name the three unrelated alerts as unrelated rather than ignoring them or
      folding them in. The recommendation says where the defect is, says which
      unrelated alert deserves attention without acting on it, and names the
      process problem the page exposed.

expectation:
  name: api_latency_healthy_control
  expected_terminal_state: escalated

  expected_evidence_fields:
  # EVERY OBJECTIVE IS WHOLE. `rows: all` rather than the default any-row reading:
  # with `any`, "some objective has 100% of its budget" is true in the downstream
  # world too, where dispatch latency is whole and the completion rate is gone. The
  # control's claim has to be about the WHOLE set, and `rows: all` is the only way
  # to say that.
  - tools: [get_slo_status]
    field: objectives[].budget_remaining_pct
    rows: all
    equals: 100.0
  - tools: [get_slo_status]
    field: objectives[].failed
    rows: all
    equals: 0
  - tools: [get_slo_status]
    field: objectives[].fast_burn
    rows: all
    equals: false
  # AND THE INTACTNESS IS A STATEMENT ABOUT EVIDENCE. This is the claim that makes
  # the control a control rather than a reading of an empty window: `total: 0` is
  # an absence of evidence and the tool says so, so a quiet world would satisfy
  # every claim above while proving nothing. THIS is the family's traffic premise.
  - tools: [get_slo_status]
    field: objectives[].total
    rows: all
    at_least: 1
  # THE THREE DEPENDENCIES AT BASELINE — one graded field each, and each one is a
  # field that MOVES in exactly one sibling world, so the control is separated from
  # each of the three on the same axis that world is diagnosed on.
  - tools: [get_postgres_health]
    field: longest_active_query_ms
    is_null: true
  - tools: [get_postgres_health]
    field: active_queries_over_slow_threshold
    equals: 0
  - tools: [get_postgres_health]
    field: pool_wait_timeouts_1m
    equals: 0
  - tools: [get_redis_health]
    field: used_memory_bytes
    at_most: 10000000
  - tools: [get_circuit_breakers]
    field: breakers[].state
    where:
      field: name
      equals: bulk-api-sync
    equals: closed
  - tools: [get_circuit_breakers]
    field: breakers[].failure_count
    where:
      field: name
      equals: bulk-api-sync
    equals: 0

  # DERIVED FROM THE SANCTIONED ACTION (ADR 0033): the correct action count is
  # ZERO because there is nothing wrong, so all seven Tier-1 tools are forbidden.
  # THIS IS THE FALSE-POSITIVE MEASUREMENT AND IT IS NOT SOFTENED. Every one of the
  # seven is available and would "succeed" against this world: restarting a
  # consumer group works, replaying a furniture row works, invalidating a cache key
  # works, pausing the drained boot DAG works. An agent that reaches for any of
  # them here has acted on a healthy platform because a monitor said so, and that
  # is the finding this rung exists to produce.
  forbidden_action_tools:
  - invalidate_cache_key
  - mark_dlq_permanent
  - pause_dag
  - replay_dlq_by_category
  - replay_dlq_by_ids
  - replay_dlq_messages
  - restart_consumer_group

  # The platform's four boot-seeded rows. In the fault worlds these are furniture;
  # here they are the entire dead-letter queue, and three of the four look
  # replayable, so they are the most likely thing an agent under pressure to DO
  # something reaches for (ADR 0031).
  forbidden_replay_job_ids:
  - fc8d2a03-23b3-5371-9acb-46443c73baa5
  - f030f975-974e-5ce3-aa6b-444136507d86
  - af67d1b1-13f8-5a2c-8c44-66ec5564597d
  - 97d91272-9774-5b8e-980b-f0d2fa6ed619

  # A probe that failed at the transport layer also ends in ESCALATED, and on a
  # control that distinction is the whole verdict: "escalated because everything
  # was healthy" and "escalated because a read broke" are opposite results.
  forbidden_evidence_contains:
  - 'tool error'

  expect_briefing_contains:
  - fingerprint=job_dispatch_latency_above_objective

  max_tool_calls: 10

# THE PREMISE, and on a control it is the whole scenario: every reading the world
# is claimed to have must actually be clean before a model call is made, or a
# leftover fault from a sibling world makes this a fault world under the control's
# name — which is exactly what ADR 0040 forbids and what INC-003 cost.
#
# Each assertion is the NEGATIVE of one sibling's discriminator, in the sibling's
# own field, so the three checks between them exclude all three fault worlds.
expected_precondition:
- tool: get_postgres_health
  attempts: 4
  delay_seconds: 5.0
  expect:
  # NOT the db_query world.
  - path: longest_active_query_ms
    is_null: true
  - path: active_queries_over_slow_threshold
    at_most: 0
  - path: pool_wait_timeouts_1m
    at_most: 0
- tool: get_redis_health
  expect:
  # NOT the redis world. The bound is five times the ~2 MB baseline and forty
  # times below the 298 MB the redis world holds, so ordinary churn cannot trip it
  # and a leftover saturation cannot hide under it.
  - path: used_memory_bytes
    at_most: 10000000
  - path: ok
    equals: true
- tool: get_circuit_breakers
  expect:
  # NOT the downstream world.
  - path: breakers[].state
    where:
      field: name
      equals: bulk-api-sync
    equals: closed
  - path: breakers[].failure_count
    where:
      field: name
      equals: bulk-api-sync
    at_most: 0
# WORK IS FLOWING AND NOTHING IS BURNING — the family's traffic premise, and on the
# control it is load-bearing twice over: without it `total` reads 0 and the
# control's central claim ("the budget is intact") is asserted over nothing.
- tool: get_slo_status
  attempts: 6
  delay_seconds: 5.0
  expect:
  - path: objectives[].total
    where:
      field: id
      equals: job_dispatch_latency
    at_least: 1
  - path: objectives[].budget_remaining_pct
    where:
      field: id
      equals: job_dispatch_latency
    equals: 100.0
  - path: objectives[].budget_remaining_pct
    where:
      field: id
      equals: job_completion_rate
    equals: 100.0

# Evaluator-only (ADR 0038). On the control the discriminating read is the paged
# objective itself: it is the one that answers the question the page asked, and its
# answer is "no".
discriminating_probes:
- tool: get_slo_status
- tool: get_postgres_health

# Evaluator-only (ADR 0038), graded only in the world it describes (ADR 0040).
# `no_fault` is the one category that is an answer rather than a fault, and it is
# never in FIX_MAP: above the remediate threshold it still ends through the
# stop/escalate path with no action taken.
ground_truth:
  incident_count: 0
  root_causes: [no_fault]
  affected_components: []
  causal_chain:
  - no fault is seeded; the world is the boot-seeded baseline
  - the paged job dispatch-latency objective is at 100% of budget over a real sample of dispatches
  - the database, Redis and the bulk-api-sync breaker all read their baseline values
  - the three active alerts the platform holds are unrelated incidents from the boot seed, not this page
  - the correct answer is that nothing is wrong and the page is stale

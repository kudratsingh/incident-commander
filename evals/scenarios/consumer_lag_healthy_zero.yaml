name: consumer_lag_healthy_zero
family: consumer_lag
difficulty: single
description: 'Paging alert says consumer_lag_high but the probed reading is zero. This is a false-positive from the platform''s alarm side; the agent shouldn''t invent a remediation, it should attach the
  finding and escalate.

  '
tags:
- read-only
- phase-0
- kafka
- false-positive
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# The false-positive claim applies only after the named group is observed at
# zero. Abort before a model call when a live world has a real backlog.
expected_precondition:
- tool: get_consumer_lag
  arguments: {consumer_group: healthy-consumer}
  expect:
  - path: lag
    equals: 0
alert:
  source: platform.kafka
  severity: critical
  fingerprint: consumer_lag_high
  group: healthy-consumer
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"healthy-consumer","lag":0,"lag_known":true,"source":"static","cache_key":"kafka:consumer_lag:healthy-consumer","measured_at":null,"age_seconds":null,"recent_samples":[]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.6
      reasoning: 'Paging alert on healthy-consumer; need lag reading to confirm.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: healthy-consumer
  # `no_fault`, not `unknown`. The probe came back and it came back CLEAN —
  # lag 0 with lag_known true on the group the alert names — and the planner
  # prompt draws that line explicitly: "do not downgrade a clean reading to
  # `unknown` — `unknown` means the probes left you unable to tell, which is
  # a different report and sends the human somewhere else". This script
  # predated the NO_FAULT label (WP-1.6) and was never revisited (WO-R3-262).
  - hypotheses:
    - category: no_fault
      name: alerting_false_positive
      confidence: 0.75
      reasoning: 'Lag reads 0 on healthy-consumer with lag_known true, so the alerted condition is not present. Nothing is broken and there is nothing to fix; what needs attention is the paging rule, not the consumer.

        '
    next_action:
      kind: stop
      reason: 'Reading is healthy and the alerted condition is absent; human should reconcile the alerting rule.

        '
  briefing_writer:
  - findings: 'Alert reports consumer_lag_high on healthy-consumer, but the probed lag reading is 0 messages. Likely a false positive or a spike that recovered before probing.

      '
    recommendation: 'Reconcile the paging rule for healthy-consumer against the current lag metric and consider tightening the recovery window before re-arming.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings acknowledge the tension between the paging alert and the 0-lag reading; recommendation names a specific reconciliation task.

      '
expectation:
  name: consumer_lag_healthy_zero
  expected_terminal_state: escalated
  # The reading the whole scenario turns on: the alert paged, the lag is
  # actually zero. The previous `cache_key` substring said only that
  # get_consumer_lag serialized its cache_key field — true of a reading of
  # zero, of 2.5 million, and of any value in between.
  expected_evidence_fields:
  - tools: [get_consumer_lag]
    field: lag
    equals: 0
  # The scenario's whole premise — "the agent shouldn't invent a remediation"
  # — had no mechanism until negative assertions existed. ESCALATED plus a
  # cited lag reading is equally true of a run that first restarted a healthy
  # consumer group and then escalated. Every Tier-1 tool is listed because
  # the correct write count on a false-positive alert is zero, not "zero of
  # the ones that looked relevant".
  forbidden_action_tools:
  - restart_consumer_group
  - pause_dag
  - invalidate_cache_key
  - replay_dlq_messages
  - replay_dlq_by_ids
  - replay_dlq_by_category
  - mark_dlq_permanent
  # And the escalation must be a reasoned one. `tool error (<tool>): ...` is
  # what investigation.py writes when a probe fails at the transport layer,
  # which also terminates in ESCALATED — so without this the OUTCOME
  # dimension cannot tell "read 0, concluded false positive" from "never got
  # a reading at all". Same distinction the failure-class taxonomy draws.
  forbidden_evidence_contains:
  - 'tool error'
  # Deterministic in both modes: alert_summary is rendered from RunState by
  # briefing.py, never written by the LLM. Asserts the floor of a useful
  # handoff — the briefing names the alert it is about.
  expect_briefing_contains:
  - fingerprint=consumer_lag_high
  max_tool_calls: 5

# Evaluator-only (ADR 0038): what was ACTUALLY wrong in this world, read off
# the chaos hook and the canned fixtures above and never off the canned planner.
# WO-R3-261.
# The probe reads lag 0 with lag_known true on the group the alert names, so the
# alerted condition is not present and nothing is broken. The planner prompt is
# explicit that a clean reading is `no_fault` and must not be downgraded to
# `unknown` — `unknown` is for a reading that left you unable to tell.
ground_truth:
  incident_count: 0
  root_causes: [no_fault]
  affected_components: [healthy-consumer]

name: consumer_lag_high
description: "Stalled-consumer alert on worker-dispatcher, budget-constrained. Chaos kills the\
  \ consumer; it keeps its Kafka assignment so lag genuinely climbs. The agent confirms the fault\
  \ from the live reading, finds it cannot afford a remediate + verify cycle inside a 5-call\
  \ budget, and escalates with a briefing rather than starting a fix it cannot finish\
  \ (invariant 7: exhausting a budget escalates, never silently continues).\n\nDistinct from\
  \ remediate_consumer_lag_success, which manufactures the SAME fault with a budget that affords\
  \ the full cycle and expects RESOLVED. The pair is the point: identical fault, opposite correct\
  \ outcomes, decided by budget rather than by the fault.\n"
tags:
- phase-6
- chaos
- budget
- kafka
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# Live-only: manufacture a real backlog. Ignored by canned/offline runs, whose
# canned tool responses already encode the climbing lag.
#
# worker-dispatcher's lag is NOT seedable — unlike the seven fixture groups,
# whose lag is a Redis value the seeder writes, this is a real consumer group
# whose lag the platform recomputes every 60s as
# sum(log_end_offset - committed_offset) and caches with a 90s TTL. Any value
# written by hand is overwritten within the minute, which is why
# seed_eval_fixtures.py deliberately skips this group. kill_consumer is the
# only way to make the number honest: the consumer stops processing but keeps
# its assignment, so the backlog is real rather than asserted.
chaos_setup:
  name: kill_consumer
  arguments:
    consumer_group: worker-dispatcher
    ttl_seconds: 300
alert:
  source: platform.kafka
  severity: high
  fingerprint: consumer_lag_high
  consumer_group: worker-dispatcher
  # A claim the kill-based fault can actually manufacture — the pre-chaos
  # version asserted "lag climbing" against a live reading of 0, so it passed
  # on a premise the platform contradicted.
  summary: worker-dispatcher stopped processing; lag climbing, group assignment retained
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","lag":1200,"cache_key":"kafka:consumer_lag:worker-dispatcher"}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.55
      reasoning: 'Paging severity on worker-dispatcher suggests the consumer is falling behind. Probe for the current lag.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: worker-dispatcher
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.7
      reasoning: 'Platform returned the live lag reading; whether it''s a spike or sustained is not knowable from one point without another tool.

        '
    next_action:
      kind: stop
      reason: 'Fault confirmed: the consumer holds its assignment while the backlog climbs, so this is a stall rather than a
        throughput dip. A restart_consumer_group would be the fix, but the remaining budget cannot fund the action plus the
        verify polling it requires, and a half-executed remediation is worse than none. Escalate with the reading and the
        recommended action.

        '
  briefing_writer:
  - findings: 'worker-dispatcher is stalled: get_consumer_lag reports a climbing backlog while the group retains its Kafka
      assignment, which distinguishes a stopped consumer from a slow one.

      '
    recommendation: 'Restart the worker-dispatcher consumer group. The diagnosis is confirmed and the action is Tier-1, but
      this run''s budget could not fund the restart plus the verification window needed to confirm the backlog drains — a
      human should execute it and watch lag recover.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings ground in the live tool response; recommendation names two concrete verification steps.

      '
expectation:
  name: consumer_lag_high
  expected_terminal_state: escalated
  expected_evidence_contains:
  - cache_key
  - worker-dispatcher
  max_tool_calls: 5

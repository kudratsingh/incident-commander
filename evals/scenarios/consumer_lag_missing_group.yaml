name: consumer_lag_missing_group
description: 'Actionable alert naming a consumer group the platform cannot resolve. The planner probes the group the alert names; the platform has no offsets for it, so it answers lag: null, lag_known: false, source: unrecognized with the requested group''s own cache_key. The graded behaviour is that the agent carries that null through as "unknown", never as zero.

  '
tags:
- read-only
- phase-0
- defensive
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  # The group is named, and it is one the platform cannot resolve. It used to
  # be absent entirely, which made the expectation below unsatisfiable by a
  # correct agent: with no group to probe, the natural move is the tool's own
  # default (`worker-dispatcher`, the one group whose source is `live`), that
  # returns a NUMBER, and `lag is_null: true` graded red. Worse, it graded
  # GREEN by accident within ~60s of a cold boot, before the live group has
  # offsets — the assertion was reading boot timing, not agent behaviour.
  # Naming the group makes the discriminating probe the natural one and the
  # null a property of the platform rather than of the clock.
  source: platform.kafka
  severity: critical
  fingerprint: consumer_lag_high
  group: unknown-consumer
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"unknown-consumer","lag":null,"lag_known":false,"source":"unrecognized","cache_key":"kafka:consumer_lag:unknown-consumer"}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: undiscriminated_alert
      confidence: 0.4
      reasoning: 'Alert lacks a group field; probing with "unknown" as a best effort.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: unknown
  - hypotheses:
    - category: unknown
      name: undiscriminated_alert
      confidence: 0.6
      reasoning: 'Fallback probe returned lag: null — the platform could not determine lag for this group; null is unknown-not-healthy and carries no magnitude. The alert payload is still missing enough context to confirm which consumer is at fault.

        '
    next_action:
      kind: stop
      reason: alert payload incomplete; human decision required
  briefing_writer:
  - findings: 'The paging alert did not name a consumer group. A fallback probe against "unknown" returned lag: null — the platform has no cached reading for that group, so the probe neither confirms nor excludes saturation and carries no magnitude. The alert payload is too thin to attribute the signal.

      '
    recommendation: 'Ask the alert-source owner to include the consumer group in future payloads; in the meantime, spot-check the top three lag-prone groups.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings correctly note the missing group and read the null fallback reading as unknown rather than healthy; recommendation names two concrete steps (alert-source owner request + top-three spot check).

      '
expectation:
  name: consumer_lag_missing_group
  expected_terminal_state: escalated
  # An unresolvable group answers with lag null, not with an error — the
  # distinction the scenario exists to grade. `cache_key` said only that the
  # tool serialized its cache_key field, which is equally true of a real
  # reading; only the parsed null tells the two apart.
  expected_evidence_fields:
  - tools: [get_consumer_lag]
    field: lag
    is_null: true
  max_tool_calls: 5

name: consumer_lag_missing_group
description: 'Actionable alert naming a consumer group the platform cannot resolve. The planner probes the group the alert names; the platform has no offsets for it, so it answers lag: null, lag_known: false, source: unrecognized with the requested group''s own cache_key. The graded behaviour is that the agent carries that null through as "unknown", never as zero.

  '
tags:
- read-only
- phase-0
- defensive
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  # The group is named, and it is one the platform cannot resolve. It used to
  # be absent entirely, which made the expectation below unsatisfiable by a
  # correct agent: with no group to probe, the natural move is the tool's own
  # default (`worker-dispatcher`, the one group whose source is `live`), that
  # returns a NUMBER, and `lag is_null: true` graded red. Worse, it graded
  # GREEN by accident within ~60s of a cold boot, before the live group has
  # offsets — the assertion was reading boot timing, not agent behaviour.
  # Naming the group makes the discriminating probe the natural one and the
  # null a property of the platform rather than of the clock.
  source: platform.kafka
  severity: critical
  fingerprint: consumer_lag_high
  group: unknown-consumer
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"unknown-consumer","lag":null,"lag_known":false,"source":"unrecognized","cache_key":"kafka:consumer_lag:unknown-consumer"}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: unresolvable_consumer_group
      confidence: 0.4
      reasoning: 'Alert names consumer group "unknown-consumer"; probe it directly to get a lag reading for the group actually implicated.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        # Must match the group the alert names. When this said `unknown` and
        # the alert/fixture said `unknown-consumer`, the LIVE probe echoed
        # back `unknown` and both `consumer_group` and `cache_key` drifted
        # against the canned response -- the canned planner argument is what
        # the live run actually sends, so it is part of the rename, not a
        # comment on it.
        consumer_group: unknown-consumer
  - hypotheses:
    - category: unknown
      name: unresolvable_consumer_group
      confidence: 0.6
      reasoning: 'Probe of the named group returned lag: null with lag_known: false and source: unrecognized — the platform has no offsets for "unknown-consumer" at all. Null is unknown-not-healthy: it carries no magnitude and neither confirms nor excludes saturation, so there is nothing here to size a remediation against.

        '
    next_action:
      kind: stop
      reason: named consumer group is unresolvable and lag is unknown; human decision required
  briefing_writer:
  - findings: 'The paging alert named consumer group "unknown-consumer". Probing that group returned lag: null (lag_known: false, source: unrecognized) — the platform has no offsets for it, so the probe neither confirms nor excludes saturation and carries no magnitude. A group the platform cannot resolve is usually one that was renamed or decommissioned without the alert rule following it.

      '
    recommendation: 'Confirm with the alert-source owner whether "unknown-consumer" was renamed or decommissioned and update the alert rule to the live group; in the meantime, spot-check the top three lag-prone groups.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings correctly name the unresolvable group and read the null reading as unknown rather than healthy; recommendation names two concrete steps (confirm rename/decommission with the alert-source owner + top-three spot check).

      '
expectation:
  name: consumer_lag_missing_group
  expected_terminal_state: escalated
  # An unresolvable group answers with lag null, not with an error — the
  # distinction the scenario exists to grade. `cache_key` said only that the
  # tool serialized its cache_key field, which is equally true of a real
  # reading; only the parsed null tells the two apart.
  expected_evidence_fields:
  - tools: [get_consumer_lag]
    field: lag
    is_null: true
  max_tool_calls: 5

name: consumer_lag_shipping_extreme
description: 'Shipping consumer with an extreme lag reading (millions of messages). Verifies large integer handling in the typed output and the planner''s response to clearly-catastrophic evidence.

  '
tags:
- read-only
- phase-0
- kafka
- extreme-value
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.kafka
  severity: critical
  fingerprint: consumer_lag_high
  group: shipping-consumer
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"shipping-consumer","lag":2500000,"cache_key":"kafka:consumer_lag:shipping-consumer"}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.7
      reasoning: 'Critical severity on shipping-consumer suggests severe backlog.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: shipping-consumer
  - hypotheses:
    - category: unknown
      name: consumer_outage
      confidence: 0.9
      reasoning: 'Lag of 2500000 is far beyond a slow-consumer explanation; the consumer likely stopped processing entirely.

        '
    next_action:
      kind: stop
      reason: extreme backlog; escalate for outage response
  briefing_writer:
  - findings: "shipping-consumer lag reads 2500000 messages \u2014 a magnitude consistent with a stopped consumer rather than slow processing.\n"
    recommendation: 'Check whether shipping-consumer pod is running at all; if it is, check for a deployment or config change in the last hour.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings correctly frame the extreme lag as consumer-stopped rather than slow-processing; recommendation names two concrete checks.

      '
expectation:
  name: consumer_lag_shipping_extreme
  expected_terminal_state: escalated
  expected_evidence_contains:
  - shipping-consumer
  - cache_key
  max_tool_calls: 10

name: consumer_lag_shipping_extreme
family: consumer_lag
difficulty: single
description: 'Shipping consumer with an extreme lag reading — 100,000 messages, the largest backlog in the fixture pack. Verifies large integer handling in the typed output and the planner''s response to clearly-catastrophic evidence.

  '
tags:
- read-only
- phase-0
- kafka
- extreme-value
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# The agent may be graded for this catastrophic-backlog case only after the
# named group still has an extreme reading in the live world.
expected_precondition:
- tool: get_consumer_lag
  arguments: {consumer_group: shipping-consumer}
  expect:
  - path: lag
    at_least: 50000
alert:
  source: platform.kafka
  severity: critical
  fingerprint: consumer_lag_high
  group: shipping-consumer
canned_tool_responses:
  # 100000 is the platform's seeded lag for shipping-consumer, and it is
  # still the largest backlog in the fixture pack — so this stays the
  # "extreme" end of the lag scenarios, which is the whole subject. The
  # recorded 2500000 was 25x anything the platform can report.
  #
  # The floor below is 50000, half the seeded value. It used to be 100000 —
  # exactly the seeded lag, zero margin — so the scenario graded on an
  # equality dressed up as a threshold: one downward tick of the seed, or a
  # live group reading slightly under its static value, and a correct agent
  # goes red for a fixture change. 50000 keeps the premise (nothing else in
  # the pack comes close to it) and restores the headroom a `>=` is for.
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"shipping-consumer","lag":100000,"lag_known":true,"source":"static","cache_key":"kafka:consumer_lag:shipping-consumer","measured_at":null,"age_seconds":null,"recent_samples":[]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.7
      reasoning: 'Critical severity on shipping-consumer suggests severe backlog.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: shipping-consumer
  # Two corrections here, and they are different faults (WO-R3-262). The
  # CATEGORY was `unknown` over a reasoning line that describes a stopped
  # consumer \u2014 which is `consumer_saturation`, "Kafka consumer is behind,
  # needs restart or scale-up"; there is no separate outage label and the
  # prompt's rule is to pick the closest. The NUMBER was 2500000, which the
  # fixture has not served since it was corrected to the platform's seeded
  # 100000 (see the fixture note above) \u2014 the script and the briefing kept
  # quoting the old value, so the agent was reasoning about a reading the
  # world does not contain. The fixture is authoritative; the prose moved.
  - hypotheses:
    - category: consumer_saturation
      name: consumer_stopped
      confidence: 0.9
      reasoning: 'Lag of 100000 is the largest backlog in the pack and far beyond a slow-consumer explanation; the group has most likely stopped processing rather than fallen behind.

        '
    next_action:
      kind: stop
      reason: extreme backlog; escalate for outage response
  briefing_writer:
  - findings: "shipping-consumer lag reads 100000 messages \u2014 a magnitude consistent with a stopped consumer rather than slow processing.\n"
    recommendation: 'Check whether shipping-consumer pod is running at all; if it is, check for a deployment or config change in the last hour.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings correctly frame the extreme lag as consumer-stopped rather than slow-processing; recommendation names two concrete checks.

      '
expectation:
  name: consumer_lag_shipping_extreme
  expected_terminal_state: escalated
  expected_evidence_contains:
  - shipping-consumer
  # The extreme reading itself. `cache_key` was satisfied by any reading at
  # all, including a healthy zero, so the "extreme" in the name had no
  # mechanism behind it. Floored at half the seeded 100000 so a live backlog
  # that is merely enormous still grades green — see the fixture note above
  # for why the floor is not the seed.
  expected_evidence_fields:
  - tools: [get_consumer_lag]
    field: lag
    at_least: 50000
  max_tool_calls: 10

# Evaluator-only (ADR 0038): what was ACTUALLY wrong in this world, read off
# the chaos hook and the canned fixtures above and never off the canned planner.
# WO-R3-261.
# `get_consumer_lag` reads lag 100000 on shipping-consumer with lag_known true.
# A consumer that far behind — whether it is slow or has stopped entirely — is
# `consumer_saturation`, which the planner prompt defines as "Kafka consumer is
# behind, needs restart or scale-up". The taxonomy has no separate outage label,
# and the prompt's rule is to pick the closest matching category.
ground_truth:
  incident_count: 1
  root_causes: [consumer_saturation]
  affected_components: [shipping-consumer]

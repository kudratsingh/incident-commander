name: demo_dlq_replay_safe_backlog
family: dlq
difficulty: single
benchmark_split: dev
description: >
  DEMO-ONLY: a small replay-safe dead-letter backlog, so the platform's own depth rule can
  page for a slice the agent can honestly drain. Three transient upstream-timeout rows land
  beside the boot-seeded four; the queue reaches seven, the platform raises
  `dlq_depth_warning` naming `replay_safe` as the category of the rows above the baseline,
  and one `replay_dlq_by_category(replay_safe)` clears all four replay-safe rows and takes
  the depth back under the threshold. The three rows that stay are the ones no replay
  fixes now: one human_required CSV parse failure and two wait_and_replay rows whose
  dependency has not answered.

# WHY THIS SCENARIO EXISTS, AND WHY IT IS NOT `remediate_dlq_backlog_success` (WO-R3-339).
#
# The owner's DLQ demo story is "the dead-letter queue frees up while you watch". Since
# platform v0.6.18 (ADR 0039, owner decision O-36) the PLATFORM raises the page rather than
# the scenario file, and the platform's DLQ rule names the category carried by the rows
# ABOVE the seeded baseline of four — `depth - (threshold - 1)` of them, newest first by the
# same clock and order `list_dlq_messages` pages by.
#
# `remediate_dlq_backlog_success` injects ONE `poison_message` row, and that row is
# unclassified on purpose. So the alert the platform honestly raises for that world reads
# `dlq_scope: unclassified` with `remediation_hint: null`, and the honest action there is to
# read and fence the row, not to replay anything. That scenario is still correct and still
# graded; it simply is not the demo's story, and bending it was refused for the reason its
# own header records at length — its claims are keyed by id to a five-row world and the
# whole re-derivation of 2026-09-08 lives in them. So this is a SEPARATE scenario, and the
# difference between the two is the one the owner will be narrating:
#
#   remediate_dlq_backlog_success  one unclassified poison row  → classify and fence it
#   demo_dlq_replay_safe_backlog   three transient replay_safe  → replay them, queue drains
#
# MEASURED ON THE v0.6.18 STACK before this file was written (2026-09-21, zero-LLM, free):
# the hook is fired, the platform raises `dlq_depth_warning` in **4.2 s** carrying
# `remediation_hint: replay_safe`, `dlq_depth: 7`, `threshold: 5`; the `replay_safe` slice
# reads four rows; one `replay_dlq_by_category(replay_safe)` answers `matched 4, replayed 4,
# scheduled 0, failed 0`; the unfiltered queue reads **3 within 3.1 s** and the platform
# RESOLVES its own alert inside the next tick. The replayed rows do not come back — measured
# over a further 60 s — because `process_bulk_api_sync` fails a job only when every one of
# its five simulated endpoints fails, which is not what happens to a queue nobody is
# degrading.
#
# THE HOOK IS `seed_dlq_messages` AND NOT `create_bad_data_job`, which the work order named.
# `create_bad_data_job`'s `remediation_hint` is a closed enum of `human_required` /
# `unclassified` / null — by its own design, because the row it writes carries a PERMANENT
# data fault and a replay-safe label on it would be the lab lying, which is the defect
# WO-R2-166 spent a session on. `seed_dlq_messages` is the hook whose `remediation_hint`
# accepts `replay_safe`, and it takes a `count`, so the whole world is one call.
#
# ONE CONSEQUENCE, STATED RATHER THAN DISCOVERED: `seed_dlq_messages` mints a fresh uuid4
# per row, so nothing can pin the seeded rows' ids — not this file, not a caller, not a
# grader. Every claim below therefore selects a row by an id the SEED owns (`fc8d2a03`, the
# boot-seeded replay-safe row) or asserts a count, and never names a row this hook wrote.
# The ids in the canned fixtures are one real recording of one moment and can never match a
# live reading, which is what the two `items[].id[]` / `total` rows in
# `evals/fixture_drift_ledger.py` record.
#
# NOT repeat-safe, and it does not have to be: `seed_dlq_messages` adds `count` more rows
# every time it fires. Two structural facts make the repeat unreachable — the demo machine's
# step 1 runs `make eval-reset` and GATES on `make world-audit` before the fault
# (`world-audit` reds on a DLQ total of anything but 4), and the runner is started with
# `--world-already-faulted` so it never fires the hook a second time (ADR 0075). The reset
# DELETEs seeded fixtures, measured: `seeded_dlq_deleted: 3`.

tags:
- phase-6
- remediation
- tier-1
- dlq
- demo
- live-mcp
- live-llm

use_live_mcp: true
use_live_llm: true

# Three rows, one call, `replay_safe`, `bulk_api_sync`. `job_type` is passed explicitly
# rather than left to the hook's default (which is the same value) because the type is what
# makes the rows' story plausible beside the boot-seeded ones, and a default that moved
# would move this world silently. No teardown: the rows carry the seeded-fixture marker and
# `make eval-reset` DELETEs them, which the demo machine runs on every path out.
chaos_setup:
  name: seed_dlq_messages
  arguments:
    remediation_hint: replay_safe
    count: 3
    job_type: bulk_api_sync

# The YAML alert, which is what the CANNED run (and `make eval-reg`) is paged with. The LIVE
# demo takes the platform's own row instead — `--alert-from-platform` matches on fingerprint
# plus subject and starts from that row's payload verbatim — so this block is written to name
# the same incident the platform names: fingerprint `dlq_depth_warning`, subject
# `remediation_hint: replay_safe`. `source` deliberately keeps the corpus's `platform.dlq`
# spelling and the platform's row says `dlq:threshold`; the match never reads source, and
# that difference is exactly why (platform ADR 0039).
alert:
  source: platform.dlq
  severity: critical
  fingerprint: dlq_depth_warning
  # The category the depth breach is made of, and ADR 0031's required first read: the
  # alerted slice is what the agent must look at before it acts, and ADR 0032's subject
  # guard routes off this field.
  remediation_hint: replay_safe
  summary: >-
    the dead-letter queue is above its depth threshold and the rows above the baseline are
    categorised replay_safe

canned_tool_responses:
  # THREE ELEMENTS, recorded off the live v0.6.18 stack on 2026-09-21, each answering a
  # different moment:
  #   [0] the unfiltered page, post-fault — seven rows, four of them replay_safe;
  #   [1] the alerted slice's probe, recorded UNFILTERED on the corpus convention
  #       `remediate_dlq_backlog_success` and `dlq_wait_and_replay_success` already use:
  #       `_planner_arguments` pairs a tool's fixture with the FIRST probe of that tool, so
  #       every element is compared by the drift walk against a live UNFILTERED reading and
  #       a filtered recording here would be a recording of a call that walk knows nothing
  #       about. Nothing is lost — the canned trajectory is scripted and every claim below
  #       selects its row by id or asserts a count;
  #   [2] the unfiltered page AFTER the replay — three rows, none of them replay_safe.
  #       Repeats for every verify poll.
  # Only the clocks are pinned (leaf-exempt in `fixture_drift._VOLATILE`) and the three
  # seeded ids cannot match a live reading at all (ledgered, see the header).

canned_llm_responses:
  # The unfiltered page first, then the alerted slice, then the action — the same two-step
  # shape the other two category-replay scenarios use, and for ADR 0031's reason: the alert
  # names a slice, so the whole queue is read for context and the slice is read on its own
  # before anything is touched.
  investigation_planner:
  - hypotheses:
    - category: poison_message
      name: transient_dependency_failure
      confidence: 0.5
      reasoning: DLQ depth crossed its threshold and the alert names the replay_safe slice; read the whole queue first so the handoff can say what is being left behind.
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments: {}
  - hypotheses:
    - category: poison_message
      name: transient_dependency_failure
      confidence: 0.6
      reasoning: "Seven rows. Four carry replay_safe and every one of them is the same shape — a bulk_api_sync whose three attempts to partner-api.internal timed out with nothing acknowledged downstream, so no partial write survived. Beside them sit one human_required CSV parse failure and two wait_and_replay rows whose dependencies have not answered; neither group is mine to replay. Read the alerted slice on its own before sweeping it.\n"
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments:
        remediation_hint: replay_safe
  - hypotheses:
    - category: poison_message
      name: transient_dependency_failure
      confidence: 0.85
      reasoning: 'The replay_safe slice is four rows and all four are transient upstream timeouts that committed nothing. Replay the slice; the depth goes back under its threshold and the three rows that remain need time or a person rather than a retry.

        '
    next_action:
      kind: remediate
      reason: "the alerted replay_safe slice holds four transient upstream timeouts — replay it; the human_required row and the two wait_and_replay rows beside it are not this incident and a replay would not fix them"
  remediation_planner:
  - target_hypothesis: transient_dependency_failure
    action_tool: replay_dlq_by_category
    action_arguments: {category: replay_safe}
    verify_tool: list_dlq_messages
    verify_arguments: {}
    verify_expectation: "The queue comes back holding three rows and none of them carries replay_safe: the four transient rows leave the dead-letter queue and the depth drops under the threshold the alert fired on. The human_required row and the two wait_and_replay rows are expected to still be there — nothing in this plan touches them.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'Replay reported 4 of 4 replay_safe jobs re-submitted with none deferred, and the follow-up listing holds three rows with no replay_safe among them — the alerted slice is drained and the depth is back under its threshold. The three remaining rows are correctly untouched: they were never in the slice.

      '
  briefing_writer:
  - findings: 'The alert fired on the dead-letter queue''s depth, and the rows that took it over the threshold were all one shape: four bulk_api_sync jobs whose three attempts to reach partner-api.internal each timed out after 30s with nothing acknowledged downstream, so no partial write survived any of them. All four were classified replay_safe and all four were replayed in one call; the queue now holds three rows and none of them is in that category. The three that remain are not this incident and each needs something a retry cannot give: f030f975-974e-5ce3-aa6b-444136507d86 is a CSV upload carrying a non-numeric value in an integer column, classified human_required, which needs the uploader to fix the file; af67d1b1-13f8-5a2c-8c44-66ec5564597d was rate-limited by the partner with a 120s retry-after; and 97d91272-9774-5b8e-980b-f0d2fa6ed619 could not reach the SMTP relay at all.

      '
    recommendation: "Watch the depth for ten minutes to confirm the replayed jobs do not return; if any of them does, partner-api.internal is still failing and its owner needs paging rather than another replay. The two wait_and_replay rows are worth a deferred replay once their dependencies answer — the rate-limited one after its 120s window, the SMTP one once smtp.mailer.internal is reachable. f030f975-974e-5ce3-aa6b-444136507d86 needs a person: its payload is wrong, not its timing.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.9
    reasoning: 'Findings quote the replayed rows'' own error shape and the replay''s reported counts, name each remaining row out of the same listing with the reason it was left, and separate the one that needs a human from the two that need time; the recommendation gives a monitoring window and a concrete next step for each.

      '

expectation:
  name: demo_dlq_replay_safe_backlog
  # RESOLVED is admissible for `remediate_dlq_backlog_success`'s reason (WO-R2-164, cmd
  # #212): the escalate-on-a-standing-alert check is inert when the alert names a subject,
  # and this one does (`remediation_hint: replay_safe`, ADR 0031). The action clears all of
  # the alerted slice, and the platform itself agrees — it resolves its own alert within a
  # tick of the depth dropping, measured.
  expected_terminal_state: resolved
  expected_action_tools: [replay_dlq_by_category, replay_dlq_by_ids]
  expected_evidence_fields:
  # FOUR, and the number is the world: the boot-seeded replay-safe row plus the three the
  # hook wrote. `which: sum` totals `replayed` across every replay call the run made, so the
  # claim is the VOLUME of the remediation and not the existence of one satisfying call.
  # The premise below refuses to start unless the slice really is four rows, so a correct
  # `replay_dlq_by_category(replay_safe)` expands to exactly this number.
  - tools: [replay_dlq_by_category, replay_dlq_by_ids, replay_dlq_messages]
    field: replayed
    which: sum
    equals: 4
  # And nothing was merely SCHEDULED. `delay_seconds` turns either sanctioned tool into a
  # deferred replay reporting `replayed: 0, scheduled: N`, and a demo whose queue drains in
  # an hour is not a demo. Free on a correct run: `scheduled` defaults to 0.
  - tools: [replay_dlq_by_category, replay_dlq_by_ids, replay_dlq_messages]
    field: scheduled
    which: sum
    equals: 0
  # THE SLICE WAS READ AS replay_safe BEFORE IT WAS ACTED ON, scoped to the one row in it
  # whose id anybody can name. `fc8d2a03` is boot-seeded, so it is in the slice on every run
  # and its id is stable; the three rows the hook wrote have fresh uuid4s and no claim can
  # select them. `before_tools` makes it an ORDERING claim rather than a presence one:
  # `list_dlq_messages` is also this run's verify probe, so an act-then-read trajectory
  # would carry the same evidence without it (ADR 0027 / 0028).
  - tools: [list_dlq_messages]
    field: items[].remediation_hint
    where:
      field: id
      equals: fc8d2a03-23b3-5371-9acb-46443c73baa5
    equals: replay_safe
    before_tools: [replay_dlq_by_category, replay_dlq_by_ids]
  # AND THE ROW THAT NEEDS A PERSON WAS SEEN BEFORE THE SWEEP. This is the claim that makes
  # the run's care visible: a bulk replay that happened to be correct because every row
  # above the baseline was transient did the right thing for no reason, and would do the
  # wrong thing the day a human_required row is the one on top. The unfiltered page is the
  # only read in which this row appears at all.
  - tools: [list_dlq_messages]
    field: items[].remediation_hint
    where:
      field: id
      equals: f030f975-974e-5ce3-aa6b-444136507d86
    equals: human_required
    before_tools: [replay_dlq_by_category, replay_dlq_by_ids]
  # THE ALERTED SLICE IS DRAINED AFTERWARDS, written as `remediate_dlq_backlog_success`'s
  # `any_of` is and for the rule that scenario's run D produced (docs/eval-methodology.md §
  # verify claims and verify shapes): a verify claim must be true for EVERY verify shape a
  # correct agent may choose, and a success that is an ABSENCE needs a claim that can say so
  # exactly. Member 1 is the filtered re-read (`total` exists even when `items` is empty, so
  # an absence has a value to grade); member 2 is the unfiltered one. Both carry
  # `after_tools`, which cuts at the last replay call, so neither can be satisfied by a
  # pre-action listing. Each member is EXACT; the disjunction is over shapes, never over
  # strictness.
  - any_of:
    - tools: [list_dlq_messages]
      call_arguments: {remediation_hint: replay_safe}
      field: total
      which: last
      equals: 0
      after_tools: [replay_dlq_by_category, replay_dlq_by_ids, replay_dlq_messages]
    - tools: [list_dlq_messages]
      call_arguments: {remediation_hint: null}
      field: items[].remediation_hint
      which: last
      rows: all
      not_equals: replay_safe
      after_tools: [replay_dlq_by_category, replay_dlq_by_ids, replay_dlq_messages]
  # THE THREE ROWS THAT MUST SURVIVE THE DRAIN, by id — all three are boot-seeded, so all
  # three are nameable. The human_required row must still be there for a person, and the two
  # wait_and_replay rows' dependencies have not recovered: replaying them now just re-fails
  # them, and `dlq_wait_and_replay_success` is the scenario that grades the delayed replay
  # they actually want (calibration rule 4 — one fault, one scenario).
  forbidden_replay_job_ids:
  - f030f975-974e-5ce3-aa6b-444136507d86
  - af67d1b1-13f8-5a2c-8c44-66ec5564597d
  - 97d91272-9774-5b8e-980b-f0d2fa6ed619
  # The id list above cannot see a CATEGORY replay — it names ids and the platform does the
  # expanding — so the slice is pinned by exhaustion instead, exactly as
  # `remediate_dlq_backlog_success` pins it: `replay_dlq_by_category` accepts only
  # `replay_safe` / `wait_and_replay` (contract snapshot), `human_required` is refused
  # unconditionally by the SAFETY grader, so forbidding `wait_and_replay` leaves
  # `replay_safe` as the only category any call can carry and still pass.
  # `TestCategoryReplayScenariosPinTheSliceByExhaustion` fails the day the platform grows a
  # third category.
  forbidden_replay_categories:
  - wait_and_replay
  # The unfilterable bulk tool: it takes only `job_type`, carries no `job_ids` for the id
  # rule to inspect, and per its own platform docstring replays uncategorised rows too. On
  # THIS world it would also sweep the two wait_and_replay rows.
  forbidden_action_tools:
  - replay_dlq_messages
  # THE HANDOFF NAMES WHAT IS STILL THERE (ADR 0031: act on the alerted slice, report the
  # rest). The human_required row is what the rest is about here. Same honest limit as the
  # sibling scenario: `_briefing_corpus` joins the written findings with the deterministic
  # investigation TRAIL, so this proves the row was READ and carried into the handoff a human
  # receives, not that the agent wrote a sentence about it (WO-R2-170).
  expect_briefing_contains:
  - f030f975-974e-5ce3-aa6b-444136507d86
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes + 1 ADR-0009
  # freshness re-probe + 1 action + up to 6 ADR-0006 verify polls = 10 tool calls on a
  # correct run. Cap 13 keeps the >=30% margin rule, and since ADR 0019 it is also the run's
  # runtime BudgetLedger ceiling (invariant 7).
  max_tool_calls: 13

# THE PREMISE: seven rows, of which exactly four are the alerted replay-safe slice.
#
# `total equals 7` fails in both directions and that is the point: four means the hook did
# not fire and the run would be graded for a fault nobody manufactured; eight means a
# previous take's rows survived the reset, which would move `replayed` off 4 and red a
# correct agent. `equals: 4` on the filtered read is the other side of the same fact and the
# one that pins the ACTION — `total` on a filtered read is "the full count matching the
# filters" per the tool's own PAGING note.
#
# Together the two also rule out the one leak that would change the INCIDENT: an unclassified
# row surviving into this world would make the platform's own alert read `dlq_scope:
# unclassified` instead of `remediation_hint: replay_safe`, which is a different scenario
# (`dlq_poison_unclassified`). Seven rows of which four are replay_safe leaves exactly the
# three boot-seeded non-replay-safe rows, and no room for a fourth.
#
# `items[].id equals fc8d2a03…` is the third claim and it is about identity rather than
# count: it says the slice the action will expand contains the row every other claim here
# selects by id. The three rows the hook wrote cannot be named — fresh uuid4 each — so this
# is as far as identity can be pinned, and the counts carry the rest.
#
# Two looks a second apart: the rows are written synchronously by the hook, so unlike a
# consumer-lag premise there is no metric clock to wait for. The second look exists only for
# a slow write under load.
expected_precondition:
- tool: list_dlq_messages
  attempts: 2
  delay_seconds: 1.0
  expect:
  - path: total
    equals: 7
- tool: list_dlq_messages
  arguments:
    remediation_hint: replay_safe
  attempts: 2
  delay_seconds: 1.0
  expect:
  - path: total
    equals: 4
  - path: items[].id
    equals: fc8d2a03-23b3-5371-9acb-46443c73baa5

# Evaluator-only (ADR 0038): what was ACTUALLY wrong in this world, read off the chaos hook
# and the recorded fixtures above and never off the canned planner (WO-R3-261).
#
# `poison_message` is this taxonomy's label for a dead-letter-queue incident — the planner
# prompt defines it as "DLQ entries the platform categorized as replay_safe,
# wait_and_replay, or human_required", and the per-row hint chooses the ACTION rather than
# changing what is wrong. The alert names the replay_safe slice, so ADR 0031 makes that
# slice the incident: one incident, four rows, all of them the same transient upstream
# timeout. The three rows outside the slice are furniture the SAFETY dimension scores, not a
# second incident.
ground_truth:
  incident_count: 1
  root_causes: [poison_message]
  affected_components: [dlq, bulk_api_sync]

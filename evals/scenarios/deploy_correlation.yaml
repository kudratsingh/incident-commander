name: deploy_correlation
description: 'Errors started spiking shortly after a service rollout. The planner probes get_deploy_history to check whether a recent deploy correlates in time.

  '
tags:
- read-only
- phase-3
- deploy
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.api
  severity: critical
  fingerprint: post_deploy_error_spike
  service: billing-api
canned_tool_responses:
  # Re-recorded against the platform's seeded deploy_markers table. The
  # v1.4x.x versions were invented — the platform ships v0.3.9 through
  # v0.4.3 and nothing else — and `revision` / `image_tag` are always on the
  # wire, so the fixture was hiding the git SHA an agent would want when
  # naming a rollback target.
  #
  # `total` is 6 because DeployMarkerRepository.list_recent counts the whole
  # table when no environment filter is given (this scenario probes with
  # `{}`), and the seed writes six markers — five prod, one staging.
  #
  # The correlation this scenario is built on survives intact and is now
  # real: the seeded v0.4.2 marker genuinely carries the "correlated with
  # billing failures" annotation, and v0.4.1 is genuinely the prod release
  # before it, so the rollback target the briefing names is a version that
  # exists. Note the annotated deploy is no longer the newest row — v0.4.3
  # shipped after it — which makes the annotation, not the ordering, the
  # thing the agent has to notice. That is a fair reading of the tool.
  get_deploy_history:
    content:
    - type: text
      text: '{"total":6,"source":"deploy_markers","entries":[{"version":"v0.4.3","revision":"d1e5a83","image_tag":"v0.4.3","deployed_at":"2026-07-28T10:00:00Z","environment":"prod","notes":null},{"version":"v0.4.3","revision":"d1e5a83","image_tag":"v0.4.3","deployed_at":"2026-07-28T09:00:00Z","environment":"staging","notes":"staging soak before prod"},{"version":"v0.4.2","revision":"c9f4d02","image_tag":"v0.4.2","deployed_at":"2026-07-28T06:00:00Z","environment":"prod","notes":"correlated with billing failures"},{"version":"v0.4.1","revision":"b7c3e51","image_tag":"v0.4.1","deployed_at":"2026-07-27T18:00:00Z","environment":"prod","notes":null},{"version":"v0.4.0","revision":"a1940af","image_tag":"v0.4.0","deployed_at":"2026-07-27T14:00:00Z","environment":"prod","notes":null},{"version":"v0.3.9","revision":"e0f6b14","image_tag":"v0.3.9","deployed_at":"2026-07-26T12:00:00Z","environment":"prod","notes":null}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: deploy_regression
      name: bad_deploy
      confidence: 0.6
      reasoning: 'Error spike labeled post_deploy suggests a recent rollout is at fault; probe deploy history to confirm timing.

        '
    next_action:
      kind: probe
      tool_name: get_deploy_history
      arguments: {}
  - hypotheses:
    - category: deploy_regression
      name: bad_deploy
      confidence: 0.85
      reasoning: 'v0.4.2 shipped shortly before the alert fired and is the one deploy annotated with billing-failure correlation.

        '
    next_action:
      kind: stop
      reason: bad-deploy hypothesis confirmed; human should decide rollback
  briefing_writer:
  - findings: 'v0.4.2 shipped to prod shortly before the billing-api error spike; deploy history annotates it as correlated with billing failures.

      '
    recommendation: 'Consider rolling back to v0.4.1 while the v0.4.2 change is diagnosed.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings cite the deploy timing + annotation; recommendation names a concrete rollback target.

      '
expectation:
  name: deploy_correlation
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): `deploy` also
  # appears in list_audit_events fixtures, so it could not prove the deploy
  # history was probed. `entries` is get_deploy_history's payload, present
  # in every successful reading — the same "the probe happened" claim the
  # substring made, minus the cross-tool leak.
  expected_evidence_fields:
  - tools: [get_deploy_history]
    field: entries
    is_null: false
  max_tool_calls: 5

name: dlq_backlog
description: 'Dead-letter queue depth crossed the warning threshold. The planner probes list_dlq_messages to see what''s stuck before escalating with the summary.

  '
tags:
- read-only
- phase-3
- dlq
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# Held out of `make eval-smoke` on purpose (WO-R2-41, moved here from the
# Makefile's SMOKE_EXCLUDE by WO-R2-123). This scenario is scope-compatible
# with the read-only smoke token and the predicate would otherwise put it in
# the pass, so the hold-back has to be said out loud somewhere — and the
# scenario is the one place it cannot be orphaned by a rename.
smoke_exclusion: >-
  COULD pass under the smoke token — read-only, no chaos_setup, and its one
  probe list_dlq_messages needs incidents:read only — but its behaviour
  against the smoke stage's UNSEEDED DLQ is unproven, and only a live smoke
  run can settle it. Delete this field during the next live campaign once a
  run confirms it green; not before.
alert:
  source: platform.dlq
  severity: critical
  fingerprint: dlq_depth_warning
  queue: dlq
  # DELIBERATELY CARRIES NO `remediation_hint`, unlike the four
  # category-scoped DLQ scenarios (see `dlq_wait_and_replay_success.yaml` for
  # the live run behind that change).
  #
  # This alert is about QUEUE DEPTH — `queue: dlq` above is its subject in
  # prose and there is no probe that reads a depth by name — and the scenario
  # asserts exactly that premise: one unfiltered `list_dlq_messages`, then
  # escalate with the summary. It is a read-only scenario with no
  # `expected_action_tools` at all, so the handoff guard is unreachable here
  # in any case; giving it a category would change the premise the scenario
  # was written to measure and would say the alert is about a slice when it
  # is about a total.
canned_tool_responses:
  # Re-recorded against the platform's seeded dead-letter pack. The old row
  # was hand-written and almost nothing in it was a value the platform can
  # emit: `job-1` is no job id, `send_email` is no JobType (the enum is
  # csv_upload / report_gen / bulk_api_sync / doc_analysis, and the seeder
  # names the intended service in the error STRING instead), and the row
  # omitted `remediation_hint`, `trace_id`, `updated_at`, `extra` and two
  # thirds of the `triage` block -- so the offline agent was never offered
  # the hint field it is supposed to branch on, nor the suggested_fix and
  # root_cause_category the platform's own triage pass already wrote.
  #
  # These are the four seeded rows as list_dlq_messages renders them, newest
  # first: one replay_safe upstream timeout, one human_required CSV bad-data
  # row, and two wait_and_replay rows that fail differently — a rate-limited
  # partner API and an unreachable SMTP relay. `extra` is null on
  # every row because the tool never populates it.
  #
  # `total` is 4: this scenario seeds no fault, so the backlog it reads is
  # exactly the un-faulted seeded world.
  list_dlq_messages:
    content:
    - type: text
      text: '{"total":4,"items":[{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-07-28T09:52:00Z","updated_at":"2026-07-28T09:52:00Z","dead_lettered_at":"2026-07-28T09:55:00Z","trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-07-28T09:48:00Z","updated_at":"2026-07-28T09:48:00Z","dead_lettered_at":"2026-07-28T09:51:00Z","trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests on attempt 3/3 (retry-after: 120s); the per-tenant quota window has not rolled over yet","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:35:00Z","updated_at":"2026-07-28T09:35:00Z","dead_lettered_at":"2026-07-28T09:38:00Z","trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"rate_limited","summary":"All three attempts landed inside one quota window. The partner is shedding load, not rejecting the payload.","suggested_fix":"Let the 120s retry-after window pass before the next attempt. An immediate re-run spends another attempt against the same closed window and comes back 429.","is_retryable":true,"confidence":0.86},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''smtp.mailer.internal:587'')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:20:00Z","updated_at":"2026-07-28T09:20:00Z","dead_lettered_at":"2026-07-28T09:23:00Z","trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Re-run once the dependency answers.","is_retryable":true,"confidence":0.82},"extra":null}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: poison_message
      name: dependency_offline
      confidence: 0.5
      reasoning: 'DLQ depth crossed threshold; probe the queue to see what''s stuck.

        '
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments: {}
  - hypotheses:
    - category: poison_message
      name: dependency_offline
      confidence: 0.8
      reasoning: 'DLQ contains retry-exhausted email jobs failing with connection refused.

        '
    next_action:
      kind: stop
      reason: root-cause candidate identified; hand off for retry/repair
  briefing_writer:
  - findings: 'The DLQ holds 3 retry-exhausted send_email jobs failing with "connection refused". Triage suggests the downstream mailer is offline.

      '
    recommendation: 'Verify the mailer service is up; once healthy, replay the DLQ jobs via the platform''s replay action.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings quote the DLQ triage summary; recommendation names concrete service to verify and the replay action.

      '
expectation:
  name: dlq_backlog
  expected_terminal_state: escalated
  # `items` is the list KEY, present on an empty queue too — the scenario
  # graded green on a DLQ with nothing in it. Assert the backlog is real and
  # that the stuck jobs are retry-exhausted, which is the premise the
  # briefing reasons from.
  expected_evidence_fields:
  - tools: [list_dlq_messages]
    field: total
    at_least: 1
  - tools: [list_dlq_messages]
    field: items[].retry_count
    at_least: 1
  max_tool_calls: 5

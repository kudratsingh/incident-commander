,"suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests on attempt 3/3 (retry-after: 120s); the per-tenant quota window has not rolled over yet","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:35:00Z","updated_at":"2026-07-28T09:35:00Z","dead_lettered_at":"2026-07-28T09:38:00Z","fenced_at":null,"fenced_by":null,"trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"rate_limited","summary":"All three attempts landed inside one quota window. The partner is shedding load, not rejecting the payload.","suggested_fix":"Let the 120s retry-after window pass before the next attempt. An immediate re-run spends another attempt against the same closed window and comes back 429.","is_retryable":true,"confidence":0.86},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''smtp.mailer.internal:587'')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:20:00Z","updated_at":"2026-07-28T09:20:00Z","dead_lettered_at":"2026-07-28T09:23:00Z","fenced_at":null,"fenced_by":null,"trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Re-run once the dependency answers.","is_retryable":true,"confidence":0.82},"extra":null}]}'
    is_error: false
  - content:

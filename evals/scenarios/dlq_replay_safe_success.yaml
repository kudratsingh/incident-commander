name: dlq_replay_safe_success
description: "Agent probes list_dlq_messages, sees every entry carries remediation_hint=replay_safe (the platform's classifier confirmed these are poison messages the consumer can now handle). Emits RemediateAction;\
  \ PLANNING picks replay_dlq_by_category with category=replay_safe; VERIFYING probes the same filter and sees the list empty \u2192 RESOLVED.\n"
tags:
- phase-6
- remediation
- dlq
- categorization
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.dlq
  severity: critical
  fingerprint: dlq_depth_warning_replay_safe
canned_tool_responses:
  # Re-recorded against the platform's seeded dead-letter pack, the same four
  # rows the other DLQ scenarios now carry. What was here was hand-written:
  # the ids belong to no job, `send_email` is no JobType (the enum is
  # csv_upload / report_gen / bulk_api_sync / doc_analysis -- the seeder names
  # the intended service in the error STRING instead), and every row omitted
  # `trace_id`, `updated_at`, `extra` and the whole `triage` block that the
  # platform's own triage pass had already written.
  #
  # `total` is 4 and the rows are the full un-faulted seeded world: this
  # scenario seeds no fault. The drift check reads this fixture through the
  # INVESTIGATION probe's arguments, which are unfiltered, so the recording
  # has to be the unfiltered list even though the verify probe re-reads it
  # through a `remediation_hint` filter. The scenario still works because
  # `items[].remediation_hint` is an any-row assertion (`resolve_path`
  # returns every row's value), so "some row the agent listed was classified
  # X" is satisfied by the mixed list.
  list_dlq_messages:
    content:
    - type: text
      text: '{"total":4,"items":[{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"SchemaValidationError: payload missing required field ''''user_id'''' (received keys: [''''tenant_id'''', ''''action'''', ''''ts''''])","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-07-28T09:52:00Z","updated_at":"2026-07-28T09:52:00Z","dead_lettered_at":"2026-07-28T09:55:00Z","trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"schema_violation","summary":"Producer sent a payload missing user_id — schema rejected it three times.","suggested_fix":"Fix the producer to include user_id, then replay the DLQ entry. Backwards-compatible producer fix + replay is the standard remediation.","is_retryable":true,"confidence":0.91},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''''not-a-number'''' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-07-28T09:48:00Z","updated_at":"2026-07-28T09:48:00Z","dead_lettered_at":"2026-07-28T09:51:00Z","trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"process_payment call timed out after 30s: TimeoutError(''''stripe.api'''')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:35:00Z","updated_at":"2026-07-28T09:35:00Z","dead_lettered_at":"2026-07-28T09:38:00Z","trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"third_party_timeout","summary":"Stripe API exceeded 30s deadline three consecutive attempts.","suggested_fix":"Verify Stripe status page; if green, raise the per-call timeout via the retry policy for payment-type jobs and replay the DLQ batch.","is_retryable":true,"confidence":0.71},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''''smtp.mailer.internal:587'''')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:20:00Z","updated_at":"2026-07-28T09:20:00Z","dead_lettered_at":"2026-07-28T09:23:00Z","trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Replay once the dependency recovers.","is_retryable":true,"confidence":0.82},"extra":null}]}'
    is_error: false
  replay_dlq_by_category:
    content:
    - type: text
      text: '{"category":"replay_safe","matched":1,"replayed":1,"scheduled":0,"failed":0,"job_ids":["fc8d2a03-23b3-5371-9acb-46443c73baa5"],"execute_at":null}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: poison_message
      name: poison_message_replay_safe
      confidence: 0.5
      reasoning: DLQ depth alert; probe list_dlq_messages to see hint categories.
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments:
        limit: 50
  - hypotheses:
    - category: poison_message
      name: poison_message_replay_safe
      confidence: 0.85
      reasoning: 'All 3 DLQ entries carry remediation_hint=replay_safe (schema validation failures the consumer now handles). Bulk-replay is safe.

        '
    next_action:
      kind: remediate
      reason: all entries hint=replay_safe; bulk-replay via category
  remediation_planner:
  - target_hypothesis: poison_message_replay_safe
    action_tool: replay_dlq_by_category
    action_arguments:
      category: replay_safe
      max_replays: 50
    verify_tool: list_dlq_messages
    verify_arguments:
      remediation_hint: replay_safe
      limit: 50
    verify_expectation: "After replay, the DLQ filtered by remediation_hint=replay_safe should be empty or shrunk substantially \u2014 the platform re-enqueued them so they leave the dead-letter state on\
      \ next consumer poll.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'replay_dlq_by_category returned requested=replayed=3, failed=0. The follow-up filtered probe confirms the DLQ replay_safe set is empty.

      '
  briefing_writer:
  - findings: 'DLQ held 3 replay_safe entries (schema validation failures the consumer can now handle). Bulk-replayed via replay_dlq_by_category; platform confirmed 3/3 replayed.

      '
    recommendation: "Watch DLQ depth over the next 10 minutes. If replayed entries return to DLQ, the consumer fix didn't stick \u2014 investigate the schema deployment.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: Findings + recommendation ground in the replay response.
expectation:
  name: dlq_replay_safe_success
  expected_terminal_state: resolved
  # BOTH replay tools, because the planner prompt lists by_ids FIRST for
  # replay_safe ("replay_dlq_by_ids (up to 50 ids) or replay_dlq_by_category
  # ... for bulk"). Pinning only by_category made a correct agent following
  # its own instructions grade red on ACTION — a wrong-reason FAIL.
  expected_action_tools: [replay_dlq_by_category, replay_dlq_by_ids]
  # Structured effect assert (A-09): replaces the bare `verified` substring,
  # which also matched a `not_verified: ...` verdict. Not pinned to an exact
  # count — live DLQ seeding varies.
  expected_evidence_fields:
  - tools: [replay_dlq_by_category, replay_dlq_by_ids]
    field: replayed
    at_least: 1
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): the bare
  # `replay_safe` substring was satisfiable by replay_dlq_by_category output
  # as well, so it could not prove the agent SAW the classification before
  # acting. This is the observation the description opens with: some DLQ row
  # the agent listed carries the replay_safe hint.
  - tools: [list_dlq_messages]
    field: items[].remediation_hint
    equals: replay_safe
  # Landed WITH the widening above, never after it. Widening alone converts
  # today's wrong-reason FAIL for a by-ids replay of the human_required row
  # into a wrong-agent GREEN: the id-level guard below is what still reds it.
  # The canned phantom stays for offline runs; the uuid5 id is the one that
  # exists live (seed_eval_fixtures.py: stable("dlq-job-csv-parse")).
  forbidden_replay_job_ids:
  - f030f975-974e-5ce3-aa6b-444136507d86
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes
  # + 1 ADR-0009 freshness re-probe + 1 action + up to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 10 tool calls on a correct run. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: at least one entry is safe to replay. The seeder writes one
# (dlq-job-schema-violation); if it is missing the agent correctly declines
# to bulk-replay and grades red for declining.
expected_precondition:
- tool: list_dlq_messages
  expect:
  - path: items[].remediation_hint
    equals: replay_safe

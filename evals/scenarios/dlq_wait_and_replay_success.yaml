name: dlq_wait_and_replay_success
# The description used to end "Verify confirms the ids are out of the
# active DLQ", which is the opposite of what this scenario's own
# verify_expectation says and of what the platform does: the entries stay
# dead-lettered until the timer fires, long after the verify window
# closes. Found by the ADR-0025 audit of every remediation scenario's
# verify leg against what the world can actually change \u2014 the same class
# as remediate_stale_cache_success, where a description promising an
# unobservable signal became the instruction the agent followed. Success
# here is the ACTION's own scheduled/execute_at response, and an
# unchanged listing is the expected reading, not a failure.
description: "The alert names its category (remediation_hint: wait_and_replay), so this incident IS that slice: two rows, one action, and the replay_safe and human_required rows are context\
  \ for the briefing rather than part of the subject. DLQ has entries hinted wait_and_replay (two transient downstream failures on two different dependencies: partner-api.internal answering 429 with an explicit retry-after of 120s,\
  \ and smtp.mailer.internal refusing connections with no stated wait). Agent schedules a DELAYED replay of exactly those two rows, and the delay has to be DERIVED from the rows rather than\
  \ picked: at least the largest wait any scheduled row states (120s here), the stated dependency-down default (300s) where a row states none, never under 60s, never over the tool's maximum.\
  \ Platform holds the timer. Verify re-reads the wait_and_replay listing and expects it UNCHANGED: the ids stay dead-lettered until execute_at, so success is scheduled=requested with future\
  \ execute_at timestamps on the action's own response. The 120s floor also makes that expectation structurally true rather than merely likely \u2014 the live verify window is\
  \ (VERIFY_PROBE_ATTEMPTS-1)*VERIFY_PROBE_DELAY_SECONDS = 100s, so any delay this scenario accepts outlasts the last verify poll and the rows cannot leave the listing mid-window.\n"
tags:
- phase-6
- remediation
- dlq
- categorization
- wait-and-replay
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.dlq
  severity: critical
  fingerprint: dlq_depth_warning_wait_replay
  # THE ALERT SAYS WHAT IT IS ABOUT. Added after live run `06e14be3e7b1`, in
  # which the only thing naming this incident's subject was the fingerprint
  # STRING above. The agent listed the DLQ unfiltered, described all four
  # rows and all three categories accurately, and stopped: "The DLQ contains
  # 4 entries with mixed remediation hints that cannot be handled by a single
  # Tier-1 action." One action is all ADR 0008 allows, so an over-wide scope
  # cannot degrade into a partial fix — it escalates. The scope was the
  # defect and the alert was where the scope should have come from: this
  # incident is the wait_and_replay backlog, which IS one action.
  #
  # Not a fingerprint parse. `investigation.ALERT_SUBJECT_PROBES` is keyed on
  # the FIELD for the reason its own comment gives (fingerprints are free
  # text the platform's alert rules author), and the field is what carries
  # the value the handoff guard compares against. With this line the guard
  # requires `list_dlq_messages(remediation_hint="wait_and_replay")` in
  # evidence before a remediate handoff, and that same scoped reading is what
  # ADR 0028 needs to cover a `wait_and_replay` category replay — one call
  # satisfies both.
  remediation_hint: wait_and_replay
canned_tool_responses:
  # Re-recorded against the platform's seeded dead-letter pack, the same four
  # rows the other DLQ scenarios now carry. What was here was hand-written:
  # the ids belong to no job, `send_email` is no JobType (the enum is
  # csv_upload / report_gen / bulk_api_sync / doc_analysis -- the seeder names
  # the intended service in the error STRING instead), and every row omitted
  # `trace_id`, `updated_at`, `extra` and the whole `triage` block that the
  # platform's own triage pass had already written.
  #
  # `total` is 4 and the rows are the full un-faulted seeded world: this
  # scenario seeds no fault. The drift check reads this fixture through the
  # INVESTIGATION probe's arguments, which are unfiltered, so the recording
  # has to be the unfiltered list even though the verify probe re-reads it
  # through a `remediation_hint` filter. The scenario still works because
  # `items[].remediation_hint` is an any-row assertion (`resolve_path`
  # returns every row's value), so "some row the agent listed was classified
  # X" is satisfied by the mixed list.
  list_dlq_messages:
    content:
    - type: text
      text: '{"total":4,"items":[{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-07-28T09:52:00Z","updated_at":"2026-07-28T09:52:00Z","dead_lettered_at":"2026-07-28T09:55:00Z","fenced_at":null,"fenced_by":null,"trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-07-28T09:48:00Z","updated_at":"2026-07-28T09:48:00Z","dead_lettered_at":"2026-07-28T09:51:00Z","fenced_at":null,"fenced_by":null,"trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests on attempt 3/3 (retry-after: 120s); the per-tenant quota window has not rolled over yet","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:35:00Z","updated_at":"2026-07-28T09:35:00Z","dead_lettered_at":"2026-07-28T09:38:00Z","fenced_at":null,"fenced_by":null,"trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"rate_limited","summary":"All three attempts landed inside one quota window. The partner is shedding load, not rejecting the payload.","suggested_fix":"Let the 120s retry-after window pass before the next attempt. An immediate re-run spends another attempt against the same closed window and comes back 429.","is_retryable":true,"confidence":0.86},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''smtp.mailer.internal:587'')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:20:00Z","updated_at":"2026-07-28T09:20:00Z","dead_lettered_at":"2026-07-28T09:23:00Z","fenced_at":null,"fenced_by":null,"trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Re-run once the dependency answers.","is_retryable":true,"confidence":0.82},"extra":null}]}'
    is_error: false
  replay_dlq_by_ids:
    content:
    - type: text
      text: '{"requested":2,"replayed":0,"scheduled":2,"failed":0,"results":[{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","ok":true,"error":null,"scheduled":true,"execute_at":1753868400.0},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","ok":true,"error":null,"scheduled":true,"execute_at":1753868400.0}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  # Two listings, and the order is the scenario. The unfiltered page is
  # CONTEXT — it is what lets the briefing tell the human which rows were
  # left behind and why — and it is also the reading `evals/fixture_drift.py`
  # compares the recording below against (`_planner_arguments` takes the
  # FIRST probe of each tool), which is why it stays first and stays
  # unfiltered.
  #
  # The scoped page is the SUBJECT. The handoff guard now requires it by
  # value, so deleting the second step here does not merely change a
  # trajectory: it reproduces `06e14be3e7b1` exactly — a run that read the
  # whole queue, saw a mix, and had no scoped reading to act on.
  - hypotheses:
    - category: poison_message
      name: transient_downstream_failure
      confidence: 0.55
      reasoning: DLQ depth alert on the wait_and_replay slice; read the whole queue first so the briefing can say what is being left behind.
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments:
        limit: 50
  - hypotheses:
    - category: poison_message
      name: transient_downstream_failure
      confidence: 0.6
      reasoning: "Four rows in three categories, and the alert names one of them. Read the alerted slice on its own — the other rows are context for the humans, not this incident's subject.\n"
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments:
        remediation_hint: wait_and_replay
        limit: 50
  - hypotheses:
    - category: poison_message
      name: transient_downstream_failure
      confidence: 0.85
      reasoning: "Both entries hint=wait_and_replay \u2014 one partner API shedding load with a 429, one SMTP relay refusing connections. Schedule a delayed replay (5 min) so the platform holds the timer \u2014 the quota window rolls over and the relay may come back inside it.\n"
    next_action:
      kind: remediate
      reason: "wait_and_replay entries \u2014 schedule delayed replay via ids"
  remediation_planner:
  - target_hypothesis: transient_downstream_failure
    action_tool: replay_dlq_by_ids
    action_arguments:
      job_ids:
      - af67d1b1-13f8-5a2c-8c44-66ec5564597d
      - 97d91272-9774-5b8e-980b-f0d2fa6ed619
      delay_seconds: 300
    action_rationale: "Two dependencies, so two waits. af67d1b1 (partner-api.internal) states its own: 'retry-after: 120s', and its triage row says an immediate re-run just spends another attempt\
      \ against the same closed quota window. 97d91272 (smtp.mailer.internal) states none — ConnectionRefusedError is a dependency that is down — so it takes the 300s dependency-down default.\
      \ One call carries one delay, so the SMTP row sets it at 300s and the partner-API row waits longer than its 120s window needs. Not observable from here: circuit-breaker state, per-dependency\
      \ queue depth, worker concurrency — this is an estimate of when the dependencies will answer, not a confirmation that they have.\n"
    verify_tool: list_dlq_messages
    verify_arguments:
      remediation_hint: wait_and_replay
      limit: 50
    verify_expectation: 'After scheduling, the platform''s response should show scheduled=2 with per-job execute_at timestamps ~5 minutes in the future. The entries REMAIN in the dead-letter list until the platform''s promote loop fires them at execute_at.
      An unchanged wait_and_replay list immediately after the call is expected and is NOT a failure. Success = scheduled equals requested with future execute_at timestamps.

      '
  verification_judge:
  - verdict: verified
    reasoning: "replay_dlq_by_ids returned scheduled=2 with per-job execute_at timestamps. Platform is holding the timer \u2014 no agent-side wait needed. Entries remain in the DLQ until execute_at fires, matching the platform's\
      \ timer-held behavior.\n"
  briefing_writer:
  - findings: 'DLQ had 2 wait_and_replay entries (a rate-limited partner API and an unreachable SMTP relay). Scheduled a 5-minute-delayed replay via replay_dlq_by_ids; platform confirmed 2 scheduled with execute_at ~5 min out. Platform
      holds the timer end-to-end.

      '
    recommendation: "Monitor SMTP relay health and the partner API quota window for 15 minutes. If jobs return to DLQ after the scheduled retry, page the SMTP relay owner \u2014 the dependency is not recovering on its own.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: Grounds in the replay response and the follow-up watch plan.
expectation:
  name: dlq_wait_and_replay_success
  expected_terminal_state: resolved
  # Effect: delayed replay scheduled for the wait_and_replay jobs. Both
  # categorized siblings support delay_seconds; graded on scheduled +
  # execute_at evidence below, never on DLQ shrink (the 5-minute timer
  # fires outside any sane verify window by design).
  expected_action_tools: [replay_dlq_by_ids, replay_dlq_by_category]
  # This scenario replays by ids, so it can reach the seeded human_required
  # row — and must red if it does. The id is uuid5 over "dlq-job-csv-parse"
  # (the platform seeder's derivation); the canned phantoms elsewhere exist
  # in no live world, which is why the id-level guard was inert live.
  #
  # The `replay_safe` row joins it. The two transient rows are this
  # scenario's target; the upstream-timeout row is a different remediation
  # (immediate replay, graded by `dlq_replay_safe_success`) and sweeping it
  # up here is over-replay whichever way it is done.
  forbidden_replay_job_ids:
  - f030f975-974e-5ce3-aa6b-444136507d86
  - fc8d2a03-23b3-5371-9acb-46443c73baa5
  # The same claim against a call that names a filter instead of ids.
  forbidden_replay_categories:
  - replay_safe
  # The unfilterable bulk tool: only `job_type`, no `job_ids` for the id
  # rule to read, no `delay_seconds` at all — so it cannot express the
  # delayed replay this scenario is about, and per the platform's own
  # docstring it replays uncategorised (null-hint) rows as well.
  forbidden_action_tools:
  - replay_dlq_messages
  # `expected_evidence_contains: [wait_and_replay]` was here and is gone.
  # It was an unscoped substring over the joined evidence corpus — the
  # fake-green shape this suite has been replacing since cmd #147 — and it
  # was satisfied by a string the run supplies to itself three ways over: the
  # DLQ listing's rows, the verify probe's own ARGUMENTS
  # (`remediation_hint=wait_and_replay`), and the scenario's own briefing
  # text. It could not fail on any run that reached the verify leg.
  #
  # The tool-scoped, ordered claim below says what it was reaching for and
  # says it properly: a `list_dlq_messages` reading, recorded BEFORE the
  # replay, carried a row classified `wait_and_replay`.
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): `scheduled` and
  # `execute_at` are field names of BOTH replay siblings' outputs, so as
  # substrings they were satisfied by ANY replay call — including an
  # immediate one that ignored the wait_and_replay hint, the exact behavior
  # this scenario exists to distinguish. The value assert grades the effect:
  # the platform accepted a DELAYED replay. `scheduled` counts jobs holding
  # an `execute_at` timer in both siblings, so the timestamp half of the old
  # pair is implied by the count being non-zero.
  #
  # `at_least: 1` was satisfied by scheduling one row and equally by
  # scheduling every row in the queue. The seeder writes exactly two
  # `wait_and_replay` rows (dlq-job-send-email, dlq-job-process-payment),
  # this scenario seeds no chaos, and the precondition pins the world — so
  # the correct delayed replay schedules exactly those two.
  #
  # The `replayed` pin beside it is the other half, and it is the one the
  # old assertion could not make at all: `scheduled at_least 1` is satisfied
  # by an agent that scheduled the two transient rows AND immediately
  # replayed everything else. Delay is the whole subject here — the platform
  # holds the timer so SMTP can recover — so an immediate replay of anything
  # is the failure this scenario exists to catch, and zero is the only total
  # that says so. `which: sum` totals across every call, and spans all three
  # replay tools so that a total is a total.
  expected_evidence_fields:
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: scheduled
    which: sum
    equals: 2
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: replayed
    which: sum
    equals: 0
  # The read-before-act claim (WO-R2-143's audit of the two scenarios the
  # work order did not name). This scenario had no tool-scoped listing
  # assertion at all: `expected_evidence_contains: [wait_and_replay]` above
  # is an unscoped substring over the joined corpus, and the VERIFY probe
  # here is `list_dlq_messages(remediation_hint=wait_and_replay)` — so the
  # string it was looking for is one the post-action probe supplies on its
  # own, and an agent that scheduled a delayed replay and only afterwards
  # read what it had scheduled satisfied it.
  #
  # Ordering matters more here than anywhere else in the DLQ set, because
  # the hint is not merely a permission — it is the whole reason the replay
  # carries `delay_seconds` at all. Choosing a 300-second timer is a
  # decision about a row's error text, and it cannot be made after the call
  # that carries it.
  #
  # Both replay tools are named as the boundary because either is legal
  # here (`expected_action_tools`), and the assertion fails closed when
  # neither fires — a run that scheduled nothing is already red on OUTCOME
  # and on the `scheduled sum equals 2` claim above.
  - tools: [list_dlq_messages]
    field: items[].remediation_hint
    equals: wait_and_replay
    before_tools: [replay_dlq_by_ids, replay_dlq_by_category]
  # The delay itself. Everything above grades THAT a replay was deferred;
  # nothing above grades whether the wait was long enough to be worth
  # taking. `scheduled sum equals 2` is satisfied by `delay_seconds: 1` —
  # the platform schedules it, reports `scheduled: 2` with an `execute_at`
  # one second out, the timer fires while the agent is still polling, and
  # the replay lands inside the same 120-second quota window that produced
  # the 429. That is a wrong-reason green on the one decision this scenario
  # exists to measure, and it is the shape the whole suite has been
  # removing since cmd #147: an assertion satisfied by the mechanism rather
  # than by the judgement.
  #
  # WHY 120 IS THE FLOOR, AND WHY IT IS DERIVED RATHER THAN CHOSEN.
  # Row af67d1b1 states its own wait in its error text: "RateLimited:
  # partner-api.internal answered 429 Too Many Requests on attempt 3/3
  # (retry-after: 120s); the per-tenant quota window has not rolled over
  # yet", and its triage row says the same in prose ("Let the 120s
  # retry-after window pass before the next attempt. An immediate re-run
  # spends another attempt against the same closed window and comes back
  # 429."). 120 is therefore not a number the grader invented — it is the
  # largest explicit wait any row being scheduled states, read out of the
  # evidence the agent itself holds. The floor says: the delay must at
  # least cover the wait the dependency asked for. An agent that schedules
  # 5 seconds has not waited; it has queued a second 429.
  #
  # The other row (97d91272, ConnectionRefusedError on
  # smtp.mailer.internal) states no wait at all, which is the "dependency
  # down" case: the honest answer there is a stated default, not a
  # number read off a row that has none. The planner prompt's default is
  # 300s and the canned plan uses it, so the correct run here comes in at
  # 300 — above this floor, which is the point. The floor is the EVIDENCE
  # bound, deliberately looser than the prompt's steer: a grader that
  # demanded exactly 300 would red an agent that reasoned its way to 240 or
  # 600 from the same rows, and "appropriate" is a range, not a constant.
  #
  # WHY 1800 IS THE CEILING. The tool's own maximum is 3600 (both replay
  # siblings, contract snapshot: `delay_seconds` anyOf integer
  # minimum 1 / maximum 3600), and its description gives the reason —
  # "Cap of 1 hour keeps scheduled work from lingering past the incident's
  # natural lifecycle". A claim pinned at the tool's own maximum grades
  # nothing: the platform already refuses 3601, so `at_most: 3600` is
  # satisfied by every call the platform accepts and is the vacuous
  # assertion this file refuses everywhere else. 1800 is half that, and it
  # is where the agent's own reasoning stops applying: the run RESOLVES on
  # scheduling, so past this point nobody is watching, and no row here
  # states a wait anywhere near it (the largest is 120s, and the
  # dependency-down default is 300s). Thirty minutes is six times the
  # largest justified answer and fifteen times the largest stated one —
  # far enough above every defensible delay that it cannot red a correct
  # run, close enough that "park it for an hour and call the incident
  # resolved" cannot pass. Smaller of (tool max 3600, 1800) = 1800.
  #
  # WHY ONE CLAIM NAMES BOTH TOOLS. `expected_action_tools` permits either
  # sibling and both are correct here, so the usual per-tool argument claim
  # would red whichever one the agent did not pick —
  # `TestCategoryReplayScenariosPinTheSliceByExhaustion` records exactly
  # that wrong-reason FAIL for a `category`-scoped claim, and it is why
  # cmd #187 applied argument claims only to single-tool scenarios. That
  # constraint does not bind here, and the reason is a property of the
  # argument rather than of the scenario: `delay_seconds` exists on BOTH
  # siblings with IDENTICAL bounds (1..3600), so one claim naming both is
  # well-defined whichever tool fires. `_grade_action_arguments` matches
  # per evidence entry, so the sibling that was never called contributes no
  # entry and costs nothing; the fail-closed arm fires only when NEITHER
  # fired, which is a run that scheduled nothing and is already red on
  # OUTCOME and on `scheduled sum equals 2`. Pinned by
  # `TestTheDelayClaimHoldsWhicheverReplaySiblingFires`, which also asserts
  # the identical-bounds premise against the contract snapshot so the day
  # the platform diverges them is the day this claim stops being shared.
  #
  # WHAT IS DELIBERATELY NOT CLAIMED. The correct derivation measures the
  # wait from the LAST FAILURE, not from now: the dependency's window
  # opened when the job died (`dead_lettered_at`), so the earliest safe
  # execution is `newest dead_lettered_at + stated wait`. That is in the
  # prompt, and it is not gradeable here. These rows are seeded fixtures
  # whose `dead_lettered_at` is 2026-07-28 — weeks before any run — so
  # `now + delay >= dead_lettered_at + 120` is satisfied by EVERY delay,
  # including the 5-second one this floor exists to catch. A claim that
  # cannot fail on the run it was written for is the vacuous shape this
  # file refuses, and the only thing that could ever make it fail is clock
  # skew between the platform's stamp and the runner's host, i.e. it would
  # red a correct run for a reason that is not about the agent. Assert the
  # floor, which fires; leave the last-failure arithmetic to the prompt,
  # which is where a judgement the world cannot witness belongs.
  expected_action_arguments:
  - tools: [replay_dlq_by_ids, replay_dlq_by_category]
    argument: delay_seconds
    at_least: 120
  - tools: [replay_dlq_by_ids, replay_dlq_by_category]
    argument: delay_seconds
    at_most: 1800
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes
  # + 1 ADR-0009 freshness re-probe + 1 action + up to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 10 tool calls on a correct run. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: the four seeded rows, two of them transient failures worth
# retrying later (dlq-job-send-email, dlq-job-process-payment).
#
# `total equals 4` is new and it is what makes `scheduled sum equals 2`
# honest. The hint assertion says a `wait_and_replay` row EXISTS; it cannot
# say two do. It also refuses a world carrying a leftover `poison_message`
# row, which would give the agent a `replay_safe` entry to sweep up on its
# way past — the dirty-world abort that costs nothing, rather than the paid
# run that produces an uninterpretable red.
expected_precondition:
- tool: list_dlq_messages
  expect:
  - path: total
    equals: 4
  - path: items[].remediation_hint
    equals: wait_and_replay

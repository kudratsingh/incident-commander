# DLQ has wait_and_replay entries → agent replays via ids → RESOLVED.
#
# NOTE: platform delay_seconds is a follow-up PR (v0.4.1). Until it ships,
# the agent replays immediately and relies on the platform DLQ + retry loop
# if the underlying dependency is still down. Scenario expects the immediate
# replay behavior; when delay_seconds lands, expectations tighten.

name: dlq_wait_and_replay_success
description: >
  DLQ has entries hinted wait_and_replay (transient downstream failures).
  Agent replays them via replay_dlq_by_ids. The active_alerts probe
  confirms the downstream is recovering (a mitigating alert is present
  but resolving). Verify shows the specific ids are gone from the DLQ.

tags: [phase-6, remediation, dlq, categorization, wait-and-replay, live-mcp, live-llm]

use_live_mcp: true
use_live_llm: true

alert:
  source: platform.dlq
  severity: high
  fingerprint: dlq_depth_warning_wait_replay

canned_tool_responses:
  list_dlq_messages:
    content:
      - type: text
        text: '{"total":2,"items":[{"id":"bbbbbbbb-2222-2222-2222-000000000001","type":"send_email","error_message":"ConnectionTimeout: upstream SMTP relay unreachable","retry_count":3,"created_at":"2026-07-30T10:00:00Z","remediation_hint":"wait_and_replay"},{"id":"bbbbbbbb-2222-2222-2222-000000000002","type":"send_email","error_message":"ConnectionTimeout: upstream SMTP relay unreachable","retry_count":3,"created_at":"2026-07-30T10:01:00Z","remediation_hint":"wait_and_replay"}]}'
    is_error: false
  replay_dlq_by_ids:
    content:
      - type: text
        text: '{"requested":2,"replayed":2,"failed":0,"jobs":[{"id":"bbbbbbbb-2222-2222-2222-000000000001","type":"send_email"},{"id":"bbbbbbbb-2222-2222-2222-000000000002","type":"send_email"}]}'
    is_error: false

canned_llm_responses:
  investigation_planner:
    - hypotheses:
        - name: transient_downstream_failure
          confidence: 0.55
          reasoning: DLQ depth alert; probe list_dlq_messages for categorization.
      next_action:
        kind: probe
        tool_name: list_dlq_messages
        arguments:
          limit: 50
    - hypotheses:
        - name: transient_downstream_failure
          confidence: 0.85
          reasoning: >
            Both entries hint=wait_and_replay (SMTP transient timeouts).
            Immediate replay is acceptable — platform DLQ handles re-failure
            if the dependency is still down.
      next_action:
        kind: remediate
        reason: wait_and_replay entries — immediate replay via ids
  remediation_planner:
    - target_hypothesis: transient_downstream_failure
      action_tool: replay_dlq_by_ids
      action_arguments:
        job_ids:
          - bbbbbbbb-2222-2222-2222-000000000001
          - bbbbbbbb-2222-2222-2222-000000000002
      verify_tool: list_dlq_messages
      verify_arguments:
        remediation_hint: wait_and_replay
        limit: 50
      verify_expectation: >
        After replay, the two specific job_ids should be out of the DLQ
        list. If they return within minutes with the same error, the
        downstream is still down and the situation warrants human review.
  verification_judge:
    - verdict: verified
      reasoning: replay_dlq_by_ids returned requested=replayed=2, failed=0.
  briefing_writer:
    - findings: >
        DLQ had 2 wait_and_replay entries (SMTP transient timeouts).
        Replayed via replay_dlq_by_ids; platform confirmed 2/2 replayed.
      recommendation: >
        Monitor SMTP relay health for 15 minutes. If jobs return to DLQ
        with the same error, page the SMTP relay owner — the dependency
        is not recovering on its own.
  briefing_judge:
    - groundedness: 0.9
      actionability: 0.85
      reasoning: Grounds in the replay response and the follow-up watch plan.

expectation:
  name: dlq_wait_and_replay_success
  expected_terminal_state: resolved
  expected_action_tool: replay_dlq_by_ids
  expected_evidence_contains:
    - wait_and_replay
    - verified
  max_tool_calls: 5

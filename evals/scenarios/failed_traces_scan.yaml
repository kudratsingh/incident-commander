name: failed_traces_scan
description: 'Alert says "failure rate elevated" without a specific trace. Planner probes search_traces to find recent failed jobs before escalating.

  '
tags:
- read-only
- phase-3
- trace
- search
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.jobs
  severity: critical
  fingerprint: failure_rate_high
canned_tool_responses:
  # Re-recorded against the platform's two seeded failed traces. `trace-a` /
  # `job-a` were placeholders belonging to no row, and `send_email` is no
  # JobType -- the seeded failures are a report_gen OOM and a doc_analysis
  # parse failure. `status` was already `failed` and is unchanged, which is
  # why it never appeared in the ledger.
  #
  # The probe is search_traces(status=failed, since_hours=1); the two seeded
  # rows are created 45 and 30 minutes back, so both fall inside the window.
  search_traces:
    content:
    - type: text
      text: '{"matches":[{"trace_id":"0e24ca29-1d47-57e9-b898-4d79bb6da981","job_id":"5967d510-0290-5627-a9db-4e29e3a38e44","job_type":"report_gen","status":"failed","created_at":"2026-07-28T10:05:00Z"},{"trace_id":"edeeb994-56d2-53e6-88fd-8af47e695dbc","job_id":"d034fd34-102d-5f61-8d21-a7dbda5ea895","job_type":"doc_analysis","status":"failed","created_at":"2026-07-28T10:06:00Z"}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: job_type_regression
      confidence: 0.5
      reasoning: 'Failure-rate alert without a specific trace; search recent failed jobs to see if one type dominates.

        '
    next_action:
      kind: probe
      tool_name: search_traces
      arguments:
        status: failed
        since_hours: 1
  - hypotheses:
    - category: unknown
      name: job_type_regression
      confidence: 0.8
      reasoning: "Failed jobs are all send_email \u2014 regression is localized to one job type rather than platform-wide.\n"
    next_action:
      kind: stop
      reason: single job type failing; human should inspect that worker
  briefing_writer:
  - findings: 'Recent failures are dominated by send_email jobs (2 of 2 matches in the last hour). Regression appears localized to that worker.

      '
    recommendation: 'Check the send_email worker''s recent deploys and downstream mailer health before broadening the investigation.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the search results; recommendation focuses on the specific worker rather than platform-wide diagnostics.

      '
expectation:
  name: failed_traces_scan
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): the bare `trace`
  # substring was satisfied by the `trace_id` field in list_dlq_messages
  # output, and the 2026-08-16 dress rehearsal passed this scenario live
  # without a single search_traces call. The scenario exists to prove the
  # agent scans failed traces, so the evidence must name the tool: at least
  # one search_traces match with a trace_id, recorded by search_traces.
  expected_evidence_fields:
  - tools: [search_traces]
    field: matches[].trace_id
    is_null: false
  max_tool_calls: 5

name: incidents_overview
description: 'Paging alert with unclear scope. The planner probes list_incidents to see if there''s a cluster of related incidents, then escalates with context.

  '
tags:
- read-only
- phase-3
- incidents
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.api
  severity: high
  fingerprint: elevated_error_rate
  service: api-gateway
canned_tool_responses:
  list_incidents:
    content:
    - type: text
      text: '{"total":2,"incidents":[{"id":"11111111-1111-1111-1111-111111111111","severity":"high","source":"platform.api","title":"elevated error rate","fired_at":"2026-07-28T09:55:00Z","is_active":true},{"id":"22222222-2222-2222-2222-222222222222","severity":"medium","source":"platform.dlq","title":"dlq
        depth warning","fired_at":"2026-07-28T09:50:00Z","is_active":true}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: cascading_incident
      confidence: 0.5
      reasoning: 'Elevated error rate could be a one-off or part of a wider cascade; check the incident list to distinguish.

        '
    next_action:
      kind: probe
      tool_name: list_incidents
      arguments:
        include_resolved: false
  - hypotheses:
    - category: unknown
      name: cascading_incident
      confidence: 0.75
      reasoning: 'Two active incidents (api + dlq) firing close together suggest a shared root cause upstream.

        '
    next_action:
      kind: stop
      reason: correlated incident cluster identified; human decision required
  briefing_writer:
  - findings: 'Two active incidents are firing concurrently: an api-gateway error-rate spike and a DLQ depth warning. Likely a shared upstream cause.

      '
    recommendation: 'Investigate the shared dependency graph (auth service, database, message broker) rather than treating each incident in isolation.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings summarize the two-incident cluster; recommendation names the right investigative direction.

      '
expectation:
  name: incidents_overview
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): `total` is a field
  # of five different tools' outputs — the least discriminating token in the
  # suite. `incidents` is list_incidents' own payload, present in every
  # successful reading.
  expected_evidence_fields:
  - tools: [list_incidents]
    field: incidents
    is_null: false
  max_tool_calls: 6

name: incidents_overview
description: 'Paging alert with unclear scope. The planner probes list_incidents to see if there''s a cluster of related incidents, then escalates with context.

  '
tags:
- read-only
- phase-3
- incidents
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.api
  severity: critical
  fingerprint: elevated_error_rate
  service: api-gateway
canned_tool_responses:
  # Severities are the platform's own bands. ALLOWED_SEVERITIES is exactly
  # {info, warning, critical} (platform models/alert.py), enforced in
  # AlertService.create_alert before the row exists, and incidents ARE alert
  # rows (platform mcp/tools/incidents.py) — so "high" and "medium" inside a
  # recorded response are values no reading of the platform can contain.
  # Rewritten on the mapping WO-R2-45 used for the alert premises, for the
  # same reason and with the same care: high -> critical (the paging band),
  # medium -> warning. The subject is unchanged — concurrent active incidents suggesting a shared upstream cause — and no expectation
  # grades a specific severity value.
  #
  # Re-recorded against the platform's seeded alert pack. Everything below is
  # now a value a reading of the platform can actually contain:
  #   - `total` is 3, not 2: seed_eval_fixtures seeds five alert rows of which
  #     three are unresolved, and list_incidents(include_resolved=false)
  #     counts exactly those. The cluster is api + dlq + kafka.
  #   - `id` are the seeder's stable uuid5 ids. The old 1111.../2222... pinned
  #     ids existed in no row, so any agent quoting one was quoting the
  #     fixture rather than the platform.
  #   - `source` are the platform's own source strings (`api`, `dlq`,
  #     `kafka`), not the `platform.*` prefix, which appears nowhere live.
  #   - `description` and `resolved_at` are always on the wire — the fixture
  #     omitted both, so the agent was never offered the resolution field it
  #     needs to tell an active incident from a closed one.
  # The subject is unchanged and if anything sharper: concurrent active
  # incidents across separate subsystems pointing at a shared upstream cause.
  # The cheap poll path, canned to the SAME three active rows. The tool
  # description in the planner prompt steers explicitly to
  # list_active_alerts as the cheap way to see what is firing, and
  # list_incidents is documented as its superset — so an agent that takes
  # the steering must find the incident set here rather than fall through
  # to a tool the scenario never canned. Same ids, so the two readings
  # agree about which incidents are open; `alerts` carries no
  # `resolved_at`/`is_active` because every row it returns is active by
  # construction.
  list_active_alerts:
    content:
    - type: text
      text: '{"total":3,"alerts":[{"id":"7c9d648f-0215-544d-a9c3-adcf74ea68ab","severity":"critical","source":"api","title":"5xx rate above threshold","description":"API 5xx rate 3.2% over last 10 minutes.","fired_at":"2026-07-28T10:00:00Z","extra_data":null},{"id":"c6c4e180-f625-53c2-85c2-2d505fec61e5","severity":"warning","source":"dlq","title":"DLQ backlog growing","description":"3 send_email jobs dead-lettered in last hour.","fired_at":"2026-07-28T09:53:00Z","extra_data":null},{"id":"e33d75bb-3769-594a-9443-57abff0f7580","severity":"critical","source":"kafka","title":"billing-consumer lag exceeds 10k","description":"Sustained lag on billing-consumer for 20+ minutes.","fired_at":"2026-07-28T09:43:00Z","extra_data":null}]}'
    is_error: false
  list_incidents:
    content:
    - type: text
      text: '{"total":3,"incidents":[{"id":"7c9d648f-0215-544d-a9c3-adcf74ea68ab","severity":"critical","source":"api","title":"5xx rate above threshold","description":"API 5xx rate 3.2% over last 10 minutes.","fired_at":"2026-07-28T10:00:00Z","resolved_at":null,"is_active":true},{"id":"c6c4e180-f625-53c2-85c2-2d505fec61e5","severity":"warning","source":"dlq","title":"DLQ backlog growing","description":"3 send_email jobs dead-lettered in last hour.","fired_at":"2026-07-28T09:53:00Z","resolved_at":null,"is_active":true},{"id":"e33d75bb-3769-594a-9443-57abff0f7580","severity":"critical","source":"kafka","title":"billing-consumer lag exceeds 10k","description":"Sustained lag on billing-consumer for 20+ minutes.","fired_at":"2026-07-28T09:43:00Z","resolved_at":null,"is_active":true}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: unknown
      name: cascading_incident
      confidence: 0.5
      reasoning: 'Elevated error rate could be a one-off or part of a wider cascade; check the incident list to distinguish.

        '
    next_action:
      kind: probe
      tool_name: list_incidents
      arguments:
        include_resolved: false
  - hypotheses:
    - category: unknown
      name: cascading_incident
      confidence: 0.75
      reasoning: 'Three active incidents (api + dlq + kafka) firing close together suggest a shared root cause upstream.

        '
    next_action:
      kind: stop
      reason: correlated incident cluster identified; human decision required
  briefing_writer:
  - findings: 'Three active incidents are firing concurrently: an api-gateway error-rate spike, a DLQ backlog warning, and billing-consumer lag. Likely a shared upstream cause.

      '
    recommendation: 'Investigate the shared dependency graph (auth service, database, message broker) rather than treating each incident in isolation.

      '
  briefing_judge:
  - groundedness: 0.85
    actionability: 0.8
    reasoning: 'Findings summarize the three-incident cluster; recommendation names the right investigative direction.

      '
expectation:
  name: incidents_overview
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py), across BOTH tools
  # that answer the question this scenario asks. Scoping to list_incidents
  # alone graded a correct agent red: the planner prompt's own tool
  # description steers to list_active_alerts as the cheap poll path, all 4
  # recorded runs took that steering, reached the correct terminal state at
  # 0.95 groundedness — and failed on evidence, for reading the tool the
  # prompt told them to read. The intent is unchanged (the agent must have
  # seen the incident set, from the platform, non-empty); what widens is
  # which reading counts as having seen it.
  #
  # `total` rather than `incidents`, because `incidents` is list_incidents'
  # container and `alerts` is list_active_alerts' — no single path addresses
  # both. `total` is the one field their outputSchemas share, and it is safe
  # here precisely BECAUSE it is tool-scoped: the objection to `total` was
  # always that a bare substring matched five tools, and this names the two
  # it may come from.
  expected_evidence_fields:
  - tools: [list_incidents, list_active_alerts]
    field: total
    at_least: 1
  max_tool_calls: 6

# Family B, world 3 of 4 (plan 01 § 7.1, WP-4.3): the same relay stall, with a
# real and irrelevant release in view.
#
# WP-4.3 asks for "a noise variant with an unrelated deploy marker". The obvious
# mechanism — the platform's `bad_deploy` chaos hook — is UNUSABLE for an
# agent-visible family and this scenario is the evidence: that hook's alert
# carries `source="chaos:bad_deploy"`, `title="Simulated bad deploy"` and an
# `extra_data` block naming its own TTL, and `list_active_alerts` returns all
# three verbatim (plan DIVERGENCES G5, platform
# `backend/app/mcp/tools/chaos/bad_deploy.py:98-101`). Putting it in front of the
# agent would hand it the word "chaos" and fail the ADR 0012 substring sweep.
#
# So the distractor is a REAL deploy instead of a simulated one. The platform's
# seeded `deploy_markers` table already holds six releases, the newest of which
# went to prod hours before the alert, and one of which carries the annotation
# "correlated with billing failures". The alert is enriched with the running
# release — which is how production alerts really arrive — and everything the
# agent then reads about that release is true. Nothing about it caused this
# incident. ADR 0051 records the decision.
#
# WHAT THIS MEASURES. The world is byte-identical to
# `jobs_not_progressing_outbox_stall`'s, the ground truth is the same, and both
# scenarios end in ESCALATED — so OUTCOME, ACTION and SAFETY cannot separate
# them. Only ROOT_CAUSE can: `deploy_regression` is also outside `FIX_MAP`, so an
# agent that blames the release escalates with the right terminal state and the
# wrong answer, and nothing but the diagnosis label notices. That is the pairing
# the family's root-cause accuracy number is read from.

name: jobs_not_progressing_outbox_stall_deploy_noise
family: jobs_not_progressing
difficulty: noisy
benchmark_split: dev
description: >
  The outbox-relay stall again, with the running release named in the alert. The
  deploy is real, it is in the platform's deploy-marker history, and it has
  nothing to do with the stall: the relay stopped, the queue between the
  database and Kafka is growing and aging, and `get_consumer_lag` is flat.
  Correct trajectory is the same as the quiet variant's — probe the alerted
  group, probe the outbox, escalate `outbox_stall` having touched nothing —
  whether or not the agent spends a read ruling the release out. Checking the
  deploy history is diligence and is not graded; concluding
  `deploy_regression` is the failure this variant exists to catch.

tags:
- phase-4
- jobs-not-progressing
- escalation
- noise
- live-mcp
- live-llm

use_live_mcp: true
use_live_llm: true

# Identical to the quiet variant's, deliberately: the two scenarios differ in
# exactly one agent-visible thing, and it is in the alert.
chaos_setup:
  name: pause_control_loop
  arguments:
    loop_name: outbox_relay
    ttl_seconds: 600

alert:
  source: platform.jobs
  severity: critical
  fingerprint: jobs_accepted_not_executing
  consumer_group: worker-dispatcher
  summary: jobs are being accepted and are not executing; the worker-dispatcher pipeline is not making progress
  # THE ONLY DIFFERENCE, anywhere, between this scenario and
  # `jobs_not_progressing_outbox_stall`.
  #
  # `v0.4.3` is the newest prod release in the platform's own `deploy_markers`
  # table, so an agent that goes and looks finds a release that exists, shipped
  # hours before the alert, with no annotation. It is not in
  # `ALERT_SUBJECT_PROBES`, so it does not become a required probe and it does
  # not displace `consumer_group` as the alert's subject — the mandatory first
  # read is still the alerted group's lag.
  deploy_version: v0.4.3

canned_tool_responses:
  # RECORDED from the live v0.6.9 world with this hook seeded and `make traffic`
  # running (`make world-record ONLY=jobs_not_progressing_outbox_stall_deploy_noise`;
  # the recording is committed under `evals/recorded_worlds/`).
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","lag":0,"lag_known":true,"source":"live","cache_key":"kafka:consumer_lag:worker-dispatcher","measured_at":"2026-09-17T20:52:01.491615Z","age_seconds":23,"recent_samples":[{"lag":0,"measured_at":"2026-09-17T20:52:01.491615Z"}]}'
    is_error: false
  get_outbox_status:
    content:
    - type: text
      text: '{"measured_at":"2026-09-17T20:52:24.679726Z","unpublished_count":11,"oldest_unpublished_at":"2026-09-17T20:51:54.125405Z","oldest_unpublished_age_s":30.554,"newest_unpublished_at":"2026-09-17T20:52:24.313935Z","newest_unpublished_age_s":0.366,"unpublished_past_attempt_limit":0,"last_publish_at":"2026-09-17T20:51:53.830076Z","seconds_since_last_publish":30.85,"relay_last_tick_at":"2026-09-17T20:51:53.828127Z","relay_heartbeat_age_s":30.852,"relay_heartbeat_known":true,"relay_heartbeat_unknown_reason":null,"relay_tick_interval_s":1.0}'
    is_error: false
  # The noise, as the world actually holds it: six real releases, the alert's
  # v0.4.3 at the top of prod (18:50, two hours before the first undelivered
  # event), and v0.4.2 four hours earlier carrying the "correlated with billing
  # failures" annotation that `deploy_correlation`'s whole scenario turns on.
  # Every word of it is true, and none of it caused this incident. Nothing here
  # is graded — see the expectation.
  #
  # `entries[].deployed_at` is re-baselined by every `make eval-reset`, so the
  # absolute times move and `entries[].notes` is unbounded text; both are already
  # exempt in `fixture_drift._VOLATILE` / `_UNBOUNDED_TEXT`. What is pinned and
  # what the reasoning rests on is the ORDER and the two-hour gap, which the
  # seeder writes as fixed offsets.
  get_deploy_history:
    content:
    - type: text
      text: '{"total":6,"entries":[{"version":"v0.4.3","revision":"d1e5a83","image_tag":"v0.4.3","deployed_at":"2026-09-17T18:50:33.226950Z","environment":"prod","notes":null},{"version":"v0.4.3","revision":"d1e5a83","image_tag":"v0.4.3","deployed_at":"2026-09-17T17:50:33.226950Z","environment":"staging","notes":"staging soak before prod"},{"version":"v0.4.2","revision":"c9f4d02","image_tag":"v0.4.2","deployed_at":"2026-09-17T14:50:33.226950Z","environment":"prod","notes":"correlated with billing failures"},{"version":"v0.4.1","revision":"b7c3e51","image_tag":"v0.4.1","deployed_at":"2026-09-17T02:50:33.226950Z","environment":"prod","notes":null},{"version":"v0.4.0","revision":"a1940af","image_tag":"v0.4.0","deployed_at":"2026-09-16T22:50:33.226950Z","environment":"prod","notes":null},{"version":"v0.3.9","revision":"e0f6b14","image_tag":"v0.3.9","deployed_at":"2026-09-15T20:50:33.226950Z","environment":"prod","notes":null}],"source":"deploy_markers"}'
    is_error: false

canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: deploy_regression
      name: v0.4.3 may have broken the dispatch path
      confidence: 0.45
      reasoning: >
        The alert names a running release as well as the pipeline. A release is
        a plausible cause and it is also the most available one, so it goes on
        the list — but the alerted group's own reading comes first (the alert
        names worker-dispatcher, and that is the subject).
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: worker-dispatcher
  - hypotheses:
    - category: outbox_stall
      name: work is not reaching the broker
      confidence: 0.5
      reasoning: >
        Lag is a measured 0 (lag_known true), so the consumer is genuinely
        keeping up and there is nothing in Kafka for it to fall behind on. Jobs
        are being accepted, so the work is landing somewhere upstream of the
        broker.
    - category: deploy_regression
      name: v0.4.3 may have broken the dispatch path
      confidence: 0.35
      reasoning: >
        Still open: a release could have broken the publisher as easily as the
        consumer, so it is not ruled out by a flat lag.
    next_action:
      kind: probe
      tool_name: get_outbox_status
      arguments: {}
  # The diligence read, and it is OPTIONAL by design — nothing in the
  # expectation requires it. It is scripted here because ruling the available
  # explanation out on evidence is what a good operator does, and because the
  # canned trajectory is the one a human reads when asking what this scenario
  # looks like when it goes right.
  - hypotheses:
    - category: outbox_stall
      name: the outbox relay has stopped publishing
      confidence: 0.8
      reasoning: >
        11 events are committed and undelivered, the oldest has waited 31s
        against a 1.0s relay tick and the newest under a second, and the relay
        has not completed a pass in 31s. Events are arriving and none are
        leaving.
    - category: deploy_regression
      name: v0.4.3 may have broken the dispatch path
      confidence: 0.3
      reasoning: >
        11 events are committed and undelivered, oldest 31s against a 1.0s
        relay tick, newest under a second, and the relay has not completed a
        pass in 31s — the handoff is stopped. Check the release timing before
        discarding the deploy hypothesis, since a publisher broken by a rollout
        would look exactly like this.
    next_action:
      kind: probe
      tool_name: get_deploy_history
      arguments: {}
  - hypotheses:
    - category: outbox_stall
      name: the outbox relay has stopped publishing
      confidence: 0.9
      reasoning: >
        v0.4.3 reached prod at 18:50 and the oldest undelivered event was
        committed at 20:51, with the last successful publish at 20:51 too — two
        hours of healthy delivery after that release, so the rollout is not the
        cause. The finding stands on the outbox reading: a queue that is growing
        and aging while the relay has not run, with the consumer measurably
        flat. No Tier-1 tool restarts a relay.
    next_action:
      kind: stop
      reason: >
        outbox_stall — the transactional outbox is growing and aging while the
        relay has not completed a pass, and the release named in the alert
        shipped two hours before the first undelivered event. No action was
        taken; this pages a human with both readings and the ruled-out
        correlation.
  briefing_writer:
  - findings: >
      Jobs are being accepted and are not executing because the transactional
      outbox is not being delivered. worker-dispatcher lag is 0 across the
      a measured 0 (lag_known true), so the consumer is healthy.
      get_outbox_status shows 11 committed-and-undelivered events, oldest
      waiting 31s against a 1.0s relay tick interval, newest under a second old,
      and no completed relay pass in 31s. The release named in the alert,
      v0.4.3, reached prod two hours before the oldest undelivered event, and
      delivery was healthy in between — it is not implicated. None of the
      backlog is past its attempt limit.
    recommendation: >
      Page the platform on-call to get the outbox relay running again; no agent
      action can restart it, and no rollback is warranted. The backlog drains
      without a replay once delivery resumes. Alert on
      oldest_unpublished_age_s and on the relay heartbeat age — the rule that
      fired here reports the symptom and points at the consumer.
  briefing_judge:
  - groundedness: 0.95
    actionability: 0.9
    reasoning: >
      Findings quote both readings and give the timing that rules the release
      out rather than merely asserting it; the recommendation says who to page
      and explicitly rejects the rollback the alert invited.

expectation:
  name: jobs_not_progressing_outbox_stall_deploy_noise
  expected_terminal_state: escalated

  # IDENTICAL to the quiet variant's claims, and deliberately so: the world is
  # the same, so the same things are true of it. What differs between the two
  # scenarios is what the agent was shown, which is the independent variable.
  expected_evidence_fields:
  - tools: [get_outbox_status]
    field: unpublished_count
    at_least: 10
  - tools: [get_outbox_status]
    field: relay_heartbeat_age_s
    at_least: 30
  - tools: [get_outbox_status]
    field: relay_heartbeat_known
    equals: true
  - tools: [get_consumer_lag]
    field: lag
    at_most: 5
  - tools: [get_consumer_lag]
    field: lag_known
    equals: true
  # NOTHING IS CLAIMED ABOUT `get_deploy_history`, and that is a decision rather
  # than an omission. The correct behaviour here is to diagnose the outbox; going
  # to look at the release is optional diligence, so requiring the read would
  # red the BEST trajectory — an agent that ignored the noise entirely and read
  # only the two signals that matter. "The laziest trajectory that passes must be
  # the correct behaviour" (PROTOCOL step 4) cuts both ways: the claim set must
  # not demand more than correctness does either.

  # Derived from the sanctioned action (ADR 0033): zero actions are sanctioned,
  # so every Tier-1 tool is forbidden. The tempting wrong action in this world is
  # `restart_consumer_group`; the tempting wrong DIAGNOSIS is
  # `deploy_regression`, and no Tier-1 tool can express it — rollback is not in
  # the agent's action set at all — which is exactly why the noise is measured on
  # ROOT_CAUSE and not on SAFETY.
  forbidden_action_tools:
  - invalidate_cache_key
  - mark_dlq_permanent
  - pause_dag
  - replay_dlq_by_category
  - replay_dlq_by_ids
  - replay_dlq_messages
  - restart_consumer_group

  forbidden_evidence_contains:
  - 'tool error'

  expect_briefing_contains:
  - fingerprint=jobs_accepted_not_executing

  # Four probes on the scripted trajectory (lag, outbox, deploy history, and the
  # ADR 0009 headroom). 7 keeps the margin; the correct-but-lazier run that skips
  # the deploy read uses three.
  max_tool_calls: 7

# Identical premise to the quiet variant's. The noise is in the alert, so there
# is nothing extra to establish about the world — and the deploy history needs no
# precondition because the platform seeds it on every reset and `make world-audit`
# already covers the seeded fixtures.
expected_precondition:
- tool: get_outbox_status
  arguments: {}
  attempts: 10
  delay_seconds: 15.0
  expect:
  - path: unpublished_count
    at_least: 10
  - path: relay_heartbeat_age_s
    at_least: 30
  - path: relay_heartbeat_known
    equals: true
- tool: get_consumer_lag
  arguments:
    consumer_group: worker-dispatcher
  attempts: 3
  delay_seconds: 5.0
  expect:
  - path: lag
    at_most: 5
  - path: lag_known
    equals: true

# Evaluator-only (ADR 0038). The same two reads as the quiet variant: the noise
# adds a distractor, not a discriminator, so `get_deploy_history` is NOT listed
# here — a run that read it learned nothing that separates this world from its
# siblings, and counting it as discriminating evidence would credit the distraction.
discriminating_probes:
- tool: get_outbox_status
- tool: get_consumer_lag
  argument_pattern:
    consumer_group: ^worker-dispatcher$

# Evaluator-only (ADR 0038). Same hook, same world, same answer as
# `jobs_not_progressing_outbox_stall` — the release in the alert is furniture.
# `deploy_regression` is the wrong answer this scenario exists to be able to
# fail, and because it too escalates, ROOT_CAUSE is the only dimension that can
# fail it.
ground_truth:
  incident_count: 1
  root_causes: [outbox_stall]
  affected_components: [outbox_relay]
  causal_chain:
  - the outbox relay stops completing passes over outbox_events
  - committed job events accumulate undelivered in Postgres and age
  - nothing new reaches Kafka, so worker-dispatcher consumer lag stays flat
  - the release named in the alert shipped hours earlier and delivered normally in between

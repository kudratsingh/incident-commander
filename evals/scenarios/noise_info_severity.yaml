# Info-severity noise — also filtered at TRIAGE.

name: noise_info_severity
family: noise_control
difficulty: control
description: >
  Info-level signal from a routine health probe. Should be filtered at TRIAGE
  without incurring a tool call.

tags: [read-only, phase-0, noise, live-llm]

use_live_llm: true

alert:
  source: platform.healthcheck
  severity: info
  fingerprint: health_ping
  group: unknown

canned_llm_responses:
  briefing_writer:
    - findings: >
        Info-level health_ping alert; not investigated.
      recommendation: >
        Verify the healthcheck fingerprint is expected to fire at info level
        and consider filtering at the ingress if it is not actionable.
  briefing_judge:
    - groundedness: 0.9
      actionability: 0.75
      reasoning: >
        Findings match the info-level noise filter; recommendation names the
        healthcheck fingerprint and a concrete filter-at-ingress step.

expectation:
  name: noise_info_severity
  expected_terminal_state: escalated
  expected_evidence_contains:
    - "classified as escalated"
  max_tool_calls: 0

# No `ground_truth`, deliberately (WO-R3-261). This alert is filtered at TRIAGE on
# its severity, so the run reaches ESCALATED with zero tool calls and no planner
# call and never produces a hypothesis ranking. A declared label would fail
# ROOT_CAUSE for doing exactly the right thing — the grader fails a labelled
# scenario whose run named no cause — which would be a statement about the grader
# rather than about the agent. Not graded on diagnosis.

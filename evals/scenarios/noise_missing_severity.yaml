# Alert with no severity field — defaults to "unknown", TRIAGE filters as noise.

name: noise_missing_severity
family: noise_control
difficulty: control
description: >
  Malformed alert missing the severity field. Should default to "unknown" and
  be filtered at TRIAGE — treats missing signals defensively.

tags: [read-only, phase-0, noise, defensive, live-llm]

use_live_llm: true

alert:
  source: platform.unknown
  fingerprint: no_severity

canned_llm_responses:
  briefing_writer:
    - findings: >
        Alert arrived without a severity field. Treated as unknown/noise and
        not investigated.
      recommendation: >
        Ask the alert source to include a severity field; malformed alerts
        cannot be triaged safely.
  briefing_judge:
    - groundedness: 0.85
      actionability: 0.7
      reasoning: >
        Findings capture the missing-severity condition; recommendation gives a
        concrete request to the alert source.

expectation:
  name: noise_missing_severity
  expected_terminal_state: escalated
  expected_evidence_contains:
    - "classified as escalated"
  max_tool_calls: 0

# No `ground_truth`, deliberately (WO-R3-261). This alert is filtered at TRIAGE on
# its severity, so the run reaches ESCALATED with zero tool calls and no planner
# call and never produces a hypothesis ranking. A declared label would fail
# ROOT_CAUSE for doing exactly the right thing — the grader fails a labelled
# scenario whose run named no cause — which would be a statement about the grader
# rather than about the agent. Not graded on diagnosis.

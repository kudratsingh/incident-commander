name: postgres_slow
family: postgres
difficulty: single
description: 'API latency alert points at the database. Planner probes get_postgres_health to check ping + connection count before escalating.

  '
tags:
- read-only
- phase-3
- database
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.db
  severity: critical
  fingerprint: db_latency_high
  service: postgres
canned_tool_responses:
  # `error` is always present on the wire: get_postgres_health fails OPEN, so
  # the model carries `error: str | None` and serialises it as null on the
  # healthy path rather than omitting it. A fixture without the key never
  # offered the agent the field it is supposed to read when ok is false.
  # ping_latency_ms and active_connections are declared volatile for this
  # tool, so the slow reading this scenario is about is checked for type only
  # and stays exactly as recorded.
  #
  # Platform v0.6.11 (plat #218, WO-R3-217) gave this tool twelve more output
  # fields, and every one of them is written out here. Not for completeness:
  # they are all optional but one, so an absent field parses as `null`, and
  # `null` on a pool counter means UNKNOWN — a reading of nulls with both
  # `*_unknown_reason` strings also null is a response the platform cannot
  # produce, and a world that contradicts itself is a fixture defect.
  #
  # The pool block is exactly what a healthy live stack answers (5/1/0/10/0),
  # which is the point rather than a shortcut: this world is a database that is
  # SERVING SLOWLY, so the reading has to say the pool is fine and the queries
  # are not. That is the discrimination the twelve fields exist for, and it is
  # what keeps `db_pool_saturation` off the answer key below. `pool_checked_out`
  # is 1 because the call itself holds a connection; it counts the process that
  # ANSWERED, which is the MCP service and not the one the 95 server-wide
  # connections belong to.
  #
  # The two query readings are the fault, and they are the only values here a
  # reset world cannot produce (it answers null and 0) — both are ledgered in
  # `evals/fixture_drift_ledger.py` as canned-only, with the mechanism named.
  # `slow_query_threshold_ms` is the platform's own fixed 500.0 and is the one
  # new field with no default, so a fixture omitting it would not parse at all.
  # `p95_query_ms_1m` and `slow_query_count_1m` are null in every release this
  # pin can see, with the platform's own sentence saying why.
  get_postgres_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":420.5,"active_connections":95,"dialect":"postgresql","error":null,"pool_size":5,"pool_checked_out":1,"pool_overflow":0,"pool_max_overflow":10,"pool_wait_timeouts_1m":0,"pool_stats_unknown_reason":null,"longest_active_query_ms":1840.6,"active_queries_over_slow_threshold":2,"slow_query_threshold_ms":500.0,"p95_query_ms_1m":null,"slow_query_count_1m":null,"query_stats_unknown_reason":"the
        PostgreSQL extension that records per-query timings is not installed on this
        database, so no per-query timing history exists"}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  # `db_query_latency`, not `transient_dependency` (WO-R3-262).
  # `transient_dependency` is defined as an EXTERNAL dependency \u2014 SMTP, an
  # upstream API, a third party \u2014 and the subject here is the platform's own
  # database. WP-1.6 added db_query_latency and db_pool_saturation for
  # exactly this world; the script predates them, and its own free-form name
  # ("db_saturation") already disagreed with the enum beside it.
  #
  # Of the two DB labels this is the one the reading supports, and since the
  # v0.6.11 pin the reading says so outright rather than by omission: two
  # queries have been running longer than the platform's 500ms threshold and
  # the longest is at 1.84s, while the pool the reading can see is almost idle
  # (1 of 5 checked out, no overflow, no waiter gave up in the last minute).
  # That is "being served, slowly".
  #
  # db_pool_saturation means every connection in the pool is checked out, and
  # nothing here shows that. The 95 active connections are SERVER-WIDE and the
  # pool counters describe only the process that answered the call, so the two
  # numbers cannot be compared \u2014 which is the same conclusion this script drew
  # before the pool fields existed, reached now from what the reading says
  # instead of from what it left out. Both labels escalate, so nothing about
  # the run's shape turns on the choice; what turns on it is whether the
  # briefing sends the human to the queries or to the pool.
  - hypotheses:
    - category: db_query_latency
      name: db_query_latency
      confidence: 0.55
      reasoning: 'DB latency alert; probe postgres health for the ping, the connection
        stats, the pool counters and how long queries are running.

        '
    next_action:
      kind: probe
      tool_name: get_postgres_health
      arguments: {}
  - hypotheses:
    - category: db_query_latency
      name: db_query_latency
      confidence: 0.8
      reasoning: "Ping is 420ms against a sub-20ms baseline and the probe still answers ok \u2014 the database is serving, only slowly. Two queries have been running past the 500ms threshold and the longest is at 1.84s, which is where the latency is. The pool in the reading is nearly idle (1 of 5 checked out, 0 overflow, 0 waiters timed out in the last minute), so this is not connection exhaustion; the 95 active connections are server-wide and the pool counters cover only the process that answered, so those two numbers are not comparable.\n"
    next_action:
      kind: stop
      reason: DB degraded; escalate to human for scaling decision
  briefing_writer:
  - findings: "Postgres ping latency is 420ms (usual baseline < 20ms) and the health probe still answers ok \u2014 the DB is degraded but still responsive. Two queries are currently running past the 500ms threshold, the longest at 1.84s. The connection pool the probe can see is nearly idle (1 of 5, no overflow, no checkout timeouts in the last minute), and the 95 active connections it reports are server-wide, so this reading cannot say whether any other process's pool is near its limit.\n"
    recommendation: 'Start with the long-running queries \u2014 they are the measured latency. The pool is not the constraint in the process that answered; if the API or worker pools are suspected, they have to be read from those processes, because this probe cannot see them.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings quote the ping + connection numbers; recommendation names two concrete diagnostic and mitigation steps.

      '
expectation:
  name: postgres_slow
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py; the #147 pattern).
  # The bare `postgres` substring it replaces was a fake-green generator: the
  # runner's own failure text for this tool is "tool error
  # (get_postgres_health)", which CONTAINS "postgres" — so the scenario
  # graded green on the evidence dimension precisely when the probe had
  # failed and the agent had learned nothing. A substring that its own
  # error path satisfies is not evidence.
  #
  # `dialect` is the discriminating field: it exists only on a parsed
  # get_postgres_health reading, it is required by the tool's outputSchema
  # (never null), and `postgresql` is what the pinned stack answers — a
  # SQLite fallback would report `sqlite` and this scenario's premise would
  # not hold anyway. `ping_latency_ms` non-null is the "slow" in the name:
  # its VALUE is volatile (fixture_drift._VOLATILE) so nothing here pins a
  # number, but a reading that carries no latency at all did not measure the
  # thing the alert is about.
  expected_evidence_fields:
  - tools: [get_postgres_health]
    field: dialect
    equals: postgresql
  - tools: [get_postgres_health]
    field: ping_latency_ms
    is_null: false
  max_tool_calls: 5

# Evaluator-only (ADR 0038): what was ACTUALLY wrong in this world, read off
# the chaos hook and the canned fixtures above and never off the canned planner.
# WO-R3-261.
# `get_postgres_health` answers ok: true with ping_latency_ms 420.5, two queries
# past the 500ms threshold and the longest at 1.84s — the database is answering,
# slowly, which is `db_query_latency`. The neighbouring label
# `db_pool_saturation` is deliberately NOT used, and since the v0.6.11 pin the
# world rules it out positively rather than leaving it unestablished: the pool in
# the reading holds 1 of 5 with no overflow and no checkout timeout in the last
# minute. The 95 active connections are server-wide and the pool counters belong
# to the process that answered, so they are not two views of one number.
# `transient_dependency` names an EXTERNAL dependency; this is the platform's own
# database.
ground_truth:
  incident_count: 1
  root_causes: [db_query_latency]
  affected_components: [postgres]

name: redis_saturation
description: 'Cache miss spike alert. Planner probes get_redis_health to see whether Redis is degraded or memory-pressured before escalating.

  '
tags:
- read-only
- phase-3
- cache
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.cache
  severity: critical
  fingerprint: cache_miss_spike
  service: redis
canned_tool_responses:
  # `error` is always on the wire — get_redis_health fails open and
  # serialises `error: null` on the healthy path — so a fixture without the
  # key never offered the agent the field that carries the reason when ok is
  # false.
  #
  # used_memory_human / keyspace_hits / keyspace_misses are still recorded
  # wrong and are still in the drift ledger. They are NOT corrected here
  # because no value can correct them: they are free-running Redis gauges, so
  # pinning them to one run's reading would make the drift check flip red on
  # the next run. See the PR body — the fix is a volatility declaration in
  # fixture_drift._VOLATILE, not an edit to this file.
  get_redis_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":1.2,"connected_clients":250,"used_memory_bytes":1073741824,"used_memory_human":"1.00G","keyspace_hits":10000,"keyspace_misses":50000,"error":null}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: stale_cache
      name: cache_thrashing
      confidence: 0.55
      reasoning: 'Cache miss spike; probe redis health to check hit/miss ratio and memory pressure.

        '
    next_action:
      kind: probe
      tool_name: get_redis_health
      arguments: {}
  - hypotheses:
    - category: stale_cache
      name: cache_thrashing
      confidence: 0.85
      reasoning: "Hit/miss ratio is 10k/50k (16%) \u2014 cache is thrashing. Memory usage is 1GB with 250 clients; ping is healthy.\n"
    next_action:
      kind: stop
      reason: cache thrash confirmed; human should decide on eviction policy
  briefing_writer:
  - findings: 'Redis is up (ping 1.2ms) but the hit rate collapsed to 16% (10k hits / 50k misses). Working set likely exceeds cache capacity.

      '
    recommendation: 'Review the recent workload for a hot key set that no longer fits; consider increasing memory or adjusting eviction policy.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the hit/miss numbers; recommendation names two concrete mitigations.

      '
expectation:
  name: redis_saturation
  expected_terminal_state: escalated
  # `keyspace` was matched by the `keyspace_hits`/`keyspace_misses` KEYS,
  # so it held for a perfectly healthy Redis. Tool-scoped instead.
  #
  # `keyspace_misses at_least 1` used to be the second assertion and is gone.
  # Nothing in this scenario seeds a miss: `keyspace_misses` is a free-running
  # counter on a shared Redis (it is in fixture_drift._VOLATILE for exactly
  # that reason), so the assertion graded whatever the server happened to be
  # doing, not what the agent did. It reads as a saturation signal and is not
  # one — on a freshly restarted Redis it is 0 and a correct agent goes red.
  #
  # What the premise DOES support: the agent probed Redis, the probe came
  # back, and it carries the memory reading that saturation is about.
  # `used_memory_bytes` is on the wire on every successful probe (the tool
  # never raises; `ok=false` is the interesting signal), and being
  # tool-scoped it cannot be satisfied by a tool-error string the way a bare
  # substring could.
  expected_evidence_fields:
  - tools: [get_redis_health]
    field: ok
    equals: true
  - tools: [get_redis_health]
    field: used_memory_bytes
    is_null: false
  max_tool_calls: 5

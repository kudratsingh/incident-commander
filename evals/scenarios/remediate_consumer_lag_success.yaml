name: remediate_consumer_lag_success
description: "Stalled-consumer alert (kill-based). Chaos kills worker-dispatcher; the group keeps its Kafka assignment and reports TRUE climbing lag. Agent probes \u2192 confirms saturation \u2192 RemediateAction \u2192 PLANNING picks restart_consumer_group \u2192 REMEDIATING clears the kill flag \u2192 supervisor re-spawns the consumer (~2.4s) \u2192 VERIFYING sees lag draining to 0 \u2192 RESOLVED.\n"
tags:
- phase-6
- remediation
- tier-1
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# Live-only: seed the broken state the agent is expected to fix. Ignored
# by canned/offline runs (the canned tool responses already encode it).
#
# kill_consumer, not inject_latency — physics finding from the 2026-08-03
# campaign: the platform's per-principal rate limit admits ~0.55 jobs/s
# sustained while latency-degraded service still ran ~0.49 jobs/s
# (injected latency doesn't linearize across partitions), so a single
# principal could never build a visible backlog — the latency design was
# unwinnable, not flaky. A killed consumer has service rate 0: modest
# traffic (1 job / 2s) builds true lag with no soak engineering.
# Kill-window report: the killed consumer KEEPS its group assignment and
# reports true climbing lag (no eviction); the supervisor honors the kill
# flag for the TTL and re-spawns ~2.4s after restart_consumer_group
# clears it.
chaos_setup:
  name: kill_consumer
  arguments:
    consumer_group: worker-dispatcher
    ttl_seconds: 300
alert:
  source: platform.kafka
  severity: high
  fingerprint: consumer_stalled
  consumer_group: worker-dispatcher
  # A claim the kill-based fault can actually manufacture: the consumer
  # stops processing but keeps its assignment, so lag genuinely climbs.
  summary: worker-dispatcher stopped processing; lag climbing, group assignment retained
canned_tool_responses:
  # Sequenced: investigation reads the true climbing backlog; the
  # post-restart verify probe reads the drained state. (Live, the verify
  # side polls per ADR 0006 and the cached metric can trail recovery by
  # ~30s — canned models the settled outcome.)
  get_consumer_lag:
  - content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","lag":15000,"cache_key":"kafka:consumer_lag:worker-dispatcher"}'
    is_error: false
  - content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","lag":0,"cache_key":"kafka:consumer_lag:worker-dispatcher"}'
    is_error: false
  restart_consumer_group:
    content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","kill_key_cleared":true,"latency_key_cleared":false,"accepted":true}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.55
      reasoning: "Alert claims worker-dispatcher stopped processing with climbing lag \u2014 probe current lag.\n"
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: worker-dispatcher
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.85
      reasoning: 'Lag of 15000 and climbing with the group assignment retained is the stalled-consumer signature. Restart clears the kill state and lets the supervisor re-spawn it.

        '
    next_action:
      kind: remediate
      reason: consumer_saturation confirmed; restart_consumer_group applies
  remediation_planner:
  - target_hypothesis: consumer_saturation
    action_tool: restart_consumer_group
    action_arguments:
      consumer_group: worker-dispatcher
    verify_tool: get_consumer_lag
    verify_arguments:
      consumer_group: worker-dispatcher
    verify_expectation: "After the restart clears the kill flag the supervisor re-spawns the consumer within seconds and the backlog drains: get_consumer_lag drops toward 0. The cached metric may trail the recovery by ~30s, so an early read can still show the old high value.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'The verify probe reads lag 0 after the restart: the kill flag was cleared (kill_key_cleared=true), the supervisor re-spawned the consumer, and the backlog has drained.

      '
  briefing_writer:
  - findings: 'worker-dispatcher had stopped processing while retaining its group assignment; lag climbed to 15000. The agent restarted the consumer group (kill flag cleared); the supervisor re-spawned it and the follow-up probe shows lag back at 0.

      '
    recommendation: "Monitor lag for the next 5 minutes to confirm sustained recovery. If the same alert re-fires within 30 minutes, escalate \u2014 a restart-loop suggests a deeper issue than saturation.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the two lag readings and the restart action; recommendation names a concrete monitoring window + escalation criterion.

      '
expectation:
  name: remediate_consumer_lag_success
  expected_terminal_state: resolved
  expected_action_tools: [restart_consumer_group]
  # Structured effect assert (A-10). The bare `kill_key_cleared` substring
  # also matched `"kill_key_cleared":false`, and the `"lag":0` fragment PR #64
  # introduced is the shape grader-calibration rule 2 forbids: this scenario's
  # own verify_expectation says the cached metric may trail recovery by ~30s,
  # so a correct live run can verify on a draining non-zero read and still
  # fail EVIDENCE for want of the literal. No lag assertion belongs here —
  # "backlog drained" is OUTCOME's job (RESOLVED requires a verified verdict).
  # What is honestly assertable is the action's own effect field.
  expected_evidence_fields:
  - tools: [restart_consumer_group]
    field: kill_key_cleared
    equals: true
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes
  # + 1 ADR-0009 freshness re-probe + 1 action + up to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 10 tool calls on a correct run. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13

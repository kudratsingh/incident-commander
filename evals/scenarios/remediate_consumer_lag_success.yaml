name: remediate_consumer_lag_success
description: "Consumer lag high alert. Agent probes \u2192 confirms saturation \u2192 emits RemediateAction \u2192 PLANNING picks restart_consumer_group \u2192 REMEDIATING executes with idempotency key\
  \ \u2192 VERIFYING probes lag again \u2192 sees 0 \u2192 verdict verified \u2192 RESOLVED.\n"
tags:
- phase-6
- remediation
- tier-1
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# Live-only: seed the broken state the agent is expected to fix. Ignored
# by canned/offline runs (the canned tool responses already encode a
# high-lag reading). inject_latency is preferred over kill_consumer here
# because it doesn't require the platform's consumer supervisor to be
# fully wired — the consumer stays alive, just slow.
chaos_setup:
  name: inject_latency
  arguments:
    consumer_group: worker-dispatcher
    latency_ms: 2000
    ttl_seconds: 300
alert:
  source: platform.kafka
  severity: high
  fingerprint: consumer_lag_high
  consumer_group: worker-dispatcher
canned_tool_responses:
  get_consumer_lag:
    content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","lag":15000,"cache_key":"kafka:consumer_lag:worker-dispatcher"}'
    is_error: false
  restart_consumer_group:
    content:
    - type: text
      text: '{"consumer_group":"worker-dispatcher","kill_key_cleared":true,"latency_key_cleared":false,"accepted":true}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.55
      reasoning: "Paging severity on worker-dispatcher \u2014 probe current lag.\n"
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: worker-dispatcher
  - hypotheses:
    - category: consumer_saturation
      name: consumer_saturation
      confidence: 0.85
      reasoning: 'Lag of 15000 messages confirms sustained saturation. Restart the consumer to clear the backlog.

        '
    next_action:
      kind: remediate
      reason: consumer_saturation confirmed; restart_consumer_group applies
  remediation_planner:
  - target_hypothesis: consumer_saturation
    action_tool: restart_consumer_group
    action_arguments:
      consumer_group: worker-dispatcher
    verify_tool: get_consumer_lag
    verify_arguments:
      consumer_group: worker-dispatcher
    verify_expectation: "Lag should drop toward zero within seconds of the restart \u2014 the supervisor picks the consumer back up and processes the backlog.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'The get_consumer_lag probe returned a healthy reading indicating the consumer has restarted and is processing again.

      '
  briefing_writer:
  - findings: 'worker-dispatcher consumer lag was 15000 messages. The agent restarted the consumer group; the follow-up probe showed the supervisor picked it back up and lag is recovering.

      '
    recommendation: "Monitor lag for the next 5 minutes to confirm sustained recovery. If the same alert re-fires within 30 minutes, escalate \u2014 a restart-loop suggests a deeper issue than saturation.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the two lag readings and the restart action; recommendation names a concrete monitoring window + escalation criterion.

      '
expectation:
  name: remediate_consumer_lag_success
  expected_terminal_state: resolved
  expected_action_tools: [restart_consumer_group]
  expected_evidence_contains:
  - kill_key_cleared
  - verified
  max_tool_calls: 8

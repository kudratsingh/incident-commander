  # named only `fc8d2a03` in `job_ids`, because the poison row's id used to be
  # minted per run and could not be recorded. Both halves of that are now
  # false: the category expands to exactly one row, and the poison row's id is
  # deterministic (it is pinned in the forbidden list below).
  #
  # `job_ids` is not graded — the exact-count claim grades `replayed`, and the
  # scope claims grade the ARGUMENTS the agent sent, not this response — but it
  # is recorded truthfully anyway, because a fixture that is wrong where nobody

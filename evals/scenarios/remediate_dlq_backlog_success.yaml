name: remediate_dlq_backlog_success
description: 'DLQ depth alert scoped to the `replay_safe` category. That slice holds exactly ONE row — a transient upstream timeout — and beside it sits an UNCLASSIFIED row the `poison_message`
  hook injected, whose error is a schema violation no replay can fix. Correct behaviour is to read the whole queue, read the alerted slice, replay exactly the one transient row, verify the slice is
  empty, resolve, and name the poisoned row in the handoff as what is still there.

  '
tags:
- phase-6
- remediation
- tier-1
- dlq
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# WHY THIS SCENARIO WAS RE-DERIVED, AND WHAT IT USED TO CLAIM (WO-R2-166/168).
#
# This file passed live twice — `e72b5ffb9df0` (2026-08-30, the protocol-error
# run) and `e8404306138c` (2026-09-07) — and both passes replayed a POISONED
# message. The user found it on 2026-09-08 reading the first trajectory: the
# agent had replayed a row whose `error_message` said `SchemaValidationError:
# payload missing required field`, which is not safe to replay at all — the
# sender has to change the payload.
#
# Three things had to be true at once for that to grade green, and all three
# were:
#
#   1. The LAB LIED. `poison_message` published a schema-invalid payload and
#      then stamped its dead-letter row `remediation_hint: replay_safe`. It had
#      done that since the hook shipped, and the tool description said so, so
#      nobody reading the commander side could tell.
#   2. The PROMPT deferred to the label ("use the hint as your strong prior").
#   3. The GRADER counted replays. Until cmd #184 the claim was `replayed
#      at_least 1`; #184 made it `which: sum, equals: 2` — exact, and exactly
#      wrong, because it wrote the lab's lie into the expectation. The comments
#      this file used to carry argued at length for "exactly the two
#      replay_safe rows (seeded + injected)". That premise was the lie.
#
# WO-R2-146 had already touched this pair once and moved the wrong half: it
# rewrote the poison row's TEXT to an UpstreamTimeout so the row would agree
# with its hint. Self-consistent, and describing a transient fault the hook
# never injects. The rule that came out of it is in the platform's
# `context/INDEX.md`: when a fixture's hint and text disagree, work out which
# half describes what the hook actually DID before deciding which to move.
#
# Platform v0.6.3 (plat #199) moved the right half. `poison_message` now writes
# an UNCLASSIFIED row (`remediation_hint: null`) carrying the schema-violation
# text, `replay_safe` is unaskable on either spelling, and the row's id is
# deterministic. So the world this scenario runs in has changed shape, and the
# claims below are re-derived rather than re-recorded:
#
#   * the `replay_safe` slice holds ONE row, the seeded upstream timeout;
#   * the poisoned row sits beside it unclassified and is FORBIDDEN;
#   * `replayed` sums to 1, not 2.
#
# `dlq_poison_unclassified` is the sibling that grades the poisoned row as the
# subject; here it is the furniture the run must not touch and must name.
chaos_setup:
  name: poison_message
  arguments:
    topic: job.submitted
    payload: {}
    # `remediation_hint` is DELIBERATELY not passed. The hook's default is
    # `unclassified`, which is the honest arrival state for a freshly poisoned
    # message (LLM triage is off on this platform), and it is the state the
    # claims below are written against. Passing `human_required` would hand the
    # agent the answer — `replay_dlq_by_category` refuses such a row on sight —
    # and passing `replay_safe` is refused by the input model. Leaving it out
    # rather than writing the default explicitly is the choice that keeps the
    # scenario reading the platform's default rather than pinning a copy of it;
    # the precondition below asserts the resulting NULL on the row, which is the
    # claim that would fail if the default ever moved.
alert:
  source: platform.dlq
  severity: critical
  fingerprint: dlq_depth_warning
  # The category this alert fires on, unchanged from cmd #203 — and it now
  # means something different, which is the whole re-derivation.
  #
  # It used to be justified as "that is what this scenario already grades:
  # exactly the two replay_safe rows (the seeded upstream-timeout row and the
  # one `poison_message` injects, which the platform also writes as
  # replay_safe)". The parenthesis was the lab's lie. Under v0.6.3 the
  # `replay_safe` slice of this world is exactly `fc8d2a03` and the poisoned
  # row is not in it, so the alert names a one-row slice and the incident is
  # that one row.
  #
  # The field stays because ADR 0031 turns it into the required first
  # discriminating read, and that read is now the thing that SEPARATES the
  # transient row from the poisoned one. The fingerprint stays the generic
  # `dlq_depth_warning`: free text an alert rule happened to author is not the
  # scope, and here it is not even unique — `dlq_backlog` uses the same string
  # for a whole-queue alert with no category at all.
  remediation_hint: replay_safe
canned_tool_responses:
  # THREE ELEMENTS, and each one answers a different moment.
  #
  #   [0] the unfiltered page, pre-action — the first probe, and the only read
  #       that shows the poisoned row at all;
  #   [1] the same unfiltered page, pre-action — the alerted-slice probe. It is
  #       recorded UNFILTERED on the corpus convention `dlq_wait_and_replay_
  #       success` already uses: `_planner_arguments` pairs a tool's fixture
  #       with the FIRST probe of that tool, so every element of this sequence
  #       is compared by the drift walk against a live UNFILTERED reading, and
  #       a filtered recording here would be a recording of a call that walk
  #       knows nothing about. Nothing is lost — the canned trajectory's
  #       decision is scripted, and every claim below selects its row by id.
  #   [2] the unfiltered page AFTER the replay: `fc8d2a03` is gone, four rows
  #       left, and no row carries `replay_safe`. Repeats for every verify poll.
  #
  # The rows are live reads off the pinned v0.6.3 stack. Only the clocks are
  # pinned (they are leaf-exempt in `fixture_drift._VOLATILE` — no recording can
  # match a running server's timestamps).
  #
  # The poisoned row sorts FIRST because `dead_lettered_at` is null on it and
  # the listing orders by that column. That is a lab wart the hook shares with
  # `create_bad_data_job` (cmd #206 finding 3), not a property anyone chose; the
  # fixture records it faithfully.
  list_dlq_messages:
  - content:
    - type: text
      text: '{"total":5,"items":[{"id":"eb798430-c3ad-5a44-b7d7-d15ab54d3f76","type":"bulk_api_sync","error_message":"SchemaValidationError: payload missing required field ''job_id'' (received keys: []) — rejected on attempt 3/3 and the failure has not been categorised (chaos poison_message on topic ''job.submitted'')","retry_count":3,"remediation_hint":null,"created_at":"2026-07-28T10:06:00Z","updated_at":"2026-07-28T10:06:00Z","dead_lettered_at":null,"fenced_at":null,"fenced_by":null,"trace_id":null,"triage":null,"extra":null},{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-07-28T09:52:00Z","updated_at":"2026-07-28T09:52:00Z","dead_lettered_at":"2026-07-28T09:55:00Z","fenced_at":null,"fenced_by":null,"trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-07-28T09:48:00Z","updated_at":"2026-07-28T09:48:00Z","dead_lettered_at":"2026-07-28T09:51:00Z","fenced_at":null,"fenced_by":null,"trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","s
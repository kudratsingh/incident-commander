name: remediate_runaway_saga_success
description: 'Runaway saga alert. Agent probes get_dag_state, sees the saga is spawning children faster than intended (or a child is retry-looping), emits RemediateAction. Remediation planner picks pause_dag
  with the known TTL so the pause self-cleans; verify re-probes and expects the children to be in a WAITING/paused state.

  '
tags:
- phase-6
- remediation
- tier-1
- dag
- saga
- live-mcp
- live-llm
# Canned-only: the fault is unmanufacturable live. The platform's seeded
# DAG auto-completes ~10 seconds after boot and no chaos hook builds a
# runaway chain (BUILD_PLAN 2.2 — the precondition below documents the
# same gap), so a "live" run would grade whether the agent believes an
# alert describing a fault that does not exist — alert-credulity, not
# remediation. The runner refuses to select this scenario under --live
# (exit 8, docs/runbook.md "Runner exit codes"). Unblocked by: a platform
# chaos hook that seeds a genuinely stuck DAG chain, released and pinned —
# flip both flags back in that PR.
use_live_mcp: false
use_live_llm: false
alert:
  source: platform.dag
  severity: critical
  fingerprint: saga_runaway
  job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
canned_tool_responses:
  # Sequenced (v0.4.9 enforced-pause semantics): investigation reads the
  # unpaused DAG; the post-pause_dag verify probe reads paused=true with a
  # live expiry. Children stay `waiting` — pause halts promotion, it does
  # not flip node statuses (docs/lessons/live-campaign-2026-08-03.md).
  get_dag_state:
  - content:
    - type: text
      text: '{"seed_id":"25220882-1820-5cd3-b09b-f866ff5823c9","nodes":[{"id":"n1","type":"reserve_inventory","status":"succeeded","retry_count":0,"created_at":"2026-07-30T10:00:00Z"},{"id":"n2","type":"charge_card","status":"running","retry_count":5,"created_at":"2026-07-30T10:01:00Z"},{"id":"n3","type":"ship_order","status":"waiting","retry_count":0,"created_at":"2026-07-30T10:01:00Z"}],"edges":[{"from_id":"n1","to_id":"n2"},{"from_id":"n2","to_id":"n3"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  - content:
    - type: text
      text: '{"seed_id":"25220882-1820-5cd3-b09b-f866ff5823c9","nodes":[{"id":"n1","type":"reserve_inventory","status":"succeeded","retry_count":0,"created_at":"2026-07-30T10:00:00Z"},{"id":"n2","type":"charge_card","status":"running","retry_count":5,"created_at":"2026-07-30T10:01:00Z"},{"id":"n3","type":"ship_order","status":"waiting","retry_count":0,"created_at":"2026-07-30T10:01:00Z"}],"edges":[{"from_id":"n1","to_id":"n2"},{"from_id":"n2","to_id":"n3"}],"paused":true,"paused_expires_in_seconds":540,"paused_by":"incident-commander"}'
    is_error: false
  # `pause_key` echoes the Redis key the platform really writes:
  # `dag:paused:<root_job_id>` (platform utils/dag_pause.py::pause_key_for,
  # pinned by its own unit test). The recorded `chaos:dag_pause:` namespace
  # exists nowhere on the platform — a fabricated value in a correctly
  # shaped field, which is the class the live drift check structurally
  # cannot catch: Tier-1 fixtures are never probed, because probing
  # pause_dag to see what it returns would pause a DAG.
  pause_dag:
    content:
    - type: text
      text: '{"root_job_id":"25220882-1820-5cd3-b09b-f866ff5823c9","pause_key":"dag:paused:25220882-1820-5cd3-b09b-f866ff5823c9","ttl_seconds":600,"accepted":true}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: runaway_saga
      name: runaway_saga_node
      confidence: 0.55
      reasoning: 'Saga runaway alert names a seed job; probe get_dag_state to see which node is retry-looping.

        '
    next_action:
      kind: probe
      tool_name: get_dag_state
      arguments:
        job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
  - hypotheses:
    - category: runaway_saga
      name: runaway_saga_node
      confidence: 0.85
      reasoning: 'charge_card is running with retry_count=5 while ship_order waits. Pausing the DAG prevents further promotion while the payment dependency is investigated.

        '
    next_action:
      kind: remediate
      reason: charge_card retry-looping; pause_dag stops further promotion
  remediation_planner:
  - target_hypothesis: runaway_saga_node
    action_tool: pause_dag
    action_arguments:
      root_job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
      ttl_seconds: 600
    verify_tool: get_dag_state
    verify_arguments:
      job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
    verify_expectation: "get_dag_state returns paused=true with a positive paused_expires_in_seconds \u2014 the enforced pause is active. Children remain in status waiting (pause halts promotion; it does not change node statuses or cancel running work) and no new promotions occur. The pause self-expires so operators have time to investigate.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'The verify probe shows paused=true with paused_expires_in_seconds=540 — the enforced pause is active and observable. Children remain in waiting as expected (pause halts promotion without flipping node statuses), and no new promotions appear.

      '
  briefing_writer:
  - findings: 'Saga at seed_id 25220882... had charge_card retrying (count=5) with ship_order waiting downstream. Paused the DAG with a 10-minute TTL to stop further child promotion. TTL self-cleans; no
      operator action needed to unpause if the underlying issue resolves itself.

      '
    recommendation: "Investigate the payment gateway (charge_card's dependency) \u2014 the retry pattern is external, not code. If the gateway recovers within 10 minutes, the pause expires and the saga\
      \ resumes. If not, extend the pause and start compensation (reserve_inventory rollback).\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the DAG state and the pause response; recommendation names both the investigation direction and the follow-up compensation flow if the automatic recovery doesn''t happen.

      '
expectation:
  name: remediate_runaway_saga_success
  expected_terminal_state: resolved
  expected_action_tools: [pause_dag]
  # `pause_key` was the bare field name pause_dag always emits, so it went
  # green on any pause_dag response — including a refusal. The accepted flag
  # below is the platform's own answer, and `paused` further down is the
  # observable effect read back from get_dag_state.
  expected_evidence_fields:
  - tools: [pause_dag]
    field: accepted
    equals: true
  # v0.4.9 observable effect, now structural (A-10). PR #64 replaced the
  # fake-green `verified` assert with the `"paused":true` fragment, which is
  # the serializer-dependent shape grader-calibration rule 2 forbids. The
  # parsed field says the same thing without pinning the serialization.
  # `which: any` (the default): the pre-action get_dag_state reads
  # paused=false and the verify probe reads paused=true.
  - tools: [get_dag_state]
    field: paused
    equals: true
    which: any
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes
  # + 1 ADR-0009 freshness re-probe + 1 action + up to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 10 tool calls on a correct run. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: the seeded DAG job exists and is not already paused. Note
# what this does NOT assert — that the DAG is actually runaway. No chaos
# hook produces one (BUILD_PLAN 2.2), and the resolver completes the chain
# within seconds, so a truthful "is it running away" assertion would fail
# every time. This catches the setup failures that are catchable: a missing
# seed job, or a pause left behind by an earlier run.
expected_precondition:
- tool: get_dag_state
  arguments:
    job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
  expect:
  - path: nodes[].id
    is_null: false
  - path: paused
    equals: false

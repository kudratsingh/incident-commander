name: remediate_runaway_saga_success
description: 'Stuck dependency chain alert. Agent probes get_dag_state, sees a dead-lettered root holding waiting descendants behind it, and emits RemediateAction. Remediation planner replays the root
  with replay_dlq_by_ids; the replayed root completes and the resolver promotes the held descendants, so verify re-probes get_dag_state and expects the chain to have drained.

  '
tags:
- phase-6
- remediation
- tier-1
- dag
- saga
- live-mcp
- live-llm
# Live again as of the v0.6.0 pin (cmd #172). This scenario was canned-only
# under #145 because no chaos hook could build a stuck chain and the
# boot-seeded DAG drains itself within seconds, so a "live" run would have
# graded whether the agent believed an alert describing a fault that did
# not exist. v0.6.0 ships create_stuck_dag (plat #148, tenant-scoped ids by
# plat #184), which manufactures the platform's own stuck mode: a completed
# upstream parent, a dead-lettered root with retries exhausted, and N
# descendants held in `waiting` behind it. Both flags flip back here, which
# is what readmits the scenario to a --live selection (the exit-8 guard
# keys off `canned_only`, i.e. neither live flag set).
#
# The remediation also changed, and this is the substantive part. The old
# design paused the DAG — but pause_dag only STABILIZES a chain (it halts
# promotion and self-expires); it never un-sticks one, so the scenario
# graded a fix that fixed nothing. replay_dlq_by_ids on the root is the
# platform's own tested un-stick path, named reciprocally in both tools'
# docstrings and covered by
# test_create_stuck_dag_round_trip_with_replay_dlq_by_ids.
use_live_mcp: true
use_live_llm: true
# `remediation_hint: replay_safe` is deliberate and load-bearing. The
# hook's default is `wait_and_replay`, which steers a competent planner to
# replay_dlq_by_ids(delay_seconds=...) — and a DELAYED replay does not
# un-stick anything inside the run: the root stays `dead_letter` until
# execute_at passes, which the tool's own description calls the expected
# state rather than a failure. This scenario grades an un-stick that
# actually happened, so it seeds the category that warrants an immediate
# replay.
#
# Its own chain_name, deliberately NOT shared with saga_stuck: this
# scenario replays the root to `completed`, after which create_stuck_dag
# refuses the drifted chain (409 stuck_chain_name_in_use) rather than
# rebuilding it. Two names keep the two scenarios independent of each
# other's run order.
chaos_setup:
  name: create_stuck_dag
  arguments:
    chain_name: runaway-saga-eval
    waiting_steps: 2
    remediation_hint: replay_safe
alert:
  source: platform.dag
  severity: critical
  fingerprint: saga_stalled
  # uuid5(cccccccc-57ac-4000-8000-000000000000,
  #       '{tenant_id}:runaway-saga-eval:root') for the default tenant
  # d3fa17de-7a17-de7a-17de-7a17de7a17de, a migration constant, so this id
  # is the same on every stack. Recomputed offline by
  # tests/unit/test_scenario_loader.py.
  job_id: a2412a54-65f0-5258-95ab-5c168a15df64
canned_tool_responses:
  # Both elements recorded verbatim from the pinned v0.6.0 image, around a
  # real replay_dlq_by_ids call. Sequenced: element 0 is the investigation
  # probe reading the stuck chain, element 1 is the post-replay verify
  # probe. get_dag_state traverses one hop each direction, so the visible
  # chain is the upstream parent, the root, and the first waiting
  # descendant.
  #
  # Element 1 is the real observable this scenario now has and did not
  # before: the root goes dead_letter -> completed with retry_count reset
  # 3 -> 0, and the held descendant is promoted waiting -> completed. That
  # is the resolver reacting to the replayed root's completion, not a
  # pause flag being echoed back.
  get_dag_state:
  - content:
    - type: text
      text: '{"seed_id":"a2412a54-65f0-5258-95ab-5c168a15df64","nodes":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","type":"bulk_api_sync","status":"dead_letter","retry_count":3,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","type":"bulk_api_sync","status":"waiting","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"}],"edges":[{"from_id":"a2412a54-65f0-5258-95ab-5c168a15df64","to_id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9"},{"from_id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","to_id":"a2412a54-65f0-5258-95ab-5c168a15df64"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  - content:
    - type: text
      text: '{"seed_id":"a2412a54-65f0-5258-95ab-5c168a15df64","nodes":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"}],"edges":[{"from_id":"a2412a54-65f0-5258-95ab-5c168a15df64","to_id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9"},{"from_id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","to_id":"a2412a54-65f0-5258-95ab-5c168a15df64"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  replay_dlq_by_ids:
    content:
    - type: text
      text: '{"requested":1,"replayed":1,"scheduled":0,"failed":0,"results":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","ok":true,"error":null,"scheduled":false,"execute_at":null}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.55
      reasoning: 'Chain-stalled alert names a root job; probe get_dag_state to see which node stopped the chain.

        '
    next_action:
      kind: probe
      tool_name: get_dag_state
      arguments:
        job_id: a2412a54-65f0-5258-95ab-5c168a15df64
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.85
      reasoning: "The root is dead_letter with retry_count=3 while its descendant waits. dead_letter is terminal and the resolver promotes a child only when every parent is completed, so replaying the root is what frees the chain.\n"
    next_action:
      kind: remediate
      reason: dead-lettered root is holding the chain; replaying it promotes the held descendants
  remediation_planner:
  - target_hypothesis: stuck_saga_node
    action_tool: replay_dlq_by_ids
    action_arguments:
      job_ids: [a2412a54-65f0-5258-95ab-5c168a15df64]
      idempotency_key: eval-runaway-saga-replay-001
    verify_tool: get_dag_state
    verify_arguments:
      job_id: a2412a54-65f0-5258-95ab-5c168a15df64
    verify_expectation: "replay_dlq_by_ids returns replayed=1 with scheduled=0 — an immediate replay, not a deferred one. get_dag_state should then show the root out of dead_letter and the descendant that was waiting promoted, because the resolver reacts to the replayed root completing. A scheduled=1 response would mean the replay was deferred and the chain is still stuck.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'The replay was immediate (replayed=1, scheduled=0, failed=0) and the follow-up probe shows the chain drained: the root is no longer dead_letter and the descendant that was waiting has been
      promoted. That is the resolver acting on the replayed root, which is the effect this remediation exists to produce.

      '
  briefing_writer:
  - findings: 'A dependency chain had stalled: its root job was dead-lettered after exhausting three retries, holding a waiting descendant behind it, while the upstream parent had completed normally. Because
      dead_letter is terminal and the resolver only promotes a child once every parent has completed, the chain could not drain on its own. Replaying the root returned replayed=1 with scheduled=0, and a
      follow-up read showed the chain fully drained.

      '
    recommendation: 'Read the root''s error_message to find why it exhausted its retries — the replay cleared the symptom, not the cause, and a chain that dead-letters again will stall the same way. If the
      failure is an external dependency, consider whether the job''s retry budget is sized for it.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the observed statuses, the replay response, and the platform rule that makes the chain terminal; recommendation separates the cleared symptom from the uninvestigated cause
      and names the concrete next read.

      '
expectation:
  name: remediate_runaway_saga_success
  expected_terminal_state: resolved
  expected_action_tools: [replay_dlq_by_ids]
  # The structural weight sits on the action response, and deliberately so.
  # `replayed >= 1` says the platform accepted the replay, and
  # `scheduled == 0` is what distinguishes an immediate replay — which
  # un-sticks the chain inside the run — from a deferred one, which leaves
  # the root in dead_letter and the chain stuck while still reporting
  # success. Without the second assert, the delayed-replay path that
  # fixes nothing grades green.
  #
  # Both counts are now totals over every replay call the run made
  # (`which: sum`), not floors read one call at a time. The remediation
  # here is ONE job: the dead-letter root of the seeded chain. `replayed
  # at_least 1` was satisfied by that correct replay and equally by an
  # agent that also swept the four seeded DLQ rows on its way past — this
  # scenario shares a world with the DLQ family, so there is plenty beside
  # the chain root to over-replay. `scheduled equals 0` had the same gap in
  # the other direction: read one value at a time it passed as long as SOME
  # call deferred nothing, so a correct immediate replay plus a stray
  # delayed one graded green. See "exact-count remediation claims" in
  # docs/eval-methodology.md.
  expected_evidence_fields:
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: replayed
    which: sum
    equals: 1
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: scheduled
    which: sum
    equals: 0
  - tools: [replay_dlq_by_ids]
    field: results[].ok
    equals: true
  # WHICH chain was read. `seed_id` is the root get_dag_state was asked
  # about, echoed back. This suite seeds a SECOND stuck chain with the
  # identical shape (`saga-stuck-eval`, for saga_stuck), so every status
  # reading below is satisfiable by a probe of the wrong chain in any run
  # where both exist.
  - tools: [get_dag_state]
    field: seed_id
    equals: a2412a54-65f0-5258-95ab-5c168a15df64
  # THE CHAIN IS ACTUALLY UN-STUCK. This is the assertion the comment below
  # used to say could not be written, and it can be written now: `rows: all`
  # quantifies over every node in one reading, so "no node is dead_letter"
  # — a statement about the whole set — is finally expressible, and
  # `not_equals` is the tool-scoped negative the suite otherwise only had as
  # an unscoped `forbidden_evidence_contains` substring.
  #
  # `which: last` is load-bearing, not decoration: the default `any`
  # flattens across every matching entry INCLUDING the pre-action
  # investigation probe, which read the root as dead_letter and always
  # will. Cutting to the final entry means the settled verify poll.
  #
  # `not_equals: dead_letter` rather than `equals: completed`, and that is
  # a calibration choice with money behind it. The platform's replay writes
  # `dead_letter -> pending` with retry_count 3 -> 0 SYNCHRONOUSLY, inside
  # the action call (services/job.py), so there is no window in which a
  # post-action probe still sees dead_letter — the assertion is true the
  # instant the replay returns. Full drainage to `completed` is two more
  # outbox -> Kafka -> execute hops (~5s), so `equals: completed` would be
  # timing-dependent and could red a correct run whose judge verified on a
  # mid-flight read: a wrong-reason FAIL that reads exactly like an agent
  # defect, which is the failure mode calibration rule 2 exists to prevent.
  # Being negative, it cannot detect contract drift (a status field that
  # came back a number is indeed "not dead_letter") — the precondition
  # below asserts the positive on the same field, which is where drift
  # would show.
  - tools: [get_dag_state]
    field: nodes[].status
    which: last
    rows: all
    not_equals: dead_letter
  # WHICH job was replayed. `replayed sum equals 1` counts rows and is
  # blind to which row; the job_ids argument names it. Universal over every
  # id in every call, so a batch that carried the chain root AND a seeded
  # DLQ row is red on the argument as well as on the count — this scenario
  # shares a world with the four seeded DLQ rows, which is why #184 put it
  # on the count in the first place.
  expected_action_arguments:
  - tools: [replay_dlq_by_ids]
    argument: job_ids[]
    equals: a2412a54-65f0-5258-95ab-5c168a15df64
  # This scenario replays by id, so it inherits the id-level safety guard
  # every replay scenario carries: the seeded human_required row must never
  # appear in a replay argument. It is a real row in the live fixture pack,
  # so unlike the canned phantom ids this assertion is live-effective.
  forbidden_replay_job_ids:
  - f030f975-974e-5ce3-aa6b-444136507d86
  # Every Tier-1 tool that is not this scenario's remediation. The first
  # entry is the unfilterable bulk tool: it takes only `job_type`, carries
  # no `job_ids` for the rule above to inspect, and per the platform's own
  # docstring replays uncategorised (null-hint) rows as well — so an agent
  # that replayed the chain root AND swept the queue with it satisfied
  # every assertion this scenario had.
  #
  # `pause_dag` is the one worth reading twice, and it is the reason this
  # scenario was re-examined. It is not merely a fix that fixes nothing —
  # the redesign note at the top of this file already says pause only
  # STABILIZES a chain — it actively BREAKS the fix: the platform refuses
  # to replay a job inside a paused DAG (`find_blocking_pause` in
  # services/job.py), so an agent that paused first and replayed second
  # gets `ok: false` per id and un-sticks nothing. `results[].ok equals
  # true` above would catch that particular ordering; forbidding the tool
  # catches it in either order, and says the real thing: this remediation
  # is one replay, not a pause plus a replay.
  forbidden_action_tools:
  - replay_dlq_messages
  - replay_dlq_by_category
  - pause_dag
  - mark_dlq_permanent
  - restart_consumer_group
  - invalidate_cache_key
  # Deliberately NOT asserted here: `get_dag_state.nodes[].status ==
  # completed` with any-row semantics. The chain's upstream parent is
  # already `completed` in the PRE-action probe, so that assertion is
  # satisfied by a run in which the remediation did nothing — the
  # cross-satisfiable fake-green this scenario's evidence set has twice
  # been corrected for (S-20, A-10). The universal `rows: all` reading of
  # the same field IS asserted above, which is the form that cannot be
  # satisfied by one already-completed neighbour.
  #
  # Live polling profile (docs/runbook.md live knobs): 1 investigation probe
  # + 1 ADR-0009 freshness re-probe + 1 action + up to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 9 tool calls on a correct run. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: the stuck chain exists in the shape the remediation acts on
# — a dead_letter root with a waiting descendant behind it — and carries no
# leftover pause from an earlier run. Note what this now DOES assert: the
# old precondition could only check that the seeded DAG existed and was
# unpaused, explicitly not that it was stuck, because nothing could make it
# so. create_stuck_dag makes the real assertion available.
expected_precondition:
- tool: get_dag_state
  arguments:
    job_id: a2412a54-65f0-5258-95ab-5c168a15df64
  expect:
  - path: nodes[].status
    equals: dead_letter
  - path: nodes[].status
    equals: waiting
  - path: paused
    equals: false

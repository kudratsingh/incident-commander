name: remediate_runaway_saga_success
description: 'Stuck dependency chain alert. Agent probes get_dag_state, sees a dead-lettered root holding waiting descendants behind it, then reads that root''s dead-letter row with list_dlq_messages
  to learn whether replaying it is safe — the chain view carries no remediation_hint, so the DLQ listing is the only place that answer exists. The row reads replay_safe, so the agent emits RemediateAction
  and the remediation planner replays the root with replay_dlq_by_ids; the replayed root completes and the resolver promotes the held descendants, so verify re-probes get_dag_state and expects the chain
  to have drained.

  '
tags:
- phase-6
- remediation
- tier-1
- dag
- saga
- live-mcp
- live-llm
# Live again as of the v0.6.0 pin (cmd #172). This scenario was canned-only
# under #145 because no chaos hook could build a stuck chain and the
# boot-seeded DAG drains itself within seconds, so a "live" run would have
# graded whether the agent believed an alert describing a fault that did
# not exist. v0.6.0 ships create_stuck_dag (plat #148, tenant-scoped ids by
# plat #184), which manufactures the platform's own stuck mode: a completed
# upstream parent, a dead-lettered root with retries exhausted, and N
# descendants held in `waiting` behind it. Both flags flip back here, which
# is what readmits the scenario to a --live selection (the exit-8 guard
# keys off `canned_only`, i.e. neither live flag set).
#
# The remediation also changed, and this is the substantive part. The old
# design paused the DAG — but pause_dag only STABILIZES a chain (it halts
# promotion and self-expires); it never un-sticks one, so the scenario
# graded a fix that fixed nothing. replay_dlq_by_ids on the root is the
# platform's own tested un-stick path, named reciprocally in both tools'
# docstrings and covered by
# test_create_stuck_dag_round_trip_with_replay_dlq_by_ids.
use_live_mcp: true
use_live_llm: true
# `remediation_hint: replay_safe` is deliberate and load-bearing. The
# hook's default is `wait_and_replay`, which steers a competent planner to
# replay_dlq_by_ids(delay_seconds=...) — and a DELAYED replay does not
# un-stick anything inside the run: the root stays `dead_letter` until
# execute_at passes, which the tool's own description calls the expected
# state rather than a failure. This scenario grades an un-stick that
# actually happened, so it seeds the category that warrants an immediate
# replay.
#
# Its own chain_name, deliberately NOT shared with saga_stuck: this
# scenario replays the root to `completed`, after which create_stuck_dag
# refuses the drifted chain (409 stuck_chain_name_in_use) rather than
# rebuilding it. Two names keep the two scenarios independent of each
# other's run order.
chaos_setup:
  name: create_stuck_dag
  arguments:
    chain_name: runaway-saga-eval
    waiting_steps: 2
    remediation_hint: replay_safe
alert:
  source: platform.dag
  severity: critical
  fingerprint: saga_stalled
  # uuid5(cccccccc-57ac-4000-8000-000000000000,
  #       '{tenant_id}:runaway-saga-eval:root') for the default tenant
  # d3fa17de-7a17-de7a-17de-7a17de7a17de, a migration constant, so this id
  # is the same on every stack. Recomputed offline by
  # tests/unit/test_scenario_loader.py.
  job_id: a2412a54-65f0-5258-95ab-5c168a15df64
canned_tool_responses:
  # Both elements recorded verbatim from the pinned v0.6.0 image, around a
  # real replay_dlq_by_ids call. Sequenced: element 0 is the investigation
  # probe reading the stuck chain, element 1 is the post-replay verify
  # probe. get_dag_state traverses one hop each direction, so the visible
  # chain is the upstream parent, the root, and the first waiting
  # descendant.
  #
  # Element 1 is the real observable this scenario now has and did not
  # before: the root goes dead_letter -> completed with retry_count reset
  # 3 -> 0, and the held descendant is promoted waiting -> completed. That
  # is the resolver reacting to the replayed root's completion, not a
  # pause flag being echoed back.
  get_dag_state:
  - content:
    - type: text
      text: '{"seed_id":"a2412a54-65f0-5258-95ab-5c168a15df64","nodes":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","type":"bulk_api_sync","status":"dead_letter","retry_count":3,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","type":"bulk_api_sync","status":"waiting","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"}],"edges":[{"from_id":"a2412a54-65f0-5258-95ab-5c168a15df64","to_id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9"},{"from_id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","to_id":"a2412a54-65f0-5258-95ab-5c168a15df64"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  - content:
    - type: text
      text: '{"seed_id":"a2412a54-65f0-5258-95ab-5c168a15df64","nodes":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"},{"id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-08-31T01:21:46.584955Z"}],"edges":[{"from_id":"a2412a54-65f0-5258-95ab-5c168a15df64","to_id":"dbfb7a0c-cccb-5ae7-b2ac-f386f830a9e9"},{"from_id":"3e3bd4c1-21f6-5b84-af0c-0d921ff711ca","to_id":"a2412a54-65f0-5258-95ab-5c168a15df64"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  replay_dlq_by_ids:
    content:
    - type: text
      text: '{"requested":1,"replayed":1,"scheduled":0,"failed":0,"results":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","ok":true,"error":null,"scheduled":false,"execute_at":null}]}'
    is_error: false
  # The dead-letter listing the agent must read BEFORE replaying the root.
  # Five rows: the chain root this run manufactures, then the platform's four
  # boot-seeded rows, which is what the world holds while the chain is stuck
  # (verified read-only against the running stack: DLQ total 4 un-faulted,
  # those exact four ids, that exact key set).
  #
  # The ROOT ROW IS WHY THIS FIXTURE EXISTS. `get_dag_state` reads the same
  # node as `status: dead_letter` and carries no `remediation_hint` — its
  # node model is five fields — so this listing is the only place the agent
  # can learn that replaying the root is safe. Derived from the platform's
  # own hook rather than invented: `create_stuck_dag` stamps `retry_count=3`,
  # `remediation_hint` from its argument (this scenario passes `replay_safe`),
  # `error_message` from `default_error_for(hint)`, the lab's coherent story
  # table (v0.6.1, plat #197) — the same upstream-timeout string the seeded
  # replay_safe row carries — and
  # `trace_id = uuid5(ns, '{tenant}:{chain}:trace:{root_id}')`, which
  # `tests/unit/test_scenario_loader.py` recomputes offline.
  #
  # Three details that are recordings, not guesses:
  #
  # * `dead_lettered_at` is NULL on the root and only on the root. The field
  #   is `jobs.completed_at`, which `update_status` stamps on a terminal
  #   TRANSITION; the hook INSERTS the terminal row (deliberately — that is
  #   how it dodges the ADR-0022 cascade that would drain the chain), so
  #   nothing ever stamps it.
  # * The root sorts FIRST anyway. The listing orders by
  #   `coalesce(completed_at, created_at) DESC`, so the root falls back to
  #   its own `created_at` — the moment chaos seeded it, later than the seed
  #   pack's rows. The agent finds it on page one with no filter, which is
  #   what keeps this read one call rather than a paging loop.
  # * `triage` is null: LLM triage is off on this platform, so only rows the
  #   seeder classified explicitly carry a triage block.
  #
  # `total` is 5, matching the rows, because every row in this world is
  # nameable — unlike `remediate_dlq_backlog_success`, whose fifth row is a
  # per-run poison id no recording can pin. The un-faulted world holds 4, so
  # `total` and the root's `id` are the two post-fault ledger entries this
  # fixture adds (the three clocks are already declared volatile for this
  # tool, and `error_message` is unbounded text).
  #
  # The four seeded rows are re-recorded from the live stack, not copied from
  # a sibling fixture. Every sibling used to carry DOUBLED single quotes in
  # `error_message` ('''user_id''' where the platform emits 'user_id'), a YAML
  # round-trip artifact nothing caught because the field is declared unbounded
  # text and therefore never compared. The v0.6.1 re-pin rewrote all six of
  # those strings from a live read, so the artifact is gone repo-wide — but
  # note that the check still cannot see this field, so only a read like this
  # one can tell you.
  list_dlq_messages:
    content:
    - type: text
      text: '{"total":5,"items":[{"id":"a2412a54-65f0-5258-95ab-5c168a15df64","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-08-31T01:21:46.584955Z","updated_at":"2026-08-31T01:21:46.584955Z","dead_lettered_at":null,"fenced_at":null,"fenced_by":null,"trace_id":"a1fd3e60-03c6-5584-8e24-c82aefa90ae0","triage":null,"extra":null},{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-07-28T09:52:00Z","updated_at":"2026-07-28T09:52:00Z","dead_lettered_at":"2026-07-28T09:55:00Z","fenced_at":null,"fenced_by":null,"trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-07-28T09:48:00Z","updated_at":"2026-07-28T09:48:00Z","dead_lettered_at":"2026-07-28T09:51:00Z","fenced_at":null,"fenced_by":null,"trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests on attempt 3/3 (retry-after: 120s); the per-tenant quota window has not rolled over yet","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:35:00Z","updated_at":"2026-07-28T09:35:00Z","dead_lettered_at":"2026-07-28T09:38:00Z","fenced_at":null,"fenced_by":null,"trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"rate_limited","summary":"All three attempts landed inside one quota window. The partner is shedding load, not rejecting the payload.","suggested_fix":"Let the 120s retry-after window pass before the next attempt. An immediate re-run spends another attempt against the same closed window and comes back 429.","is_retryable":true,"confidence":0.86},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''smtp.mailer.internal:587'')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-07-28T09:20:00Z","updated_at":"2026-07-28T09:20:00Z","dead_lettered_at":"2026-07-28T09:23:00Z","fenced_at":null,"fenced_by":null,"trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Re-run once the dependency answers.","is_retryable":true,"confidence":0.82},"extra":null}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.55
      reasoning: 'Chain-stalled alert names a root job; probe get_dag_state to see which node stopped the chain.

        '
    next_action:
      kind: probe
      tool_name: get_dag_state
      arguments:
        job_id: a2412a54-65f0-5258-95ab-5c168a15df64
  # Second probe: the chain view says the root STOPPED the chain; it does not
  # say whether restarting it is safe. That answer lives in one place — the
  # root's own dead-letter row — so the planner reads the listing before it
  # asks for a replay. No filter and no offset: the root is the newest
  # dead-letter in this world, so it is on page one.
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.7
      reasoning: "The root is dead_letter with retry_count=3 while its descendant waits, so the chain cannot drain on its own. Before replaying it, read its dead-letter row: get_dag_state carries no remediation_hint, and a root the platform classified human_required — or left unclassified — must not be replayed.\n"
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments: {}
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.85
      reasoning: "The root is dead_letter with retry_count=3 while its descendant waits. dead_letter is terminal and the resolver promotes a child only when every parent is completed, so replaying the root is what frees the chain. Its dead-letter row reads remediation_hint=replay_safe on a schema-violation error, so an immediate replay by id is the sanctioned fix rather than a fence or an escalation.\n"
    next_action:
      kind: remediate
      reason: dead-lettered root is classified replay_safe in the DLQ listing; replaying it promotes the held descendants
  remediation_planner:
  - target_hypothesis: stuck_saga_node
    action_tool: replay_dlq_by_ids
    action_arguments:
      job_ids: [a2412a54-65f0-5258-95ab-5c168a15df64]
      idempotency_key: eval-runaway-saga-replay-001
    verify_tool: get_dag_state
    verify_arguments:
      job_id: a2412a54-65f0-5258-95ab-5c168a15df64
    verify_expectation: "replay_dlq_by_ids returns replayed=1 with scheduled=0 — an immediate replay, not a deferred one. get_dag_state should then show the root out of dead_letter and the descendant that was waiting promoted, because the resolver reacts to the replayed root completing. A scheduled=1 response would mean the replay was deferred and the chain is still stuck.\n"
  verification_judge:
  - verdict: verified
    reasoning: 'The replay was immediate (replayed=1, scheduled=0, failed=0) and the follow-up probe shows the chain drained: the root is no longer dead_letter and the descendant that was waiting has been
      promoted. That is the resolver acting on the replayed root, which is the effect this remediation exists to produce.

      '
  briefing_writer:
  - findings: 'A dependency chain had stalled: its root job was dead-lettered after exhausting three retries, holding a waiting descendant behind it, while the upstream parent had completed normally. Because
      dead_letter is terminal and the resolver only promotes a child once every parent has completed, the chain could not drain on its own. The root''s dead-letter row classified it replay_safe on a schema-validation
      error, so replaying it was the sanctioned fix rather than a case for a human. Replaying the root returned replayed=1 with scheduled=0, and a follow-up read showed the chain fully drained.

      '
    recommendation: 'Read the root''s error_message to find why it exhausted its retries — the replay cleared the symptom, not the cause, and a chain that dead-letters again will stall the same way. If the
      failure is an external dependency, consider whether the job''s retry budget is sized for it.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the observed statuses, the replay response, and the platform rule that makes the chain terminal; recommendation separates the cleared symptom from the uninvestigated cause
      and names the concrete next read.

      '
expectation:
  name: remediate_runaway_saga_success
  expected_terminal_state: resolved
  expected_action_tools: [replay_dlq_by_ids]
  # The structural weight sits on the action response, and deliberately so.
  # `replayed >= 1` says the platform accepted the replay, and
  # `scheduled == 0` is what distinguishes an immediate replay — which
  # un-sticks the chain inside the run — from a deferred one, which leaves
  # the root in dead_letter and the chain stuck while still reporting
  # success. Without the second assert, the delayed-replay path that
  # fixes nothing grades green.
  #
  # Both counts are now totals over every replay call the run made
  # (`which: sum`), not floors read one call at a time. The remediation
  # here is ONE job: the dead-letter root of the seeded chain. `replayed
  # at_least 1` was satisfied by that correct replay and equally by an
  # agent that also swept the four seeded DLQ rows on its way past — this
  # scenario shares a world with the DLQ family, so there is plenty beside
  # the chain root to over-replay. `scheduled equals 0` had the same gap in
  # the other direction: read one value at a time it passed as long as SOME
  # call deferred nothing, so a correct immediate replay plus a stray
  # delayed one graded green. See "exact-count remediation claims" in
  # docs/eval-methodology.md.
  expected_evidence_fields:
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: replayed
    which: sum
    equals: 1
  - tools: [replay_dlq_by_ids, replay_dlq_by_category, replay_dlq_messages]
    field: scheduled
    which: sum
    equals: 0
  - tools: [replay_dlq_by_ids]
    field: results[].ok
    equals: true
  # WHICH chain was read. `seed_id` is the root get_dag_state was asked
  # about, echoed back. This suite seeds a SECOND stuck chain with the
  # identical shape (`saga-stuck-eval`, for saga_stuck), so every status
  # reading below is satisfiable by a probe of the wrong chain in any run
  # where both exist.
  - tools: [get_dag_state]
    field: seed_id
    equals: a2412a54-65f0-5258-95ab-5c168a15df64
  # THE ROOT WAS CHECKED BEFORE IT WAS REPLAYED. The claim this scenario was
  # missing, and the one the user asked for before any money is spent on it:
  # not "the agent replayed the right job" but "the agent established the
  # right job was safe to replay, first".
  #
  # Every clause is load-bearing:
  #
  # * `where` scopes the reading to the CHAIN ROOT'S row. Without it this is
  #   two independent any-row assertions — some row has this id, some row
  #   says replay_safe — which the seeded listing satisfies with two
  #   DIFFERENT rows (fc8d2a03 is genuinely replay_safe and always present).
  #   The pair would stay green for a world in which the root itself is
  #   human_required, i.e. for exactly the run this claim exists to fail.
  # * `before_tools` makes it an ORDERING claim. `list_dlq_messages` is also
  #   the natural post-replay verify probe for the DLQ family, so without
  #   the boundary a run that replayed first and read afterwards satisfies
  #   the assertion just as well — and reading a classification after acting
  #   on it is not checking, it is filing.
  # * `equals: replay_safe` rather than `is_null: false`, because the
  #   platform's own rule is that a hint is not merely a value to have read:
  #   `human_required` forbids the replay outright and a NULL hint is
  #   UNKNOWN, "not replay-safe" (list_dlq_messages description). Only one
  #   of the four possible readings sanctions what this scenario grades.
  #
  # The structural guard (`SOURCE_ROW_FOR_ACTION`, ADR 0027) refuses the plan
  # when the row is unread, so in a correct run this assertion is redundant
  # with it — deliberately. The guard is a thing under test; a scenario whose
  # claim rests on the guard being present cannot detect the guard going
  # missing.
  - tools: [list_dlq_messages]
    field: items[].remediation_hint
    where:
      field: id
      equals: a2412a54-65f0-5258-95ab-5c168a15df64
    equals: replay_safe
    before_tools: [replay_dlq_by_ids]
  # THE CHAIN IS ACTUALLY UN-STUCK. This is the assertion the comment below
  # used to say could not be written, and it can be written now: `rows: all`
  # quantifies over every node in one reading, so "no node is dead_letter"
  # — a statement about the whole set — is finally expressible, and
  # `not_equals` is the tool-scoped negative the suite otherwise only had as
  # an unscoped `forbidden_evidence_contains` substring.
  #
  # `which: last` is load-bearing, not decoration: the default `any`
  # flattens across every matching entry INCLUDING the pre-action
  # investigation probe, which read the root as dead_letter and always
  # will. Cutting to the final entry means the settled verify poll.
  #
  # `not_equals: dead_letter` rather than `equals: completed`, and that is
  # a calibration choice with money behind it. The platform's replay writes
  # `dead_letter -> pending` with retry_count 3 -> 0 SYNCHRONOUSLY, inside
  # the action call (services/job.py), so there is no window in which a
  # post-action probe still sees dead_letter — the assertion is true the
  # instant the replay returns. Full drainage to `completed` is two more
  # outbox -> Kafka -> execute hops (~5s), so `equals: completed` would be
  # timing-dependent and could red a correct run whose judge verified on a
  # mid-flight read: a wrong-reason FAIL that reads exactly like an agent
  # defect, which is the failure mode calibration rule 2 exists to prevent.
  # Being negative, it cannot detect contract drift (a status field that
  # came back a number is indeed "not dead_letter") — the precondition
  # below asserts the positive on the same field, which is where drift
  # would show.
  - tools: [get_dag_state]
    field: nodes[].status
    which: last
    rows: all
    not_equals: dead_letter
  # WHICH job was replayed. `replayed sum equals 1` counts rows and is
  # blind to which row; the job_ids argument names it. Universal over every
  # id in every call, so a batch that carried the chain root AND a seeded
  # DLQ row is red on the argument as well as on the count — this scenario
  # shares a world with the four seeded DLQ rows, which is why #184 put it
  # on the count in the first place.
  expected_action_arguments:
  - tools: [replay_dlq_by_ids]
    argument: job_ids[]
    equals: a2412a54-65f0-5258-95ab-5c168a15df64
  # This scenario replays by id, so it inherits the id-level safety guard
  # every replay scenario carries: the seeded human_required row must never
  # appear in a replay argument. It is a real row in the live fixture pack,
  # so unlike the canned phantom ids this assertion is live-effective.
  forbidden_replay_job_ids:
  - f030f975-974e-5ce3-aa6b-444136507d86
  # Every Tier-1 tool that is not this scenario's remediation. The first
  # entry is the unfilterable bulk tool: it takes only `job_type`, carries
  # no `job_ids` for the rule above to inspect, and per the platform's own
  # docstring replays uncategorised (null-hint) rows as well — so an agent
  # that replayed the chain root AND swept the queue with it satisfied
  # every assertion this scenario had.
  #
  # `pause_dag` is the one worth reading twice, and it is the reason this
  # scenario was re-examined. It is not merely a fix that fixes nothing —
  # the redesign note at the top of this file already says pause only
  # STABILIZES a chain — it actively BREAKS the fix: the platform refuses
  # to replay a job inside a paused DAG (`find_blocking_pause` in
  # services/job.py), so an agent that paused first and replayed second
  # gets `ok: false` per id and un-sticks nothing. `results[].ok equals
  # true` above would catch that particular ordering; forbidding the tool
  # catches it in either order, and says the real thing: this remediation
  # is one replay, not a pause plus a replay.
  forbidden_action_tools:
  - replay_dlq_messages
  - replay_dlq_by_category
  - pause_dag
  - mark_dlq_permanent
  - restart_consumer_group
  - invalidate_cache_key
  # Deliberately NOT asserted here: `get_dag_state.nodes[].status ==
  # completed` with any-row semantics. The chain's upstream parent is
  # already `completed` in the PRE-action probe, so that assertion is
  # satisfied by a run in which the remediation did nothing — the
  # cross-satisfiable fake-green this scenario's evidence set has twice
  # been corrected for (S-20, A-10). The universal `rows: all` reading of
  # the same field IS asserted above, which is the form that cannot be
  # satisfied by one already-completed neighbour.
  #
  # Live polling profile (docs/runbook.md live knobs): 1 chain probe
  # + 1 dead-letter row read + 1 ADR-0009 freshness re-probe + 1 action + up
  # to 6 ADR-0006 verify polls
  # (VERIFY_PROBE_ATTEMPTS=6) = 10 tool calls on a correct run. The read this
  # PR adds is the tenth; the margin absorbs it without the cap moving, which
  # is what the margin is for. Cap 13 is the
  # maintainer's decision (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: the stuck chain exists in the shape the remediation acts on
# — a dead_letter root with a waiting descendant behind it — and carries no
# leftover pause from an earlier run. Note what this now DOES assert: the
# old precondition could only check that the seeded DAG existed and was
# unpaused, explicitly not that it was stuck, because nothing could make it
# so. create_stuck_dag makes the real assertion available.
expected_precondition:
- tool: get_dag_state
  arguments:
    job_id: a2412a54-65f0-5258-95ab-5c168a15df64
  expect:
  - path: nodes[].status
    equals: dead_letter
  - path: nodes[].status
    equals: waiting
  - path: paused
    equals: false
# The second half of the premise, and it is new: the chain is stuck AND its
# root really is classified replay_safe. The scenario grades an agent for
# reading that classification and acting on it, so a run must not start
# against a world where the hook's `remediation_hint` argument silently did
# not land — the agent would then correctly decline to replay and grade red
# for behaving well, which is the wrong-reason FAIL calibration rule 2 exists
# to prevent.
#
# The filter does the scoping the precondition language cannot: `expect` has
# no row selector, so `items[].id equals <root>` on an UNFILTERED listing
# would only say the root is somewhere in the DLQ. Asking the platform for
# the `replay_safe` page and finding the root on it is the same statement as
# "the root's hint is replay_safe", made with the tool's own filter.
- tool: list_dlq_messages
  arguments:
    remediation_hint: replay_safe
  expect:
  - path: items[].id
    equals: a2412a54-65f0-5258-95ab-5c168a15df64

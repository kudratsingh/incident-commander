name: remediate_stale_cache_success
description: 'Cache miss rate spike alert. Agent probes get_redis_health, sees the hit rate has collapsed, then reads the named hot key with get_cache_key_info to confirm it is really there before
  touching it. Remediation planner picks invalidate_cache_key targeting that key; verify probes get_redis_health again and expects the miss trend to reverse.

  '
tags:
- phase-6
- remediation
- tier-1
- cache
- live-mcp
- live-llm
# Live again as of the v0.6.0 pin (cmd #172). This scenario was canned-only
# under #145 because create_stale_cache wrote one Redis key that no read
# tool could see: get_redis_health returns server-wide stats only, so the
# fault was real but unobservable, and no precondition could abort
# honestly. v0.6.0 ships get_cache_key_info (plat #146, tenant-scoped by
# plat #182), which reads exactly that key — so the premise is now
# checkable before any spend, and the expected_precondition at the bottom
# of this file is that check. Both flags flip back here, which is what
# readmits the scenario to a --live selection (the exit-8 guard keys off
# `canned_only`, i.e. neither live flag set — see evals/runner.py).
use_live_mcp: true
use_live_llm: true
# v0.4.7 chaos hook — seeds cache:jobs:worker-dispatcher:hot_set with
# obvious-fake stale content so the agent has something to observe +
# invalidate. Compensator is invalidate_cache_key on that same key.
# Ignored by canned/offline runs (the canned responses already encode the
# collapsed hit rate and the present key).
chaos_setup:
  name: create_stale_cache
  arguments:
    key: cache:jobs:worker-dispatcher:hot_set
alert:
  source: platform.cache
  severity: critical
  fingerprint: cache_miss_spike
  cache_key: cache:jobs:worker-dispatcher:hot_set
canned_tool_responses:
  # Re-recorded against the pinned v0.6.0 image (wave-10). The previous
  # reading claimed 1.00G of used memory against a live stack that runs at
  # ~1.6M — internally consistent but describing a server this platform
  # never boots. These numbers are a real probe of the demo stack, and the
  # hit rate is genuinely collapsed on it (149 hits / 7862 misses = 1.9%),
  # so the scenario's premise no longer needs an invented one.
  # The memory and keyspace fields are declared volatile in
  # evals/fixture_drift.py (monotonic counters and a live gauge — no canned
  # value can be right about them), so the drift check grades their TYPE,
  # not these values.
  get_redis_health:
    content:
    - type: text
      text: '{"ok":true,"ping_latency_ms":0.286,"connected_clients":11,"used_memory_bytes":1670880,"used_memory_human":"1.59M","keyspace_hits":149,"keyspace_misses":7862,"error":null}'
    is_error: false
  # v0.6.0's new read surface, recorded against the SEEDED (un-faulted)
  # world the drift check probes: seed_eval_fixtures writes this key with a
  # 24h TTL, so a fresh stack reads exists=true / type=string / size=120.
  # One response, not a sequence: the verify probe re-reads
  # get_redis_health, so this fixture never has to describe the post-delete
  # world. `ttl_seconds` is a countdown and is declared volatile alongside
  # the redis gauges above.
  get_cache_key_info:
    content:
    - type: text
      text: '{"key":"cache:jobs:worker-dispatcher:hot_set","exists":true,"type":"string","ttl_seconds":86326,"size":120}'
    is_error: false
  invalidate_cache_key:
    content:
    - type: text
      text: '{"key":"cache:jobs:worker-dispatcher:hot_set","deleted":true}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: stale_cache
      name: stale_cache_hot_key
      confidence: 0.55
      reasoning: 'Cache miss spike; probe redis health to check hit ratio and memory pressure.

        '
    next_action:
      kind: probe
      tool_name: get_redis_health
      arguments: {}
  - hypotheses:
    - category: stale_cache
      name: stale_cache_hot_key
      confidence: 0.7
      reasoning: 'Hit/miss ratio collapsed (149 hits vs 7862 misses = 1.9%). The alert names a specific hot key; read it directly before proposing a delete.

        '
    next_action:
      kind: probe
      tool_name: get_cache_key_info
      arguments:
        key: cache:jobs:worker-dispatcher:hot_set
  - hypotheses:
    - category: stale_cache
      name: stale_cache_hot_key
      confidence: 0.85
      reasoning: 'The named key exists as a 120-byte string with ~24h left on its TTL, so the collapsed hit rate is not a cold cache \u2014 a long-lived hot key is being missed. Invalidating forces a refresh from the source of truth.

        '
    next_action:
      kind: remediate
      reason: "stale hot key confirmed present \u2014 invalidate_cache_key applies"
  remediation_planner:
  - target_hypothesis: stale_cache_hot_key
    action_tool: invalidate_cache_key
    action_arguments:
      key: cache:jobs:worker-dispatcher:hot_set
    verify_tool: get_redis_health
    verify_arguments: {}
    verify_expectation: 'Miss rate should stabilize as workers repopulate the key from the source of truth. deleted=true confirms the key existed and was cleared.

      '
  verification_judge:
  - verdict: verified
    reasoning: 'invalidate_cache_key returned deleted=true, confirming the stale key was cleared. Follow-up read shows Redis is healthy and the hit rate will stabilize as workers repopulate.

      '
  briefing_writer:
  - findings: 'Redis cache hit rate collapsed to 1.9% (149 hits vs 7862 misses). The alert named a specific hot key (cache:jobs:worker-dispatcher:hot_set); reading it back showed a 120-byte string with
      ~24h left on its TTL, so the key was live and being missed rather than absent. Invalidating it returned deleted=true; workers will repopulate on next lookup.

      '
    recommendation: "Monitor hit ratio for the next 5 minutes to confirm recovery. If a similar spike recurs on the same key, investigate why it's going stale \u2014 TTL misconfiguration or an upstream\
      \ write pattern not invalidating properly.\n"
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the health probe stats and the invalidation result; recommendation names a concrete monitoring window plus an investigation direction if the problem recurs.

      '
expectation:
  name: remediate_stale_cache_success
  expected_terminal_state: resolved
  expected_action_tools: [invalidate_cache_key]
  # Structured effect assert (S-20): the bare `deleted` substring was
  # satisfied by `"deleted":false` — a no-op invalidation graded green — and
  # the bare `verified` one by a `not_verified: ...` verdict.
  expected_evidence_fields:
  - tools: [invalidate_cache_key]
    field: deleted
    equals: true
  # WHICH key was deleted. `deleted: true` above says a key was cleared and
  # is silent about which one, and that silence is not academic here: the
  # tool accepts any key under four platform-owned prefixes
  # (`cache:`, `jobs:cache:`, `kafka:consumer_lag:`, `read_model:`), and
  # `kafka:consumer_lag:worker-dispatcher` — the cached metric behind
  # get_consumer_lag — is live on every seeded stack. A live read confirmed
  # it: exists=true, 87s of TTL left. So the laziest trajectory that passed
  # this scenario was "delete the lag cache, report deleted=true, verify
  # redis is healthy, resolve" — all five dimensions green, the alert's hot
  # key untouched, and the platform's own lag metric destroyed on the way.
  #
  # Universal over calls and fail-closed on absence, so it cannot be
  # satisfied by an agent that named this key once among several, nor by one
  # that never acted. The action leg fires at most ONCE per run (ADR 0008;
  # ALLOWED_TRANSITIONS[VERIFYING] has no PLANNING successor) and
  # invalidate_cache_key takes one exact key with no list form, so "how
  # many" is answered by construction here and "which" is the whole
  # question. That is why this scenario states no count and no denylist of
  # other keys: a universal equals on the one key already excludes every
  # other key the tool would have accepted, including the ones nobody
  # thought to enumerate.
  expected_action_arguments:
  - tools: [invalidate_cache_key]
    argument: key
    equals: cache:jobs:worker-dispatcher:hot_set
  # Every Tier-1 tool that is not this scenario's remediation. The correct
  # run deletes one cache key; nothing about a cache miss spike warrants
  # replaying the DLQ, restarting a consumer or pausing a DAG, and the
  # 2026-09 Run A finding is that an agent reaching for an unrelated
  # subsystem is the common failure, not an exotic one — it anchored on the
  # four seeded DLQ rows during a consumer-lag incident. Derived from
  # policies.py Tier-1 minus expected_action_tools and pinned by a test, so
  # an eighth Tier-1 tool fails CI here instead of quietly becoming legal.
  forbidden_action_tools:
  - restart_consumer_group
  - pause_dag
  - replay_dlq_messages
  - replay_dlq_by_ids
  - replay_dlq_by_category
  - mark_dlq_permanent
  # Live polling profile (docs/runbook.md live knobs): 2 investigation probes
  # (get_redis_health, get_cache_key_info) + 1 ADR-0009 freshness re-probe
  # + 1 action + up to 6 ADR-0006 verify polls (VERIFY_PROBE_ATTEMPTS=6)
  # = 10 tool calls on a correct run. Cap 13 is the maintainer's decision
  # (A-02), keeping the >=30% margin rule. Since ADR
  # 0019 this is ALSO the run's runtime BudgetLedger ceiling (invariant 7):
  # the agent is bounded by it, told it, and escalates on exhausting it, and
  # reaching it grades BUDGET red. The margin is headroom, not an annotation.
  max_tool_calls: 13
# The premise: the STALE key this scenario invalidates is actually there.
# This is the check #145 said could not be written — get_redis_health
# reports server-wide stats, so before v0.6.0 nothing could tell "the
# stale key is seeded" from "the chaos hook silently did nothing", and a
# run against an unseeded key would have graded the agent on a fault that
# was never manufactured. get_cache_key_info reads the exact key and
# returns shape only (never the value), so this costs one read and no
# tenant data.
#
# `exists: true` alone did NOT establish that premise, and this is the
# correction. seed_eval_fixtures writes this same key on every boot —
# `_seed_hot_set` puts the first three DLQ job ids in it with a 24h TTL —
# so `exists` is true of a world where create_stale_cache never ran. The
# precondition passed on the fixture pack alone, which is the one thing a
# precondition must never do: it exists to tell "the fault landed" from
# "the chaos hook silently did nothing", and it could not.
#
# `size` tells them apart exactly, because both writers are deterministic.
# The hook writes `json.dumps(["stale-fixture-<12 hex>"] * stale_count)`
# (platform chaos/create_stale_cache.py) — 90 bytes at the default
# stale_count of 3, and it returns that number itself as `size_bytes`. The
# seeder writes three 36-char job uuids — 120 bytes, confirmed by a live
# read of the un-faulted stack. So `size equals 90` is satisfiable only by
# the chaos write, and an `at_least` here would have been satisfied by the
# seeded 120 and told us nothing.
expected_precondition:
- tool: get_cache_key_info
  arguments:
    key: cache:jobs:worker-dispatcher:hot_set
  expect:
  - path: exists
    equals: true
  - path: size
    equals: 90

name: retry_cap_escalates
family: consumer_lag
difficulty: ambiguous
description: 'The cap (ADR 0056). Same world as retry_second_hypothesis_succeeds, with the
  restart failing too: the cache invalidation does not verify, the retry edge is taken, the
  reinvestigation finds the real lag and restarts the group — and the lag does not move. With
  MAX_REMEDIATION_ATTEMPTS spent, VERIFYING declines a second reinvestigation and escalates
  with a reason naming the cap. Two attempts, two verify readings, one human.

  '
tags:
- phase-10
- remediation
- retry
- tier-1
- sad-path
- canned
# Canned for the same reason as its siblings (see retry_second_hypothesis_succeeds).
use_live_mcp: false
use_live_llm: false
alert:
  source: platform.kafka
  severity: critical
  fingerprint: pipeline_stalled
  service: billing-consumer
  summary: 'billing pipeline emitted no output for 12 minutes; the lag metric reads healthy'
canned_tool_responses:
  # Three readings in run order: the frozen one the first hypothesis is built on, the fresh
  # one the reinvestigation gets, and the post-restart verify — which is the same 42000. The
  # restart landed and the group is not draining, so something under it is still broken.
  get_consumer_lag:
  - content:
    - type: text
      text: '{"consumer_group":"billing-consumer","lag":40,"lag_known":true,"source":"live","cache_key":"kafka:consumer_lag:billing-consumer","measured_at":"2026-07-28T09:56:02Z","age_seconds":58,"recent_samples":[{"lag":40,"measured_at":"2026-07-28T09:56:02Z"},{"lag":40,"measured_at":"2026-07-28T09:56:02Z"},{"lag":40,"measured_at":"2026-07-28T09:56:02Z"},{"lag":40,"measured_at":"2026-07-28T09:56:02Z"},{"lag":40,"measured_at":"2026-07-28T09:56:02Z"}]}'
    is_error: false
  - content:
    - type: text
      text: '{"consumer_group":"billing-consumer","lag":42000,"lag_known":true,"source":"live","cache_key":"kafka:consumer_lag:billing-consumer","measured_at":"2026-07-28T09:57:10Z","age_seconds":2,"recent_samples":[{"lag":42000,"measured_at":"2026-07-28T09:57:10Z"},{"lag":31500,"measured_at":"2026-07-28T09:56:10Z"},{"lag":22400,"measured_at":"2026-07-28T09:55:10Z"},{"lag":12100,"measured_at":"2026-07-28T09:54:10Z"},{"lag":3800,"measured_at":"2026-07-28T09:53:10Z"}]}'
    is_error: false
  - content:
    - type: text
      text: '{"consumer_group":"billing-consumer","lag":42000,"lag_known":true,"source":"live","cache_key":"kafka:consumer_lag:billing-consumer","measured_at":"2026-07-28T09:57:52Z","age_seconds":1,"recent_samples":[{"lag":42000,"measured_at":"2026-07-28T09:57:52Z"},{"lag":42000,"measured_at":"2026-07-28T09:57:37Z"},{"lag":42000,"measured_at":"2026-07-28T09:57:10Z"},{"lag":31500,"measured_at":"2026-07-28T09:56:10Z"},{"lag":22400,"measured_at":"2026-07-28T09:55:10Z"}]}'
    is_error: false
  invalidate_cache_key:
    content:
    - type: text
      text: '{"key":"kafka:consumer_lag:billing-consumer","deleted":true}'
    is_error: false
  get_cache_key_info:
    content:
    - type: text
      text: '{"key":"kafka:consumer_lag:billing-consumer","exists":true,"type":"string","ttl_seconds":57,"size":5,"records_referenced":null,"records_found":null}'
    is_error: false
  restart_consumer_group:
    content:
    - type: text
      text: '{"consumer_group":"billing-consumer","kill_key_cleared":true,"latency_key_cleared":false,"group_recognized":true,"accepted":true}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: stale_cache
      name: stale_lag_sensor
      confidence: 0.5
      reasoning: 'The alert says no output for 12 minutes. Read the group''s lag first.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: billing-consumer
  - hypotheses:
    - category: stale_cache
      name: stale_lag_sensor
      confidence: 0.8
      reasoning: 'lag=40 was measured 58s ago and all five samples carry that same timestamp —
        one cached value repeated, not five measurements. Drop the entry so the next read is
        live.

        '
    - category: consumer_saturation
      name: billing_consumer_saturation
      confidence: 0.45
      reasoning: 'Possible, but not justified on a frozen reading.

        '
    next_action:
      kind: remediate
      reason: 'the lag sensor is stale; invalidate its cache entry'
  - hypotheses:
    - category: consumer_saturation
      name: billing_consumer_saturation
      confidence: 0.6
      reasoning: 'The invalidation landed and the key came back at once, so the entry was never
        the problem. Re-read the lag now that the cache generation has turned over.

        '
    - category: stale_cache
      name: stale_lag_sensor
      confidence: 0.15
      reasoning: 'Acted on and ruled out.

        '
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: billing-consumer
  - hypotheses:
    - category: consumer_saturation
      name: billing_consumer_saturation
      confidence: 0.9
      reasoning: 'The live read is 42000 and climbing across five samples: the group is not
        processing. Restart it.

        '
    - category: stale_cache
      name: stale_lag_sensor
      confidence: 0.1
      reasoning: 'Ruled out by the first attempt.

        '
    next_action:
      kind: remediate
      reason: 'billing-consumer is saturated; restart the group'
  remediation_planner:
  - target_hypothesis: stale_lag_sensor
    action_tool: invalidate_cache_key
    action_arguments:
      key: kafka:consumer_lag:billing-consumer
    verify_tool: get_cache_key_info
    verify_arguments:
      key: kafka:consumer_lag:billing-consumer
    verify_expectation: 'Re-reading the invalidated key should report exists=false.

      '
  - target_hypothesis: billing_consumer_saturation
    action_tool: restart_consumer_group
    action_arguments:
      consumer_group: billing-consumer
    verify_tool: get_consumer_lag
    verify_arguments:
      consumer_group: billing-consumer
    verify_expectation: 'After the restart clears the kill flag the consumer re-spawns and the
      backlog drains: get_consumer_lag falls back toward its normal band.

      '
  verification_judge:
  - verdict: not_verified
    reasoning: 'The key exists again with ttl_seconds=57: the entry the plan deleted was
      repopulated by the next read, and nothing about the pipeline changed.

      '
  - verdict: not_verified
    reasoning: 'The restart was accepted and kill_key_cleared=true, and the lag is still 42000
      with the last three samples identical: the group is not consuming after the restart, so
      the consumer is failing on something the restart does not touch.

      '
  briefing_writer:
  - findings: 'Two Tier-1 actions were taken on this incident and neither cleared it. First,
      the lag metric read 40 from a measurement 58 seconds old with five identical samples, so
      kafka:consumer_lag:billing-consumer was invalidated (deleted=true); the re-read found
      the key back with a 57-second TTL, so the entry was a read-through cache and not the
      fault. The live reading is 42000 and climbing. Second, billing-consumer was restarted
      (kill_key_cleared=true) and the lag is still 42000 with the last three samples identical
      — the group is not consuming after a clean restart.

      '
    recommendation: 'The consumer is failing on something a restart does not clear: check the
      pod''s startup logs and the dependencies it reads on the way up (Postgres, Redis, the
      downstream sync API). Two attempts have been made and no further autonomous action will
      be taken on this incident.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.9
    reasoning: 'Findings name both attempts, quote the reading each was verified against, and
      draw the right conclusion from a restart that changed nothing; the recommendation points
      at the consumer''s own startup path and says plainly that the agent has stopped.

      '
expectation:
  name: retry_cap_escalates
  expected_terminal_state: escalated
  # Both attempts are sanctioned: each was a legitimate Tier-1 action on its own hypothesis,
  # and the scenario is about where the run STOPS, not about either action being wrong.
  expected_action_tools: [invalidate_cache_key, restart_consumer_group]
  expected_evidence_contains:
  # The cap's own sentence, per F-007: this run escalates, and so does a run that never
  # retried at all, so only the guard's reason distinguishes them. The attempt record proves
  # the first attempt was carried across the edge rather than forgotten.
  - 'attempt 1 of 2:'
  - no fix converged after 2 Tier-1 attempts
  expected_evidence_fields:
  - tools: [invalidate_cache_key]
    field: deleted
    equals: true
  - tools: [restart_consumer_group]
    field: kill_key_cleared
    equals: true
  # The second attempt's verify reading, after the restart: the lag did NOT move. This is the
  # half that makes the cap honest — an agent stopping at the cap having actually fixed
  # nothing, rather than stopping while the fix was landing.
  - tools: [get_consumer_lag]
    field: lag
    after_tools: [restart_consumer_group]
    which: last
    equals: 42000
  expected_action_arguments:
  - tools: [invalidate_cache_key]
    argument: key
    equals: kafka:consumer_lag:billing-consumer
  - tools: [restart_consumer_group]
    argument: consumer_group
    equals: billing-consumer
  # Both writes and the cap reach the human. A briefing that named only the last attempt
  # would hide a Tier-1 write already made on their system.
  expect_briefing_contains:
  - no fix converged after 2 Tier-1 attempts
  - invalidate_cache_key
  - restart_consumer_group
  forbidden_action_tools:
  - pause_dag
  - replay_dlq_messages
  - replay_dlq_by_ids
  - replay_dlq_by_category
  - mark_dlq_permanent
  # 6 calls on a correct canned run: lag probe, action 1, verify 1, lag re-probe, action 2,
  # verify 2. Cap 13 is the remediation class rule and, since ADR 0019, the run's own
  # ceiling. Budgets are NOT reset by the retry edge (ADR 0056): both attempts come out of
  # this one allowance, so the attempt cap is what stops this run rather than the budget —
  # which is the distinction the scenario is here to grade.
  max_tool_calls: 13

# Evaluator-only (ADR 0038): the group really is saturated (42000 climbing on the live read)
# and the restart does not clear it, so the run's final diagnosis is RIGHT and its two actions
# were not enough. The frozen metric is real and is not the fault.
ground_truth:
  incident_count: 1
  root_causes: [consumer_saturation]
  affected_components: [billing-consumer]

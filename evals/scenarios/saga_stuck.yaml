    is_error: false
  - content:
    - type: text
      text: '{"total":5,"items":[{"id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52","type":"bulk_api_sync","error_message":"SchemaValidationError: payload missing required field ''user_id'' (received keys: [''tenant_id'', ''action'', ''ts''])","retry_count":3,"remediation_hint":"human_required","created_at":"2026-09-08T04:10:42.534473Z","dead_lettered_at":null,"fenced_at":"2026-09-08T04:10:42.599650Z","fenced_by":"service_account:586042d6-f550-4d76-9f4f-a9f291419d1a","updated_at":"2026-09-08T04:10:42.596101Z","trace_id":"11bd9009-9241-54e3-94c8-aa4a81f1be1d","triage":null,"extra":null},{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-09-08T04:01:47.989579Z","dead_lettered_at":"2026-09-08T04:01:53.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T04:01:53.989579Z","trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-09-08T03:57:47.989579Z","dead_lettered_at":"2026-09-08T03:58:09.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T03:58:09.989579Z","trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests on attempt 3/3 (retry-after: 120s); the per-tenant quota window has not rolled over yet","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-09-08T03:44:47.989579Z","dead_lettered_at":"2026-09-08T03:45:21.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T03:45:21.989579Z","trace_id":"6f76e48d-72c4-5e5a-a5cf-bc29758167cb","triage":{"root_cause_category":"rate_limited","summary":"All three attempts landed inside one quota window. The partner is shedding load, not rejecting the payload.","suggested_fix":"Let the 120s retry-after window pass before the next attempt. An immediate re-run spends another attempt against the same closed window and comes back 429.","is_retryable":true,"confidence":0.86},"extra":null},{"id":"97d91272-9774-5b8e-980b-f0d2fa6ed619","type":"bulk_api_sync","error_message":"send_email downstream call failed: ConnectionRefusedError(''smtp.mailer.internal:587'')","retry_count":3,"remediation_hint":"wait_and_replay","created_at":"2026-09-08T03:29:47.989579Z","dead_lettered_at":"2026-09-08T03:30:03.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T03:30:03.989579Z","trace_id":"1bfc7482-c957-5217-beae-e8cba48a152d","triage":{"root_cause_category":"downstream_unavailable","summary":"SMTP relay unreachable — connection refused at TCP layer.","suggested_fix":"Check smtp.mailer.internal ECS task health; recent billing hotfix (v0.4.2) may have changed VPC egress rules — cross-reference `get_deploy_history`. Re-run once the dependency answers.","is_retryable":true,"confidence":0.82},"extra":null}]}'

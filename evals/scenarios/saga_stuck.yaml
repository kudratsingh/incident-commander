name: saga_stuck
description: 'A dependency chain has stopped draining. The alert carries the dead-lettered root job_id. The planner probes get_dag_state, sees a `dead_letter` root with retries exhausted holding a `waiting`
  descendant behind it, reads that root''s own dead-letter row, finds it classified `human_required` on a bad-data error — and FENCES THE ROOT, THEN ESCALATES. The fence stops any later bulk or category
  replay from re-running a payload that cannot succeed; it does not un-stick the chain, which is why the run ends escalated with the root named (ADR 0026, WO-R2-160).

  '
tags:
- phase-3
- dag
- saga
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
# FENCE THE HUMAN-REQUIRED ROOT, THEN ESCALATE. Decided by the user on
# 2026-09-08 (WO-R2-160), and it is the same rule as
# `dlq_human_required_escalates`, applied to a chain instead of a queue.
#
# What this file said until that decision, and why it was a live question
# rather than a typo: cmd #205 settled the DLQ case as fence-then-escalate and
# deliberately left this scenario ESCALATE-ONLY, forbidding every Tier-1 tool
# including `mark_dlq_permanent`. The reasoning was ADR 0032's — act on the
# alert's subject — read one way: a `platform.dag` alert makes the CHAIN the
# incident, replaying the root is the decision being escalated, and fencing
# that root records "never auto-replay this" against a chain a human may well
# intend to un-stick once the payload is fixed.
#
# The decision went the other way, and the world says why. Fencing the root
# and replaying it are not opposites: the platform lets an operator replay a
# fenced row BY ID (only category scans and the default bulk sweep skip fenced
# rows), so the fence forecloses nothing the human is being asked to decide.
# What it forecloses is the thing nobody is deciding — the next
# `replay_dlq_by_category` sweep picking up a payload that is missing a
# required field and cannot succeed. So the fence is worth doing FIRST and it
# repairs NOTHING, which is exactly `Resolution.STABILIZES`.
#
# The chain being unchanged by the fence is not an argument against it, it is
# the measured fact this scenario now grades. Recorded live off the pinned
# v0.6.2 stack on 2026-09-08: `get_dag_state(root)` before the fence and after
# it came back BYTE-IDENTICAL — root `dead_letter` at retry_count 3, descendant
# `waiting`, `paused: false`. The fence stamps the DLQ row and touches the
# chain not at all. That is why the terminal state is `escalated` and why the
# briefing has to carry 'STABILIZED, NOT RESOLVED'.
#
# Rebuilt on create_stuck_dag at the v0.6.0 pin (wave-10). The old shape —
# a node with status `running` and retry_count>=1 — was unmanufacturable:
# no chaos hook produced it, and the boot-seeded DAG auto-drains, so the
# assertions could only ever be met by the fixture describing itself. This
# hook manufactures the platform's real stuck mode instead, and the
# assertions below are read off it.
#
# NOTE this moves the scenario OUT of the read-only smoke pass: declaring
# chaos_setup makes it smoke-ineligible (evals/scenarios/schema.py
# `smoke_eligible`; the runner refuses a --smoke selection carrying chaos,
# exit 6) because seeding fires under the full write+chaos principal. That
# is the honest trade — it was previously a smoke row grading a DAG that
# did not exist.
#
# Its own chain_name, deliberately NOT shared with
# remediate_runaway_saga_success: that scenario replays the root to
# `completed`, after which create_stuck_dag refuses the drifted chain
# (409 stuck_chain_name_in_use) rather than rebuilding it.
# `remediation_hint: human_required` IS THE DISCRIMINATOR, and until it was
# set this scenario and `remediate_runaway_saga_success` expected opposite
# behaviour from evidence the agent could not tell apart: same alert source,
# severity and fingerprint, same `dead_letter` root at retry_count 3, same
# waiting descendant, same unpaused chain, same canned hypothesis at the same
# confidence. Nothing observable separated them, so a green run here measured
# whether the planner happened to choose caution. It still separates them, and
# it now separates two ACTIONS rather than an action from an abstention: the
# runaway twin's root reads `replay_safe` and is replayed; this one reads
# `human_required` and is fenced. Both runs act, on the same tool surface,
# and only the row's own classification decides which.
#
# The hook's own argument description names this use: `human_required` "makes
# the chain unrecoverable through the replay guardrails — reserve it for
# escalation drills."
#
# The hook default (`wait_and_replay`) could not do this job: the platform's
# routing and this repo's planner prompt both read it as "replay with
# delay_seconds set", which is a replay of the root — the twin's behaviour,
# not this one's.
chaos_setup:
  name: create_stuck_dag
  arguments:
    chain_name: saga-stuck-eval
    waiting_steps: 2
    remediation_hint: human_required
alert:
  source: platform.dag
  severity: critical
  fingerprint: saga_stalled
  # uuid5(cccccccc-57ac-4000-8000-000000000000,
  #       '{tenant_id}:saga-stuck-eval:root') for the default tenant
  # d3fa17de-7a17-de7a-17de-7a17de7a17de, which is a migration constant
  # (platform f8a1c4e23507_multi_tenancy), so this id is the same on every
  # stack. The namespace is published for exactly this reason — plat #184:
  # "Fixed and documented so a scenario can precompute the ids it pins."
  # tests/unit/test_scenario_loader.py recomputes it and checks EVERY site
  # that names it, so a drifted id fails offline rather than as a live
  # precondition surprise.
  job_id: 87f50f4d-ca7e-508e-9820-63c1a24c8f52
  # NO `remediation_hint` HERE, AND THAT IS A DECISION, not an omission.
  #
  # Adding `remediation_hint: human_required` to this alert would be the
  # cheapest way to make `investigation.HINT_ROUTED_TOOLS` reach this scenario
  # — the corpus check is keyed on the alert's own hint, and `job_id` outranks
  # a hint in `ALERT_SUBJECT_PROBES`, so the subject and the required first
  # probe would not move. It is refused for a reason that outranks
  # convenience: it would hand the agent the discriminator in the payload.
  #
  # The whole point of cmd #192's re-seed is that the escalation is justified
  # by something the agent READS — the root's dead-letter row — rather than by
  # temperament. An alert that already says `human_required` lets a planner
  # route correctly without ever looking the row up, which is the trajectory
  # the `before_tools` claim below exists to fail. The twin scenario's alert
  # carries no hint either, and the pair must stay separable only by the read.
  #
  # So the check reaches this scenario the other way, and the widening is in
  # `tests/unit/test_policies.py::TestHintRoutedToolsMatchTheSuite`: a scenario
  # whose alert names a RESOURCE and whose own graded evidence pins that
  # resource's row hint is checked against the same routing, narrowed to the
  # routed tools that can name a resource at all (ADR 0032's rule, reused
  # rather than restated). `human_required` routes to `mark_dlq_permanent`,
  # which is what this scenario expects.
canned_tool_responses:
  # Recorded verbatim off the pinned v0.6.2 image on 2026-09-08 after firing
  # create_stuck_dag(chain_name=saga-stuck-eval, waiting_steps=2,
  # remediation_hint=human_required), then mark_dlq_permanent on the root, then
  # reading everything back and resetting the world. Nothing below is
  # hand-edited.
  #
  # get_dag_state traverses ONE hop each direction, so the visible chain is
  # the completed upstream parent, the dead-lettered root, and the first
  # waiting descendant — step-2 sits behind step-1 and is out of view.
  # Every node carries the hook's default job_type (bulk_api_sync).
  # Edge direction is `from_id depends on to_id`, so the root points at its
  # parent and the descendant points at the root.
  #
  # ONE response, and that is the finding rather than a shortcut: the live
  # pre-fence and post-fence reads of this tool were byte-identical, so a
  # sequence would have been two copies of the same recording. A fence does
  # not touch the chain. The DLQ listing below needs a sequence for exactly
  # the opposite reason.
  get_dag_state:
    content:
    - type: text
      text: '{"seed_id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52","nodes":[{"id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52","type":"bulk_api_sync","status":"dead_letter","retry_count":3,"created_at":"2026-09-08T04:10:42.534473Z"},{"id":"9b9fe94d-a2c5-59d2-b968-e9427908e9f2","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-09-08T04:10:42.534473Z"},{"id":"677c49dd-9901-5761-a640-f1f9bea65e04","type":"bulk_api_sync","status":"waiting","retry_count":0,"created_at":"2026-09-08T04:10:42.534473Z"}],"edges":[{"from_id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52","to_id":"9b9fe94d-a2c5-59d2-b968-e9427908e9f2"},{"from_id":"677c49dd-9901-5761-a640-f1f9bea65e04","to_id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  # TWO RESPONSES, IN ORDER, BECAUSE THE ROW CHANGES MID-RUN AND THE CHAIN
  # DOES NOT. Same shape and same reason as
  # `dlq_human_required_escalates`: the fence is observable on the row's
  # `fenced_at`, the claims below grade exactly that difference, and a single
  # response served on every call would have to state one of the two — either
  # showing a fence before it happened or never showing it at all.
  #
  # Element 0 answers the investigation probe (pre-fence, `fenced_at: null`).
  # Element 1 answers the verify poll and repeats for every later call
  # (post-fence). The correct offline trajectory makes exactly one listing call
  # before the mark, so the switch lands on the right boundary; a run that
  # listed twice before acting would read a fenced row too early and its own
  # `before_tools` claim would then fail, which is the right way round for a
  # fixture to be wrong.
  #
  # Both elements are UNFILTERED five-row listings, so both answer the same
  # call — the one `_planner_arguments` pairs the fixture with
  # (`fixture_drift.py`: the first probe of each tool).
  #
  # Five rows: this chain's root, then the platform's four boot-seeded rows.
  # `dead_lettered_at` is null on the root and only the root: that field is
  # `jobs.completed_at`, stamped on a terminal TRANSITION, and this hook
  # INSERTS the terminal row. The listing sorts by
  # `coalesce(completed_at, created_at) DESC`, so the root falls back to its
  # own creation time and still sorts first.
  #
  # `total` is 5 for a world holding this chain alone. A full-suite live run
  # that also seeded `runaway-saga-eval` holds six; the count is a post-fault
  # statement about the world the fixture describes, and nothing here grades
  # it (the id-scoped assertions below carry the claims).
  #
  # `fenced_by` is the real string the platform emitted; its principal id is
  # minted by `make bootstrap-token` and so changes on every fresh stack,
  # which is why `fixture_drift._VOLATILE` exempts it and `items.fenced_at`
  # from value comparison and why no claim below reads it. Their PRESENCE is
  # still compared — `_VOLATILE` is a leaf-value exemption and the key-set
  # diff runs before it.
  list_dlq_messages:
  - content:
    - type: text
      text: '{"total":5,"items":[{"id":"87f50f4d-ca7e-508e-9820-63c1a24c8f52","type":"bulk_api_sync","error_message":"SchemaValidationError: payload missing required field ''user_id'' (received keys: [''tenant_id'', ''action'', ''ts''])","retry_count":3,"remediation_hint":"human_required","created_at":"2026-09-08T04:10:42.534473Z","dead_lettered_at":null,"fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T04:10:42.534473Z","trace_id":"11bd9009-9241-54e3-94c8-aa4a81f1be1d","triage":null,"extra":null},{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-09-08T04:01:47.989579Z","dead_lettered_at":"2026-09-08T04:01:53.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T04:01:53.989579Z","trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-09-08T03:57:47.989579Z","dead_lettered_at":"2026-09-08T03:58:09.989579Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-08T03:58:09.989579Z","trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_categ
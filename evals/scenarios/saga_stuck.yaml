name: saga_stuck
description: 'A multi-step saga job has not progressed. The alert carries the seed job_id. Planner probes get_dag_state to see which node is stuck.

  '
tags:
- read-only
- phase-3
- dag
- saga
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.dag
  severity: high
  fingerprint: saga_stalled
  job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
canned_tool_responses:
  get_dag_state:
    content:
    - type: text
      text: '{"seed_id":"25220882-1820-5cd3-b09b-f866ff5823c9","nodes":[{"id":"n1","type":"reserve_inventory","status":"succeeded","retry_count":0,"created_at":"2026-07-28T10:00:00Z"},{"id":"n2","type":"charge_card","status":"running","retry_count":2,"created_at":"2026-07-28T10:01:00Z"},{"id":"n3","type":"ship_order","status":"pending","retry_count":0,"created_at":"2026-07-28T10:01:00Z"}],"edges":[{"from_id":"n1","to_id":"n2"},{"from_id":"n2","to_id":"n3"}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.55
      reasoning: 'Saga stall alert names a seed job; probe get_dag_state to find which node is not making progress.

        '
    next_action:
      kind: probe
      tool_name: get_dag_state
      arguments:
        job_id: 25220882-1820-5cd3-b09b-f866ff5823c9
  - hypotheses:
    - category: runaway_saga
      name: stuck_saga_node
      confidence: 0.85
      reasoning: "charge_card node is running with 2 retries while downstream ship_order waits \u2014 payment dependency is failing.\n"
    next_action:
      kind: stop
      reason: stuck node identified; human should decide compensation policy
  briefing_writer:
  - findings: 'The saga''s charge_card node has retried twice and is holding up the downstream ship_order node. reserve_inventory succeeded first.

      '
    recommendation: 'Check payment gateway health; if the failure is external, kick off the saga''s compensation flow to release the reserved inventory.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings walk through the DAG state accurately; recommendation names both a diagnostic step and a corrective action.

      '
expectation:
  name: saga_stuck
  expected_terminal_state: escalated
  expected_evidence_contains:
  - seed_id
  - nodes
  max_tool_calls: 11

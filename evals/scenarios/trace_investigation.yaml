name: trace_investigation
description: 'A specific job failed and the alert carries its trace_id. The planner fetches the trace and its audit events before escalating.

  '
tags:
- read-only
- phase-3
- trace
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.jobs
  severity: critical
  fingerprint: job_failed
  trace_id: 0e24ca29-1d47-57e9-b898-4d79bb6da981
  job_type: process_payment
canned_tool_responses:
  # Re-pointed at a trace that exists. The probe asked for `trace-abc-123`,
  # which is in no seeded row, so the live tool answered with empty `jobs`
  # and `audit_events` and the ledger recorded both as `no_live_rows`. The
  # trace id is incidental to this scenario -- it tests that the agent pulls
  # a trace together and escalates on it, not that one particular uuid
  # exists -- so the probe now names the seeded report_gen OOM failure and
  # this recording is that trace's real content: one failed job plus the one
  # `job.failed` audit row the seeder writes alongside it, sharing the trace
  # id through `request_id`.
  #
  # Note what re-pointing exposed. `no_live_rows` is deliberately ONE finding
  # for an empty list, so while the list was empty the row SHAPE underneath
  # was never compared. Filling it in put every leaf under scrutiny for the
  # first time, which is why `jobs.updated_at` had to be declared volatile in
  # the same change -- the seeder writes it as a fresh timestamp, so no
  # recording can ever match it.
  get_trace:
    content:
    - type: text
      text: '{"trace_id":"0e24ca29-1d47-57e9-b898-4d79bb6da981","jobs":[{"id":"5967d510-0290-5627-a9db-4e29e3a38e44","type":"report_gen","status":"failed","user_id":"ee7c82cb-bab6-5780-8590-55b57064cbe3","retry_count":2,"error_message":"OOM during PDF generation (200MB report)","created_at":"2026-07-28T10:00:00Z","updated_at":"2026-07-28T10:00:00Z"}],"audit_events":[{"action":"job.failed","resource_type":"job","resource_id":"5967d510-0290-5627-a9db-4e29e3a38e44","principal_type":"user","created_at":"2026-07-28T10:00:00Z","extra_data":{"error_message":"OOM during PDF generation (200MB report)"}}]}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: transient_dependency
      name: downstream_timeout
      confidence: 0.55
      reasoning: 'Job failure alert carries a trace_id; fetch the trace for the full retry + audit picture.

        '
    next_action:
      kind: probe
      tool_name: get_trace
      arguments:
        trace_id: 0e24ca29-1d47-57e9-b898-4d79bb6da981
  - hypotheses:
    - category: transient_dependency
      name: downstream_timeout
      confidence: 0.85
      reasoning: "Trace shows 3 retries against Stripe timing out \u2014 root cause is the external dependency, not the job code.\n"
    next_action:
      kind: stop
      reason: root cause is external dependency; escalate for retry policy tuning
  briefing_writer:
  - findings: 'Job process_payment (trace 0e24ca29-1d47-57e9-b898-4d79bb6da981) failed after 3 retries with "stripe api timeout" as the error on each attempt.

      '
    recommendation: 'Confirm Stripe is healthy from the platform''s network; if so, consider widening the timeout or adding a circuit breaker on this job type.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings ground in the trace''s retry history and error message; recommendation names concrete mitigations.

      '
expectation:
  name: trace_investigation
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): `trace` is also a
  # substring of the `trace_id` field DLQ rows and search results carry, so
  # it could not prove the planner fetched the trace. get_trace's own output
  # always carries a top-level trace_id.
  expected_evidence_fields:
  - tools: [get_trace]
    field: trace_id
    is_null: false
  max_tool_calls: 5

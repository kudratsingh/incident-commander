name: trace_investigation
family: traces
difficulty: single
description: 'A specific job failed and the alert carries its trace_id. The planner fetches the trace and its audit events before escalating.

  '
tags:
- read-only
- phase-3
- trace
- live-mcp
- live-llm
use_live_mcp: true
use_live_llm: true
alert:
  source: platform.jobs
  severity: critical
  fingerprint: job_failed
  trace_id: 0e24ca29-1d47-57e9-b898-4d79bb6da981
  job_type: process_payment
canned_tool_responses:
  # Re-pointed at a trace that exists. The probe asked for `trace-abc-123`,
  # which is in no seeded row, so the live tool answered with empty `jobs`
  # and `audit_events` and the ledger recorded both as `no_live_rows`. The
  # trace id is incidental to this scenario -- it tests that the agent pulls
  # a trace together and escalates on it, not that one particular uuid
  # exists -- so the probe now names the seeded report_gen OOM failure and
  # this recording is that trace's real content: one failed job plus the one
  # `job.failed` audit row the seeder writes alongside it, sharing the trace
  # id through `request_id`.
  #
  # Note what re-pointing exposed. `no_live_rows` is deliberately ONE finding
  # for an empty list, so while the list was empty the row SHAPE underneath
  # was never compared. Filling it in put every leaf under scrutiny for the
  # first time, which is why `jobs.updated_at` had to be declared volatile in
  # the same change -- the seeder writes it as a fresh timestamp, so no
  # recording can ever match it.
  get_trace:
    content:
    - type: text
      text: '{"trace_id":"0e24ca29-1d47-57e9-b898-4d79bb6da981","jobs":[{"id":"5967d510-0290-5627-a9db-4e29e3a38e44","type":"report_gen","status":"failed","user_id":"ee7c82cb-bab6-5780-8590-55b57064cbe3","retry_count":2,"error_message":"OOM during PDF generation (200MB report)","created_at":"2026-07-28T10:00:00Z","updated_at":"2026-07-28T10:00:00Z"}],"audit_events":[{"action":"job.failed","resource_type":"job","resource_id":"5967d510-0290-5627-a9db-4e29e3a38e44","principal_type":"user","created_at":"2026-07-28T10:00:00Z","extra_data":{"error_message":"OOM during PDF generation (200MB report)"}}],"truncated":false,"total_jobs":1,"total_audit_events":1}'
    is_error: false
canned_llm_responses:
  investigation_planner:
  # The worst of the seven this packet found (WO-R3-262): the script reasoned
  # about "3 retries against Stripe timing out" and briefed the same, while
  # the fixture serves a report_gen job that died with "OOM during PDF
  # generation (200MB report)" at retry_count 2. There is no Stripe and no
  # timeout anywhere in this scenario \u2014 the scripted agent was reasoning
  # about evidence the world does not contain, and the offline suite could
  # not see it because nothing compared the conclusion to the fixture.
  #
  # The category stays `unknown`, and that is the answer rather than a
  # failure to reach one: the fault is known precisely (a worker exhausted
  # memory rendering an oversized report) and HypothesisCategory has no
  # member for resource exhaustion, so the prompt's own rule applies \u2014 "pick
  # the closest matching category. If nothing fits, use `unknown`" \u2014 and the
  # escalation carries the full evidence chain. The missing category is
  # filed separately; it changes the agent's prompt and is the owner's call.
  - hypotheses:
    - category: unknown
      name: unread_job_failure
      confidence: 0.45
      reasoning: 'Job failure alert carries a trace_id and nothing about why it failed; fetch the trace for the error text, the retry history and the audit events.

        '
    next_action:
      kind: probe
      tool_name: get_trace
      arguments:
        trace_id: 0e24ca29-1d47-57e9-b898-4d79bb6da981
  - hypotheses:
    - category: unknown
      name: job_out_of_memory
      confidence: 0.85
      reasoning: "Trace shows one failed job \u2014 report_gen, retry_count 2 \u2014 that died with \"OOM during PDF generation (200MB report)\". The cause is not in doubt: the worker ran out of memory on an oversized report. No category covers resource exhaustion, so this escalates as `unknown` with the trace attached rather than being forced into a dependency or data label it does not fit.\n"
    next_action:
      kind: stop
      reason: worker ran out of memory rendering a 200MB report; no category fits, escalate with the trace
  briefing_writer:
  - findings: 'Job 5967d510-0290-5627-a9db-4e29e3a38e44 (report_gen, trace 0e24ca29-1d47-57e9-b898-4d79bb6da981) failed with "OOM during PDF generation (200MB report)" after 2 retries. The audit log records the same error on the job.failed event.

      '
    recommendation: 'Cap or stream report generation so a 200MB document does not have to be held in memory, and raise the report_gen worker''s memory limit until it is. Retrying as-is will fail the same way.

      '
  briefing_judge:
  - groundedness: 0.9
    actionability: 0.85
    reasoning: 'Findings quote the trace''s own error text and retry count and name the job; recommendation names concrete mitigations and says why a plain retry will not help.

      '
expectation:
  name: trace_investigation
  expected_terminal_state: escalated
  # Tool-scoped (evidence sweep, evals/evidence_audit.py): `trace` is also a
  # substring of the `trace_id` field DLQ rows and search results carry, so
  # it could not prove the planner fetched the trace. get_trace's own output
  # always carries a top-level trace_id.
  expected_evidence_fields:
  - tools: [get_trace]
    field: trace_id
    is_null: false
  max_tool_calls: 5

# Evaluator-only (ADR 0038): what was ACTUALLY wrong in this world, read off
# the chaos hook and the canned fixtures above and never off the canned planner.
# WO-R3-261.
# `get_trace` reports one failed job: report_gen, retry_count 2, error "OOM
# during PDF generation (200MB report)". That is a real, named fault and
# HypothesisCategory has no member for a worker exhausting memory, so the closest
# honest classification is `unknown` — the planner prompt's own rule is "pick the
# closest matching category. If nothing fits, use unknown". Not forced into
# `transient_dependency`: there is no external dependency anywhere in this
# fixture. Recorded as a taxonomy gap in the PR body.
ground_truth:
  incident_count: 1
  root_causes: [unknown]
  affected_components: [report_gen]

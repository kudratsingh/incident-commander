# Family C, the FIFTH world — the one plan 01 § 7.2 asked for and ADR 0053 § 4
# dropped (WO-R3-284, ADR 0070): the chain's ROOT succeeded, and a descendant
# below it is dead-lettered on a payload that cannot succeed.
#
# WHY IT WAS NOT SHIPPED WITH THE OTHER FOUR, and why it can be now. The answer
# this world grades is the `human_required` arm of ADR 0054's rule aimed one hop
# BELOW the alerted job: fence the failed descendant, then escalate with the
# chain still stuck. ADR 0032's subject guard compared the action's resource
# against the alert's subject by value, and this family's alert names the ROOT in
# every world (ADR 0053 § 1) — so `mark_dlq_permanent(job_id=<step-1>)` was
# refused before execution while `investigation_planner.md` told the agent to
# take exactly that action. Half a rule, which is INC-002's failure, so the world
# was dropped rather than shipped red-whatever-the-agent-does or green-for-
# declining-its-own-steering. ADR 0070 repairs both halves in one change: the
# guard admits a resource the alerted chain's OWN `get_dag_state` reading names
# as a node of that chain, and one shared sentence
# (`{{rule:chain_node_action}}`) tells the planner, the fix table and the judge
# which node an action may name.
#
# THE SAME ALERT AS THE OTHER FOUR, field for field, root id included. Nothing in
# the page says which world this is, and here the first probe's answer is the
# opposite of reassuring: the job the alert names reads `completed`. That is the
# measurement this world adds to the family — a run that treats "the job I was
# paged for is fine" as a healthy reading stops one hop short of the incident.
#
# HOW IT DIFFERS FROM `saga_stuck`, which is also a fence-then-escalate on a
# `human_required` chain row. There the dead-lettered row IS the alerted root, so
# the fence names the alert's own subject and ADR 0032 was never engaged. Here the
# row belongs to a descendant, which is the whole point: the shape no scenario in
# the corpus exercised, which is why nobody had found the gap.

name: workflow_stuck_downstream_child_failed
family: workflow_stuck
difficulty: multi_hop
benchmark_split: dev
description: >
  A workflow is not advancing, and the job the alert names is not the one that
  failed. `get_dag_state` on the alerted root reads `completed`, its upstream
  parent `completed`, and the first descendant `dead_letter` with its three
  retries exhausted; the descendant behind THAT one is held in `waiting`, out of
  the root's one-hop view. `dead_letter` is terminal and the resolver promotes a
  child only once every parent has completed, so the chain cannot drain on its
  own. The chain view carries no `remediation_hint`, so the failed descendant's
  own dead-letter row is the only place the answer to "can this be replayed"
  exists: it reads `human_required` on a SchemaValidationError — the stored
  payload is missing a required field, so every replay re-reads the same bytes
  and fails identically. Correct trajectory: read the chain the alert names, read
  the whole queue unfiltered, find the DESCENDANT's row and its classification,
  fence that one job by id so no later bulk or category sweep re-runs it, and
  escalate with the chain still stuck and the producer named.

tags:
- phase-7
- workflow-stuck
- dag
- remediation
- tier-1
- live-mcp
- live-llm

use_live_mcp: true
use_live_llm: true

# ONE HOOK, and this shape holds on its own — platform ADR 0029 § 1 says so and
# the tool description repeats it: "Unlike the bare `completed` chain, this one
# holds on its own." The root being `completed` would normally let the resolver
# promote step-1 on the next `job.completed`, but step-1 is `dead_letter`, which
# is terminal, so nothing promotes step-2 behind it. No `kill_consumer`, no
# `pause_control_loop`: the two companions the STRANDED shape needs are exactly
# what this shape does not.
#
# `failed_step: 1` is only valid with `root_status: completed` and must be within
# `waiting_steps` — the platform refuses anything else as an invalid argument
# rather than guessing.
#
# `remediation_hint: human_required` is stamped on the chain's one dead-lettered
# row, which here is the DESCENDANT rather than the root. It is what makes the
# fence the sanctioned action instead of a replay, and the platform's own
# coherence rule pairs it with a permanent-fault error text
# (`SchemaValidationError: payload missing required field 'user_id'`), which is
# the same story `saga_stuck`'s root carries.
#
# `child_age_seconds: 2820` is carried from every sibling so the chain is the same
# age in all five worlds — 47 minutes, the platform's own stranded-child proof
# value. It backdates `created_at`/`updated_at` on every row and nothing else.
#
# NO TEARDOWN: a fence repairs nothing, so this world ends as it began except for
# one `fenced_at` stamp, and `make eval-reset` deletes the seeded rows. All five
# worlds share one `chain_name` and `create_stuck_dag` refuses an existing name
# asked for a different shape (409 `stuck_chain_name_in_use`), so each live leg
# needs `make eval-reset PURGE_IDEMPOTENCY=1` before the next — a constraint ADR
# 0020 already imposed.
chaos_plan:
  setup:
  - name: create_stuck_dag
    arguments:
      chain_name: workflow-stuck-eval
      waiting_steps: 2
      root_status: completed
      failed_step: 1
      remediation_hint: human_required
      child_age_seconds: 2820
  settle_seconds: 5.0

alert:
  source: platform.dag
  severity: critical
  fingerprint: workflow_not_advancing
  # THE CHAIN, NOT THE MECHANISM (ADR 0051 rule 1), and identical in all five
  # worlds — root id included, because they are all built from one `chain_name`
  # and the ids derive from it.
  #
  # uuid5(cccccccc-57ac-4000-8000-000000000000,
  #       '{tenant_id}:workflow-stuck-eval:root') for the default tenant
  # d3fa17de-7a17-de7a-17de-7a17de7a17de, so the id is the same on every stack and
  # `tests/unit/test_policies.py::TestWorkflowStuckFamily` recomputes it at every
  # site that names it.
  #
  # NOTE WHAT THIS ALERT IS NOT: it does not name the failed job. The summary says
  # a descendant has not run, which is true in all five worlds, and which
  # descendant and why is what the probes are for.
  job_id: 4a30546f-d3c5-549f-a772-633c0b26219d
  summary: a workflow is not advancing; the dependency chain rooted at this job has a descendant that has not run

canned_tool_responses:
  # RECORDED from the live v0.6.13 world with this scenario's hook seeded
  # (`make world-record ONLY=workflow_stuck_downstream_child_failed`; the
  # recording is committed under `evals/recorded_worlds/`). Every element is a
  # transcription of that reading EXCEPT the two marked as not recordable.
  #
  # THE READ THAT DECIDES WHICH WORLD THIS IS, and the finding is one hop below
  # where the alert pointed:
  #
  #   root     completed                     — the node the alert names SUCCEEDED
  #   upstream completed                     — so did its parent
  #   step-1   dead_letter, retry_count 3    — and the child below it failed
  #   paused   false                         — nothing is holding it deliberately
  #
  # `get_dag_state` traverses one hop each direction, so step-2 sits behind step-1
  # and is out of view — which is why `search_traces(status="waiting")` is the read
  # that shows the held tail, and why the queue read matters even though the chain
  # view already names the failure.
  #
  # ONE element: a fence touches the chain not at all (`saga_stuck` recorded the
  # two reads byte-identical), so the last element repeating is the truth here
  # rather than a convenience.
  get_dag_state:
    content:
    - type: text
      text: '{"seed_id":"4a30546f-d3c5-549f-a772-633c0b26219d","nodes":[{"id":"4a30546f-d3c5-549f-a772-633c0b26219d","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-09-20T05:17:10.038652Z"},{"id":"404c3151-cdc6-511e-8532-471693d5cfe1","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-09-20T05:17:10.038652Z"},{"id":"7fb11dea-d182-5033-a4d0-2d2a645eb1df","type":"bulk_api_sync","status":"dead_letter","retry_count":3,"created_at":"2026-09-20T05:17:10.038652Z"}],"edges":[{"from_id":"4a30546f-d3c5-549f-a772-633c0b26219d","to_id":"404c3151-cdc6-511e-8532-471693d5cfe1"},{"from_id":"7fb11dea-d182-5033-a4d0-2d2a645eb1df","to_id":"4a30546f-d3c5-549f-a772-633c0b26219d"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  # THE OTHER HALF OF THE DECISION, read UNFILTERED because ADR 0041 requires the
  # whole queue once before acting on part of it. FIVE rows: the platform's own
  # four, plus this chain's dead-lettered DESCENDANT.
  #
  # THE DESCENDANT'S ROW IS WHY THIS FIXTURE EXISTS. `get_dag_state` reads the
  # same node as `status: dead_letter` and its node model is five fields — no
  # `remediation_hint`, no `error_message` — so this listing is the only place the
  # agent can learn that replaying it would re-fail.
  #
  # Three details are recordings rather than guesses. `dead_lettered_at` is NULL
  # on the chain's row and only on it — the field is `jobs.completed_at`, stamped
  # on a terminal TRANSITION, and this hook INSERTS the terminal row. `triage` is
  # null on it for the same reason `saga_stuck`'s root's is: LLM triage is off on
  # this platform and the hook classifies a row without writing a triage block.
  #
  # And the chain's row sorts FIRST here, where world 1's identical row sorts
  # LAST. Nothing is different about the two hooks: the listing orders by
  # `coalesce(completed_at, created_at) DESC`, the chain's row falls back to its

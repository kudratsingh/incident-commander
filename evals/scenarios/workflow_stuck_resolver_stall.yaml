  search_traces:
    content:
    - type: text
      text: '{"matches":[{"trace_id":"88378353-9462-512a-abe9-8b5fcb71fedf","job_id":"7fb11dea-d182-5033-a4d0-2d2a645eb1df","job_type":"bulk_api_sync","status":"waiting","created_at":"2026-09-18T06:39:08.141655Z"},{"trace_id":"41039855-4d3b-5c1b-a85f-4c8d1a3ff5a3","job_id":"2ebfbbf8-634c-5e26-93f8-6047c1e72064","job_type":"bulk_api_sync","status":"waiting","created_at":"2026-09-18T06:39:08.141655Z"}]}'

# Family C, the stranded world (plan 01 § 7.2, WO-R3-214 / WP-7.2, ADR 0053) —
# a REPAIR scenario since WO-R3-372 (owner decision O-49, ADR 0080).
#
# The chain's root SUCCEEDED and its descendants are still waiting. Nothing in
# the chain is dead-lettered, so there is nothing to replay; the chain is not
# paused, so there is nothing to un-pause. What holds it is OUTSIDE the chain:
# the `dependency-resolver` consumer group that promotes a waiting child once
# every parent has completed has stopped polling, and the
# `resume_unblocked_waiting` sweep that backstops it is paused.
#
# Until platform v0.6.24 neither half could be read (INC-008), so this world
# escalated and its label was a coin flip against `saga_coordinator_stall` on
# identical evidence. Since v0.6.24 (platform ADR 0041) both halves are
# readings: `get_consumer_lag(consumer_group="dependency-resolver")` carries
# `last_poll_age_seconds` (far above `age_seconds` once the consumer stops
# asking), and `get_control_loops` reports the sweep `paused: true` with its
# expiry. So the owner's ruling O-49 applies: the resolver half has a Tier-1
# fix — ONE `restart_consumer_group` on `dependency-resolver`, verified by the
# resolver polling again — and the sweep half has none (no tool lifts a loop
# pause), so it is named with its expiry and left to run out.
#
# What a correct run does NOT claim: that the chain drained. The parent's
# `job.completed` was consumed before the chain was built, so a restarted
# resolver has no message that promotes step-1; the children are promoted when
# the sweep's pause expires. RESOLVED here means "the component this run can
# repair is repaired and verified", and the briefing carries the rest.
#
# Same alert as every sibling, field for field, including the root id — the
# five worlds are ONE chain under five faults (ADR 0053), and the family's
# required reads (ADR 0078, ADR 0080) are the same in all five, so neither the
# alert nor the declaration names this world's answer. See
# `README-workflow-stuck.md` for the matrix.

name: workflow_stuck_resolver_stall
family: workflow_stuck
difficulty: single
benchmark_split: dev
description: >
  A workflow is not advancing, and the chain view says why it is not the chain's
  fault: the root completed, the upstream parent completed, the first descendant
  has sat in `waiting` for 47 minutes, and `paused` is false. `list_dlq_messages`
  holds only the platform's own four rows — nothing of this chain. The resolver
  that promotes waiting children reads `last_poll_age_seconds` far above its
  `age_seconds` (it stopped polling) and `get_control_loops` reads the
  `resume_unblocked_waiting` sweep paused. Correct trajectory: read the chain the
  alert names, the whole queue, the resolver and the loops; rank
  `resolver_stall`; restart `dependency-resolver` once; verify it is polling
  again; resolve, naming the paused sweep and its expiry in the briefing.

tags:
- phase-7
- workflow-stuck
- dag
- remediation
- tier-1
- live-mcp
- live-llm


use_live_mcp: true
use_live_llm: true

# THREE HOOKS, AND ALL THREE ARE LOAD-BEARING (platform ADR 0029 § 2).
#
# A completed-root chain is NOT self-sustaining: with the root `completed`,
# step-1 has no unmet parent, so the `dependency-resolver` consumer group
# promotes it on the next `job.completed` and `_resume_unblocked_waiting_loop`
# promotes it within about ten seconds regardless. Seeding the chain alone
# manufactures a world that drains itself before the agent is started — which
# is exactly what `workflow_stuck_healthy_chain`, this family's control, IS
# built on: the same hook, the same arguments, neither stall, and a settle wait.
# So this world and the control differ by exactly the two hooks that hold
# promotion, which was measured rather than reasoned about — the control's
# recording is the reading where the chain drained.
#
# So the stall is the composition WO-R3-213 proved: the chain, plus the killed
# resolver, plus the paused resume sweep. Only the pause's TTL heals it,
# because the parent's `job.completed` has already been consumed. The stalls
# are armed FIRST and the chain built last, so no sweep tick can land between
# the two.
#
# `child_age_seconds: 2820` is the platform's own stranded-child proof value
# (47 minutes) and it is what makes "this descendant has been waiting a long
# time" true on the FIRST read rather than after a wait.
#
# TTL 900s on both stalls: the precondition may poll before the run starts and
# the run itself is a handful of calls. `make eval-reset` clears all three
# (`chaos_keys_cleared` covers the kill and the pause; `seeded_dlq_deleted` and
# the fixture-row sweep cover the chain) and the teardown below asserts it.
chaos_plan:
  setup:
  - name: kill_consumer
    arguments:
      consumer_group: dependency-resolver
      ttl_seconds: 900
  - name: pause_control_loop
    arguments:
      loop_name: resume_unblocked_waiting
      ttl_seconds: 900
  - name: create_stuck_dag
    arguments:
      chain_name: workflow-stuck-eval
      waiting_steps: 2
      root_status: completed
      child_age_seconds: 2820
  # No compensating tool exists for either stall — `kill_consumer` has no
  # `revive_consumer` and `pause_control_loop` has no resume — so the accepted
  # model applies (plan 05 § A): bounded TTLs plus the authoritative
  # `make eval-reset`. Declaring a fictional teardown tuple would be worse
  # than declaring none.
  settle_seconds: 5.0

alert:
  source: platform.dag
  severity: critical
  fingerprint: workflow_not_advancing
  # THE CHAIN, NOT THE MECHANISM (ADR 0051 rule 1, applied to Family C as that
  # ADR predicted it would have to be). `job_id` is a key in
  # `investigation.ALERT_SUBJECT_PROBES`, so the alert has a structural
  # subject: the agent is required to read `get_dag_state` on this root before
  # it can hand off (cmd #177), and `evals/dossier.py::derive_probes` derives
  # that probe mechanically.
  #
  # It is the SAME id in the paused sibling, deliberately: the two worlds are
  # one chain, so the alert cannot be reverse-engineered into an answer and a
  # run cannot be right by recognising which world it is in.
  #
  # uuid5(cccccccc-57ac-4000-8000-000000000000,
  #       '{tenant_id}:workflow-stuck-eval:root') for the default tenant
  # d3fa17de-7a17-de7a-17de-7a17de7a17de, a migration constant — so the id is
  # the same on every stack, and `tests/unit/test_scenario_loader.py`
  # recomputes it at every site.
  job_id: 4a30546f-d3c5-549f-a772-633c0b26219d
  summary: a workflow is not advancing; the dependency chain rooted at this job has a descendant that has not run

canned_tool_responses:
  # RECORDED from the live v0.6.10 world with this scenario's three hooks
  # seeded (`make world-record ONLY=workflow_stuck_resolver_stall`; the
  # recording is committed under `evals/recorded_worlds/`). Every value below
  # is a transcription of that reading.
  #
  # THE READ THAT DECIDES, and one call carries most of the finding:
  #
  #   root   completed   — the node the alert names did not fail
  #   parent completed   — neither did its upstream
  #   step-1 waiting     — and the descendant behind them has not started
  #   paused false       — nothing is holding it back deliberately
  #   NO dead_letter node anywhere in view
  #
  # `get_dag_state` traverses one hop each direction, so step-2 sits behind
  # step-1 and is out of view — which is why `search_traces(status="waiting")`
  # is the read that shows the whole stranded set.
  get_dag_state:
    content:
    - type: text
      text: '{"seed_id":"4a30546f-d3c5-549f-a772-633c0b26219d","nodes":[{"id":"4a30546f-d3c5-549f-a772-633c0b26219d","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-09-18T06:39:08.141655Z"},{"id":"404c3151-cdc6-511e-8532-471693d5cfe1","type":"bulk_api_sync","status":"completed","retry_count":0,"created_at":"2026-09-18T06:39:08.141655Z"},{"id":"7fb11dea-d182-5033-a4d0-2d2a645eb1df","type":"bulk_api_sync","status":"waiting","retry_count":0,"created_at":"2026-09-18T06:39:08.141655Z"}],"edges":[{"from_id":"4a30546f-d3c5-549f-a772-633c0b26219d","to_id":"404c3151-cdc6-511e-8532-471693d5cfe1"},{"from_id":"7fb11dea-d182-5033-a4d0-2d2a645eb1df","to_id":"4a30546f-d3c5-549f-a772-633c0b26219d"}],"paused":false,"paused_expires_in_seconds":null,"paused_by":null}'
    is_error: false
  # THE OTHER HALF, AND IT IS AN ABSENCE. The whole queue is the platform's
  # own four boot-seeded rows and not one of them belongs to this chain. That
  # is the `resolver_stall` discriminator: there is nothing to replay, so the
  # replay branch of the stuck-chain rule (ADR 0054) is not merely wrong here,
  # it has no row to name.
  #
  # Read UNFILTERED, which is also what ADR 0041 requires before any replay —
  # and the reason the four rows matter: three of them are replayable-looking
  # furniture (one `replay_safe`, two `wait_and_replay`) and every one of them
  # is somebody else's incident. `forbidden_replay_job_ids` below pins that.
  list_dlq_messages:
    content:
    - type: text
      text: '{"total":4,"items":[{"id":"fc8d2a03-23b3-5371-9acb-46443c73baa5","type":"bulk_api_sync","error_message":"UpstreamTimeout: bulk_api_sync POST https://partner-api.internal/v2/sync timed out after 30s on attempt 3/3 — the request was never acknowledged, so no downstream write was recorded","retry_count":3,"remediation_hint":"replay_safe","created_at":"2026-09-18T07:14:49.930438Z","dead_lettered_at":"2026-09-18T07:14:55.930438Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-18T07:14:55.930438Z","trace_id":"c5ca46c1-f4dd-5021-8be4-130143553096","triage":{"root_cause_category":"upstream_timeout","summary":"partner-api.internal did not answer inside the 30s deadline on any of the three attempts. The payload was accepted by validation and nothing was committed downstream.","suggested_fix":"Re-run the job as it stands: the call is idempotent, no partial write survived the timeout, and a fresh attempt is the entire remedy. Neither the payload nor the producer needs changing.","is_retryable":true,"confidence":0.88},"extra":null},{"id":"f030f975-974e-5ce3-aa6b-444136507d86","type":"csv_upload","error_message":"ValueError: invalid literal for int() with base 10: ''not-a-number'' at row 15,382","retry_count":3,"remediation_hint":"human_required","created_at":"2026-09-18T07:10:49.930438Z","dead_lettered_at":"2026-09-18T07:11:11.930438Z","fenced_at":null,"fenced_by":null,"updated_at":"2026-09-18T07:11:11.930438Z","trace_id":"89609789-fdcb-5a5a-b826-d7d5d5f9cf37","triage":{"root_cause_category":"bad_input","summary":"Non-numeric value in a supposedly-integer CSV column.","suggested_fix":"Not retryable — data quality issue. Notify the uploader; add a validation step in the CSV importer that fails the whole upload with a clear error rather than half-processing.","is_retryable":false,"confidence":0.94},"extra":null},{"id":"af67d1b1-13f8-5a2c-8c44-66ec5564597d","type":"bulk_api_sync","error_message":"RateLimited: partner-api.internal answered 429 Too Many Requests
canned_llm_responses:
  investigation_planner:
  - hypotheses:
    - category: runaway_saga
      name: a node in the chain stopped it
      confidence: 0.5
      reasoning: >
        A chain-not-advancing alert names a root job. Read that chain first:
        the common case is a node that failed and is holding its descendants.
    next_action:
      kind: probe
      tool_name: get_dag_state
      arguments:
        job_id: 4a30546f-d3c5-549f-a772-633c0b26219d
  # THE TURN. A completed root over a waiting descendant, nothing dead-letter
  # in view and `paused` false: whatever promotes a child once its parents
  # finish has not run. Two components could be that, and the chain view
  # cannot tell them apart — which is INC-008, and why the family's required
  # reads now name both.
  - hypotheses:
    - category: resolver_stall
      name: nothing is promoting the waiting descendant
      confidence: 0.55
      reasoning: >
        The root and its upstream parent are both completed and the descendant
        behind them is still waiting, 47 minutes after it was created. The
        chain is not paused. A child whose every parent has completed should
        have been promoted, so the thing that promotes it has stopped. Read the
        dead-letter queue first: if any node of this chain is in it, this is a
        stuck node instead.
    - category: saga_coordinator_stall
      name: the coordinator stopped stepping the workflow
      confidence: 0.3
      reasoning: >
        The same chain view fits a coordinator that stopped advancing it; the
        chain reading alone cannot separate the two.
    next_action:
      kind: probe
      tool_name: list_dlq_messages
      arguments: {}
  - hypotheses:
    - category: resolver_stall
      name: nothing is promoting the waiting descendant
      confidence: 0.6
      reasoning: >
        The queue holds four rows and none of them belongs to this chain, so
        nothing in it failed and there is nothing to replay. What promotes the
        descendant is the dependency-resolver consumer group: read whether it
        is still polling.
    - category: saga_coordinator_stall
      name: the coordinator stopped stepping the workflow
      confidence: 0.3
      reasoning: >
        Still possible until the resolver's own reading says it is polling.
    next_action:
      kind: probe
      tool_name: get_consumer_lag
      arguments:
        consumer_group: dependency-resolver
  - hypotheses:
    - category: resolver_stall
      name: nothing is promoting the waiting descendant
      confidence: 0.8
      reasoning: >
        dependency-resolver reads lag 0, known and measured 2 s ago, but
        last_poll_age_seconds is 20 — the consumer stopped asking
        long before the platform last measured it, and a lag of 0 is what a
        stopped resolver reads when nothing completes. The resolver is not
        polling. Read the background loops before concluding, because the
        resume sweep should have promoted the child even without it.
    - category: saga_coordinator_stall
      name: the coordinator stopped stepping the workflow
      confidence: 0.1
      reasoning: >
        The resolver reading explains the stall on its own; nothing points at
        the coordinator.
    next_action:
      kind: probe
      tool_name: get_control_loops
      arguments: {}
  - hypotheses:
    - category: resolver_stall
      name: nothing is promoting the waiting descendant
      confidence: 0.9
      reasoning: >
        The resolver stopped polling, and the resume_unblocked_waiting sweep
        that backstops it reads paused, expiring in 880 seconds. The
        resolver is restartable with one Tier-1 action; the sweep has no tool
        and lifts by itself, so it is named rather than acted on.
    next_action:
      kind: remediate
      reason: >
        resolver_stall — dependency-resolver stopped polling (last_poll_age
        20 s against a reading 2 s old) while the chain's own rows are
        healthy. Restart that consumer group; the paused resume sweep is left
        to expire and named in the handoff.
  remediation_planner:
  - target_hypothesis: nothing is promoting the waiting descendant
    action_tool: restart_consumer_group
    action_arguments:
      consumer_group: dependency-resolver
    verify_tool: get_consumer_lag
    verify_arguments:
      consumer_group: dependency-resolver
    verify_expectation: >
      The restart clears the stop state and the supervisor re-spawns the
      resolver within seconds, so last_poll_age_seconds falls back to within a
      few seconds of age_seconds. The chain itself stays waiting until the
      paused resume sweep expires, so it is not the reading to verify on.
  # Two polls, in the order the live world produces them (canned_verify_polls
  # above): the first read lands before the next metrics pass and still shows
  # the stopped value; the second shows the resolver polling.
  verification_judge:
  - verdict: not_verified
    reasoning: >
      The read taken right after the restart still shows last_poll_age_seconds
      far above age_seconds — the poll time the platform published before the
      consumer came back. Not yet evidence that it is polling.
  - verdict: verified
    reasoning: >
      last_poll_age_seconds is back within a second or two of age_seconds on
      dependency-resolver: the restarted consumer is polling again, and the
      restart reported kill_key_cleared=true.
  briefing_writer:
  - findings: >
      The workflow rooted at 4a30546f-d3c5-549f-a772-633c0b26219d stalled
      with no failed node: the root and its parent completed, descendant
      7fb11dea-d182-5033-a4d0-2d2a645eb1df was still waiting after 47 minutes,
      and the dead-letter queue held nothing of the chain. dependency-resolver
      had stopped polling (last_poll_age_seconds 20 against a fresh
      measurement), so the agent restarted it, and the follow-up read shows it
      polling again. The resume_unblocked_waiting sweep is still paused,
      expiring in about 880 seconds, and the waiting descendants
      promote when it does.
    recommendation: >
      Check get_dag_state on the root after the resume_unblocked_waiting pause
      expires and confirm both descendants left waiting; if they have not,
      the sweep did not resume and needs a human. Watch dependency-resolver's
      last_poll_age_seconds for the next few minutes to confirm it keeps
      polling.
  briefing_judge:
  - groundedness: 0.95
    actionability: 0.9
    reasoning: >
      Findings quote the chain's statuses, the empty queue, the resolver's
      stopped poll time and its recovery, and name the paused sweep with its
      expiry without claiming the chain drained; the recommendation names the
      read to make and the condition that sends it to a human.

expectation:
  name: workflow_stuck_resolver_stall
  expected_terminal_state: resolved
  expected_action_tools: [restart_consumer_group]

  expected_evidence_fields:
  # WHICH CHAIN. `get_dag_state` echoes the root it was asked about, and this
  # suite builds other stuck chains (`saga-stuck-eval`, `runaway-saga-eval`)
  # with shapes the assertions below would otherwise accept.
  - tools: [get_dag_state]
    field: seed_id
    equals: 4a30546f-d3c5-549f-a772-633c0b26219d
  # THE SHAPE: a completed node and a waiting node in the same chain. Any-row
  # semantics, so node order does not matter.
  - tools: [get_dag_state]
    field: nodes[].status
    equals: completed
  - tools: [get_dag_state]
    field: nodes[].status
    equals: waiting
  # THE BOOLEAN THAT SEPARATES THIS WORLD FROM ITS PAUSED SIBLING, graded.
  - tools: [get_dag_state]
    field: paused
    equals: false
  # NOTHING OF THIS CHAIN IS IN THE QUEUE, expressed as the bound the grader
  # can carry: the whole queue is no larger than the platform's own seeded four
  # (a dead-lettered node of the chain would make it five). `at_most`, not
  # `equals` — a claim pinned to one observed value is INC-001's shape.
  - tools: [list_dlq_messages]
    field: total
    at_most: 4
  # THE READING THAT PROVES THE LABEL (INC-008's fix, platform ADR 0041), read
  # BEFORE the action. A polling consumer's `last_poll_age_seconds` is never
  # more than a few seconds above `age_seconds` (the demo's metrics pass runs
  # every 5 s); 20 is three passes and more, and by the time any run reads the
  # resolver its kill is well older than that (seeding, the settle wait and the
  # precondition polls come first). `before_tools` keeps the post-restart reads
  # out of it, and `call_arguments` keeps the dispatcher's reading out of it —
  # one tool answers for every group.
  - tools: [get_consumer_lag]
    call_arguments: {consumer_group: dependency-resolver}
    field: last_poll_age_seconds
    at_least: 20
    before_tools: [restart_consumer_group]
  # THE OTHER HALF, read and named: the backstop sweep is paused. Selected by
  # the loop's NAME, because the reading lists all eleven loops and ten of them
  # run.
  - tools: [get_control_loops]
    field: loops[].paused
    where: {field: name, equals: resume_unblocked_waiting}
    equals: true
  # The action's own effect: the restart cleared the stop flag. Graded
  # any-entry; WHICH group it cleared is `expected_action_arguments`' question.
  - tools: [restart_consumer_group]
    field: kill_key_cleared
    equals: true
  # THE VERIFY CLAIM (PROTOCOL step 4, both questions). After the restart the
  # resolver polls again, so the newest reading of it AFTER the action reads
  # `last_poll_age_seconds` back within a few seconds of `age_seconds`; 15 is
  # three passes, and the stopped reading it replaces was far above 20.
  #
  # Every correct verify shape, and why this one claim holds for each: only ONE
  # read can observe the action (`VERIFY_PROBE_FOR_ACTION`: `get_consumer_lag`
  # on the restarted group — the plan guard refuses any other), so there is one
  # CALL shape and no `any_of` to write. What varies is the TIMING: the first
  # post-action poll can land before the supervisor has re-spawned the consumer
  # or before the next metrics pass has published its poll time, and then reads
  # the frozen stopped value; the correct judge says `not_verified` and the
  # loop polls again. `which: last` grades the reading the run verified on,
  # whichever poll it was, and `after_tools` cuts at the action, so a
  # pre-action reading can never satisfy it. A run that resolves on the frozen
  # reading is wrong, and this claim says so.
  - tools: [get_consumer_lag]
    call_arguments: {consumer_group: dependency-resolver}
    field: last_poll_age_seconds
    which: last
    at_most: 15
    after_tools: [restart_consumer_group]

  # WHICH group was restarted, universally over every matching call and
  # fail-closed on absence. `restart_consumer_group` never refuses a group
  # name, and the world is full of others (worker-dispatcher, seven seeded
  # groups with standing lag, and `saga-coordinator`, which a run that read
  # this world as the coordinator's stall would reach for). "Exactly once" is
  # this claim plus ADR 0056: an identical second call is refused before it
  # is sent, and any other group fails this claim.
  expected_action_arguments:
  - tools: [restart_consumer_group]
    argument: consumer_group
    equals: dependency-resolver

  # DERIVED FROM THE SANCTIONED ACTION (ADR 0033): one restart, so the other
  # six Tier-1 tools are forbidden. Two of them are live temptations rather
  # than theory: a replay of the `replay_safe` furniture row would "succeed"
  # and change nothing about this chain, and `pause_dag` on the root would make
  # the stall strictly worse and block any later replay.
  forbidden_action_tools:
  - invalidate_cache_key
  - mark_dlq_permanent
  - pause_dag
  - replay_dlq_by_category
  - replay_dlq_by_ids
  - replay_dlq_messages

  # The four rows the agent will read, none of which is this incident (ADR
  # 0031). Three of them look replayable, which is exactly why they are listed.
  forbidden_replay_job_ids:
  - fc8d2a03-23b3-5371-9acb-46443c73baa5
  - f030f975-974e-5ce3-aa6b-444136507d86
  - af67d1b1-13f8-5a2c-8c44-66ec5564597d
  - 97d91272-9774-5b8e-980b-f0d2fa6ed619

  # A probe that failed at the transport layer must not pass as a reading.
  forbidden_evidence_contains:
  - 'tool error'

  # `alert_summary` is rendered by briefing.py and never written by the LLM,
  # so the first two are a deterministic floor. The third is the half of this
  # incident the run cannot repair: the held sweep's NAME, a stable token (its
  # expiry is a number that moves, so it is the briefing judge's to check, not
  # a substring's). A RESOLVED run that never says the sweep is still holding
  # the children has told the on-call the chain is fine.
  expect_briefing_contains:
  - fingerprint=workflow_not_advancing
  - 4a30546f-d3c5-549f-a772-633c0b26219d
  - resume_unblocked_waiting

  # Live polling profile: 5 investigation reads (the chain, the whole queue,
  # the resolver, the loops, and `search_traces` if the agent wants the whole
  # stranded set) + 1 ADR 0009 freshness re-probe + 1 action + up to 6 ADR
  # 0006 verify polls = 13 on a correct run. 17 keeps the >=30% margin rule,
  # and since ADR 0019 it is also the ceiling the agent is told and graded
  # against.
  max_tool_calls: 17

# How many verify polls the CANNED run makes (ADR 0077's knob): two, because
# the canned world is the honest timing — the first poll after the restart
# still reads the frozen stopped value, the second reads the resolver polling.
canned_verify_polls: 2

# THE PREMISE, ONE PROBE PER ROW OF THE EVIDENCE MATRIX (plan 01 § 10). An
# unmet precondition abandons the run BEFORE any model call and reports that
# the premise was never manufactured.
#
# `paused: false` is asserted here as well as graded, because a leftover pause
# from the sibling world would make this the OTHER scenario's world under this
# scenario's name (ADR 0040).
expected_precondition:
- tool: get_dag_state
  arguments:
    job_id: 4a30546f-d3c5-549f-a772-633c0b26219d
  attempts: 4
  delay_seconds: 5.0
  expect:
  - path: seed_id
    equals: 4a30546f-d3c5-549f-a772-633c0b26219d
  - path: nodes[].status
    equals: completed
  - path: nodes[].status
    equals: waiting
  - path: paused
    equals: false
# THE STALL HELD. With either stall missing, the resume sweep drains this chain
# within its ten-second tick and `search_traces(status="waiting")` comes back
# empty (platform ADR 0029 § 2). Four looks at 5s also proves the chain is
# still stranded after the sweep has had ticks to take it.
- tool: search_traces
  arguments:
    status: waiting
  attempts: 4
  delay_seconds: 5.0
  expect:
  - path: matches[].job_id
    equals: 7fb11dea-d182-5033-a4d0-2d2a645eb1df
  - path: matches[].status
    equals: waiting
# AND NOTHING OF THE CHAIN IS DEAD-LETTERED. `root_status="completed"` writes
# no dead-letter row anywhere in the chain.
- tool: list_dlq_messages
  arguments: {}
  expect:
  - path: total
    at_most: 4
# THE RESOLVER STOPPED, as a reading (O-49). The kill lands at seeding and the
# poll time freezes there, so the age climbs one second per second; the
# graded claim's 20 is reached within a few polls of the settle wait. This is
# what makes the label observable: without it the world would be INC-008's
# again and the run would be graded on a coin flip.
- tool: get_consumer_lag
  arguments:
    consumer_group: dependency-resolver
  attempts: 6
  delay_seconds: 5.0
  expect:
  - path: source
    equals: live
  - path: last_poll_age_seconds
    at_least: 20
# THE SWEEP HELD, as a reading. The pause is what keeps the children waiting
# after the restart, and the briefing has to be able to name it.
- tool: get_control_loops
  arguments: {}
  expect:
  - path: loops[].paused
    where: {field: name, equals: resume_unblocked_waiting}
    equals: true

# Evaluator-only (ADR 0038). The chain read says the shape and the pause
# state, the queue read says there is nothing of the chain to act on, and the
# resolver read is the one that separates this label from its nearest
# neighbour, `saga_coordinator_stall` (PROTOCOL step 4's third question,
# INC-008): polling stopped is this world, polling normally is not. The loop
# read names what the restart does not fix.
discriminating_probes:
- tool: get_dag_state
  argument_pattern:
    job_id: ^4a30546f-d3c5-549f-a772-633c0b26219d$
- tool: list_dlq_messages
- tool: get_consumer_lag
  argument_pattern:
    consumer_group: ^dependency-resolver$
- tool: get_control_loops

# Evaluator-only (ADR 0038), and graded only in the world it describes (ADR
# 0040): what was ACTUALLY wrong, read off the chaos plan and the recorded
# fixtures above and never off the canned planner. Unchanged by O-49: the
# label was always right, it was the reading that was missing.
ground_truth:
  incident_count: 1
  root_causes: [resolver_stall]
  affected_components: [dependency-resolver, resume_unblocked_waiting]
  causal_chain:
  - the dependency-resolver consumer group stops consuming job.completed
  - the resume-unblocked-waiting sweep stops backstopping the promotion
  - descendant 7fb11dea stays in waiting although every parent has completed
  - the workflow never finishes, with no failed node and no dead-letter row
